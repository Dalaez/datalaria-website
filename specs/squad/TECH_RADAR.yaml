# specs/squad/TECH_RADAR.yaml
# Radar Tecnológico Datalaria Helix (v2.0.0)
# Fuente de consulta aislada: NUNCA se inyecta en prompts de tareas rutinarias (INV-HELIX-8).
# Se actualiza en auditorías estratégicas del escuadrón o hitos mayores de roadmap.

metadata:
  version: "2.0.0"
  last_updated: "2026-11-21"
  governance: "ADR-019 / ADR-031 / INV-HELIX-8"
  evaluator: "01-orchestrator + 03-architect"

rings:
  - id: "ADOPT"
    description: "Tecnologías, estándares y herramientas probados en producción y obligatorios para nuevos módulos."
    technologies:
      - name: "Google Chrome Modern Web Guidance 1.0 (Baseline + legacy-scan)"
        role_domain: "04-ux-ui + 05-frontend + 10-security-privacy + 11-qa-verifier"
        use_case: "Skill progresiva (.agents/skills/modern-web-guidance/SKILL.md) con 209 guías cross-browser (Chrome/Edge/Firefox/MDN) y 52 reglas estáticas para priorizar APIs nativas Baseline (<dialog>, Popover, @container, oklch, INP, seguridad DOM)."
      - name: "Native CSS Design Tokens & Modern Platform Primitives"
        role_domain: "04-ux-ui + 05-frontend"
        use_case: "Variables CSS semánticas, @container, subgrid, :has(), :user-invalid, oklch()/light-dark(), text-wrap: balance y SVG inline (cero CDNs en apps offline)."
      - name: "Vite + React 19 + TypeScript + oxlint"
        role_domain: "05-frontend + 11-qa-verifier"
        use_case: "SPAs analíticas B2B con builds reproducibles, tipado estricto y linting ultrarrápido en Rust (0 warnings/errors)."
      - name: "Pydantic v2 + FastAPI + Pytest"
        role_domain: "06-backend-data + 11-qa-verifier"
        use_case: "Contratos tipados estrictos, APIs paginadas O(page_size) con joins PostgREST embebidos y verificación determinista offline."
      - name: "PyJWKClient Local JWT Verification (ECC P-256 / JWKS)"
        role_domain: "07-apis-integrations + 10-security-privacy"
        use_case: "Validación criptográfica local de tokens Supabase ES256/RS256 en ~0.1 ms sin viajes de red a auth.get_user() (ADR-030)."
      - name: "Edge / Chromium Headless CDP E2E & Chrome DevTools MCP"
        role_domain: "04-ux-ui + 05-frontend + 10-security-privacy + 11-qa-verifier"
        use_case: "Bucle build-verify-diagnose en desktop (1440x900) y móvil (390x844) mediante CDP y plugin Chrome DevTools (chrome-devtools, a11y-debugging, debug-optimize-lcp, cookie-debugging, memory-leak-debugging)."
      - name: "PWA Gold (Network-First HTML + SWR JSON + Maskable Icons)"
        role_domain: "05-frontend + 08-media-i18n"
        use_case: "Apps instalables offline con Service Worker seguro (hadController, auto-purga localhost) e iconos any/maskable separados."
      - name: "Hugo + PaperMod + Datalaria Pulse Indexer"
        role_domain: "08-media-i18n"
        use_case: "Portal editorial estático bilingüe ES/EN con paridad 100%, blindaje SEO (ADR-016) y catálogo sincronizado."
      - name: "OpenPyXL + PyMuPDF Kit Factory & Lemon Squeezy (?embed=1)"
        role_domain: "06-backend-data + 09-monetization"
        use_case: "Generación programática de libros Excel/PDF A4 sin glifos rotos y checkout embebido Merchant of Record."

  - id: "TRIAL"
    description: "Capacidades evaluadas en pilotos internos con alto potencial que adoptan fallback ligero."
    technologies:
      - name: "CSS Anchor Positioning, View Transitions & Scroll-Driven Animations"
        role_domain: "04-ux-ui + 05-frontend"
        use_case: "Tooltips, menús y micro-transiciones nativas con @supports fallback <= 20 líneas y respeto a prefers-reduced-motion."
      - name: "scheduler.yield() & content-visibility: auto (INP Engineering)"
        role_domain: "05-frontend"
        use_case: "Optimización de Interaction to Next Paint (INP) en tablas analíticas y dashboards densos."
      - name: "Supabase PostgREST Embedded Joins + SQL RPC Summaries + RLS"
        role_domain: "06-backend-data + 07-apis-integrations"
        use_case: "Persistencia multi-inquilino O(page_size) en cluster datalaria-core sin consultas lineales .in_()."
      - name: "Protocolo Híbrido de 3 Olas (Autopilot 2.2 + CoderLegion X-API-Key)"
        role_domain: "07-apis-integrations + 12-release-devops"
        use_case: "Sindicación escalonada en 24h a coste 0 EUR protegiendo SEO canónico y alcance orgánico (ADR-028)."

  - id: "ASSESS"
    description: "Tecnologías emergentes prometedoras bajo exploración controlada antes de producción."
    technologies:
      - name: "WebMCP (agentic-forms & agentic-javascript-tools)"
        role_domain: "07-apis-integrations + 05-frontend"
        use_case: "Exposición declarativa de sandboxes Datalaria (Helix, Pulse, Weather) para descubrimiento directo por agentes de navegador."
      - name: "Built-in Browser AI APIs (Prompt, Summarizer, Translator)"
        role_domain: "07-apis-integrations + 05-frontend"
        use_case: "Capacidades IA on-device en el cliente con coste 0 EUR y degradación elegante cuando el navegador no las soporta."
      - name: "Apache Parquet + DuckDB-Wasm en Navegador"
        role_domain: "03-architect + 06-backend-data"
        use_case: "Etapa 2 de escalado coste 0 EUR para series históricas > 550k registros sin saturar Supabase Free Tier (ADR-021)."
      - name: "Passkeys (WebAuthn) & Trusted Types / Sanitizer API"
        role_domain: "10-security-privacy + 05-frontend"
        use_case: "Autenticación sin contraseña y defensa estructural anti-XSS en aplicaciones cliente."
      - name: "Tailwind CSS v4 (Lightning CSS)"
        role_domain: "04-ux-ui"
        use_case: "Evaluar únicamente para SPAs React nuevas; mantener CSS nativo puro en apps estáticas sin build Node."

  - id: "HOLD"
    description: "Tecnologías y prácticas desaconsejadas o prohibidas por coste, deuda técnica o seguridad."
    technologies:
      - name: "Librerías JS Legacy para Modales, Tooltips y Popovers (Popper/Tippy/jQuery UI)"
        role_domain: "04-ux-ui + 05-frontend"
        use_case: "Reemplazar por primitivas nativas Baseline (<dialog>, Popover API, CSS Anchor Positioning) guiadas por Modern Web Guidance."
      - name: "CDN Tailwind Runtime (cdn.tailwindcss.com) en Apps Estáticas"
        role_domain: "04-ux-ui + 05-frontend"
        use_case: "Prohibido por romper PWA offline, introducir FOUC/latencia externa y dependencia CDN."
      - name: "Next.js / SSR Pesado y ORMs Pesados en Lambdas"
        role_domain: "03-architect + 06-backend-data"
        use_case: "Evitar lock-in, cold-starts lentos y costes recurrentes; mantener SSG (Hugo) + SPA (Vite) + FastAPI/PostgREST ligero."
      - name: "Credenciales Demo Hardcoded en Frontend o Seeders"
        role_domain: "10-security-privacy"
        use_case: "Prohibido taxativamente (INV-PULSE-10 / GitGuardian); usar Sandbox local sintético y variables .env."
      - name: "Dependencias Agénticas Pesadas en CI (crewai / langchain / gh copilot wrapper)"
        role_domain: "03-architect + 12-release-devops"
        use_case: "Retiradas en ADR-024 en favor de contratos Pydantic v2 deterministas verificables offline por pytest."
