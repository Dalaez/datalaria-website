<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ábaco Arcade — Matemáticas Lúdicas (Datalaria)</title>
  <meta name="theme-color" content="#0ea5e9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/apps/maths/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/apps/maths/icon.svg">
  <link rel="alternate icon" type="image/png" href="/apps/maths/icon-192.png">
  <link rel="apple-touch-icon" href="/apps/maths/apple-touch-icon.png">
  <script>
    // Script Anti-FOUC para tema visual instantáneo
    (function() {
      try {
        var savedTheme = localStorage.getItem('pref-theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <style>
/* apps/maths/styles.css - Design Tokens nativos y estilos Arcade 3D */
:root {
  --bg-canvas: #f0f4ff;
  --bg-surface: #ffffff;
  --bg-elevated: #f8faff;
  --bg-inset: #eef2ff;
  --text-primary: #1e1b4b;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --border-card: #e2e8f0;
  --border-strong: #cbd5e1;

  --op-add: #0ea5e9;
  --op-add-shadow: #0284c7;
  --op-sub: #f59e0b;
  --op-sub-shadow: #d97706;
  --op-mul: #10b981;
  --op-mul-shadow: #059669;
  --op-div: #8b5cf6;
  --op-div-shadow: #7c3aed;
  --op-mixed: #ec4899;
  --op-mixed-shadow: #db2777;

  --status-success: #10b981;
  --status-error: #f43f5e;
  --status-warning: #f59e0b;
  --accent-combo: #ff007a;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 9999px;
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

[data-theme="dark"] {
  --bg-canvas: #0b1120;
  --bg-surface: #1e293b;
  --bg-elevated: #334155;
  --bg-inset: #0f172a;
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --border-card: #334155;
  --border-strong: #475569;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
}

/* Shell Datalaria */
.datalaria-shell {
  background: var(--bg-surface);
  border-bottom: 2px solid var(--border-card);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  z-index: 50;
}

.shell-left, .shell-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.shell-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--text-primary);
  text-decoration: none;
}

.shell-badge {
  background: var(--bg-inset);
  color: var(--op-add);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 0.75rem;
  font-weight: 700;
  font-family: var(--font-mono);
  border: 1px solid rgba(14, 165, 233, 0.25);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.shell-badge:hover {
  background: var(--op-add);
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(14, 165, 233, 0.35);
}

.btn-arcade {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  border-bottom: 3px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s ease, background 0.2s ease;
  user-select: none;
}

.btn-arcade:active {
  transform: translateY(2px);
  border-bottom-width: 1px;
}

.btn-arcade-primary {
  background: var(--op-add);
  color: #ffffff;
  border-color: var(--op-add-shadow);
  border-bottom: 4px solid var(--op-add-shadow);
}
.btn-arcade-primary:active {
  border-bottom-width: 1px;
}

.btn-arcade-success {
  background: var(--status-success);
  color: #ffffff;
  border-color: var(--op-mul-shadow);
  border-bottom: 4px solid var(--op-mul-shadow);
}

.btn-arcade-danger {
  background: var(--status-error);
  color: #ffffff;
  border-color: #be123c;
  border-bottom: 4px solid #be123c;
}

/* Pestañas */
.tabs-nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 16px auto;
  max-width: 600px;
  background: var(--bg-surface);
  padding: 6px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--border-card);
}

.tab-btn {
  flex: 1;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.tab-btn.active {
  background: var(--op-add);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
}

/* Contenedores */
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 16px;
  flex: 1;
  width: 100%;
}

.card {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  border: 2px solid var(--border-card);
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  margin-bottom: 20px;
  position: relative;
}

/* Grid de Niveles y Modos */
.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin: 16px 0;
}

.selectable-item {
  border: 2px solid var(--border-card);
  border-bottom: 4px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 14px;
  background: var(--bg-elevated);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.selectable-item:hover {
  border-color: var(--op-add);
}

.selectable-item.selected {
  border-color: var(--op-add);
  border-bottom-color: var(--op-add-shadow);
  background: var(--bg-inset);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(14, 165, 233, 0.2);
}

/* Tablero de Juego */
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px dashed var(--border-card);
}

.stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-inset);
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 0.9rem;
}

.streak-badge {
  background: linear-gradient(135deg, #f59e0b, #ec4899);
  color: #ffffff;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-weight: 800;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.timer-bar-container {
  width: 100%;
  height: 10px;
  background: var(--bg-inset);
  border-radius: var(--radius-pill);
  overflow: hidden;
  margin: 12px 0;
}

.timer-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--status-success), var(--status-warning), var(--status-error));
  width: 100%;
  transition: width 0.1s linear;
}

/* Área de Problema */
.problem-box {
  text-align: center;
  padding: 20px;
  background: var(--bg-inset);
  border-radius: var(--radius-md);
  margin: 16px 0;
}

.problem-text {
  font-family: var(--font-mono);
  font-size: 3rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.answer-display-box {
  min-height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 2.2rem;
  font-weight: 800;
  color: var(--op-add);
  background: var(--bg-surface);
  border: 2px solid var(--op-add);
  border-radius: var(--radius-md);
  max-width: 260px;
  margin: 0 auto;
  padding: 0 16px;
}

/* Numpad Táctil 3D */
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 320px;
  margin: 20px auto 0;
}

.numpad-btn {
  font-family: var(--font-mono);
  font-size: 1.5rem;
  font-weight: 700;
  height: 60px;
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  border: 2px solid var(--border-strong);
  border-bottom: 5px solid var(--border-strong);
  color: var(--text-primary);
  cursor: pointer;
  transition: transform 0.08s ease;
  user-select: none;
}

.numpad-btn:active {
  transform: translateY(3px);
  border-bottom-width: 2px;
}

.numpad-btn.action-enter {
  background: var(--status-success);
  color: #ffffff;
  border-color: var(--op-mul-shadow);
  border-bottom-color: var(--op-mul-shadow);
}

.numpad-btn.action-del {
  background: var(--status-error);
  color: #ffffff;
  border-color: #be123c;
  border-bottom-color: #be123c;
}

/* Confeti Canvas */
#confetti-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 100;
}

/* Medallas */
.medals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}

.medal-card {
  padding: 16px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-card);
  background: var(--bg-elevated);
  text-align: center;
  transition: all 0.2s ease;
}

.medal-card.unlocked {
  border-color: #fbbf24;
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), var(--bg-elevated));
}

.medal-icon {
  font-size: 3rem;
  margin-bottom: 8px;
}

.medal-card.locked .medal-icon {
  filter: grayscale(1) opacity(0.4);
}

/* Utilidades */
.hidden { display: none !important; }
.text-center { text-align: center; }
.mt-4 { margin-top: 16px; }

/* Botón Instalar PWA */
.btn-arcade-install {
  background: linear-gradient(135deg, #10b981, #0ea5e9);
  color: #ffffff;
  border-color: #059669;
  border-bottom: 3px solid #047857;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Banner de Feedback Formativo */
.feedback-banner {
  margin: 12px auto;
  max-width: 480px;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.feedback-success {
  background: rgba(16, 185, 129, 0.15);
  border: 2px solid var(--status-success);
  color: #065f46;
}
[data-theme="dark"] .feedback-success {
  color: #6ee7b7;
}

.feedback-error {
  background: rgba(244, 63, 94, 0.15);
  border: 2px solid var(--status-error);
  color: #9f1239;
}
[data-theme="dark"] .feedback-error {
  color: #fca5a5;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.92) translateY(-6px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* Toasts flotantes */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  background: var(--bg-surface);
  color: var(--text-primary);
  border: 2px solid var(--border-strong);
  padding: 12px 20px;
  border-radius: var(--radius-md);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  font-weight: 600;
  font-size: 0.95rem;
  pointer-events: auto;
  animation: slideUp 0.3s ease;
  max-width: 360px;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* PWA Reactive Update Banner */
.pwa-update-banner {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 0.85rem;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(56, 189, 248, 0.4);
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.2);
  padding: 0.65rem 1rem;
  border-radius: var(--radius-md, 12px);
  color: #f8fafc;
  animation: slideUpUpdate 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="light"] .pwa-update-banner {
  background: rgba(255, 255, 255, 0.96);
  border-color: rgba(14, 165, 233, 0.45);
  box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.2);
  color: #0f172a;
}

@keyframes slideUpUpdate {
  from {
    transform: translateY(100%) scale(0.95);
    opacity: 0;
  }
  to {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

.update-banner-content {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  font-weight: 500;
}

.update-icon {
  font-size: 1.1rem;
  animation: pulseIcon 1.5s infinite;
}

@keyframes pulseIcon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.btn-pwa-update-action {
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
  color: #ffffff;
  border: none;
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius-sm, 6px);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.btn-pwa-update-action:hover {
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
}

@media (max-width: 640px) {
  .pwa-update-banner {
    left: 1rem;
    right: 1rem;
    bottom: 1rem;
    justify-content: space-between;
  }
}

/* Hito 2: Tira Visual Wordle, Compartir Resultado y Repaso de Fallos */
.round-blocks-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  font-size: 1.6rem;
  letter-spacing: 2px;
  margin: 16px auto;
  padding: 10px 16px;
  background: var(--bg-inset);
  border-radius: var(--radius-pill);
  max-width: fit-content;
  user-select: all;
}

.btn-share-result {
  background: linear-gradient(135deg, #8b5cf6, #3b82f6);
  color: #ffffff;
  border-color: #6d28d9;
  border-bottom: 3px solid #5b21b6;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}

.btn-share-result:hover {
  filter: brightness(1.1);
  transform: translateY(-2px);
}

.mistake-review-section {
  margin-top: 32px;
  text-align: left;
  border-top: 2px dashed var(--border-card);
  padding-top: 24px;
}

.mistake-review-title {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.mistake-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.mistake-card {
  background: var(--bg-elevated);
  border: 2px solid var(--border-card);
  border-left: 5px solid var(--status-error);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  transition: transform 0.15s ease;
}

.mistake-card:hover {
  transform: translateX(4px);
}

.mistake-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.mistake-problem-text {
  font-size: 1.25rem;
  font-weight: 800;
  font-family: var(--font-mono);
  color: var(--text-primary);
}

.mistake-details {
  display: flex;
  gap: 16px;
  font-size: 0.92rem;
  margin-top: 6px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.mistake-details strong {
  color: var(--text-primary);
}

.mistake-hint-toggle {
  margin-top: 10px;
}

.mistake-hint-container {
  margin-top: 10px;
  padding: 10px;
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-card);
}

/* Hito 3: Perfiles Familiares Multi-Jugador & Diploma Arcade PNG */
.profile-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 16px;
  background: var(--bg-inset);
  border-bottom: 1px solid var(--border-card);
}

.profile-bar-label {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

.profile-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}

.profile-chip:hover {
  transform: translateY(-1px);
  color: var(--text-primary);
  border-color: var(--op-add);
}

.profile-chip.active {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(16, 185, 129, 0.15));
  border-color: var(--op-add);
  color: var(--op-add);
  box-shadow: 0 0 10px rgba(14, 165, 233, 0.25);
}

.btn-arcade-diploma {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #ffffff;
  border-color: #b45309;
  border-bottom: 4px solid #92400e;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}

.btn-arcade-diploma:hover {
  filter: brightness(1.1);
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
}

.diploma-promo-card {
  margin-top: 24px;
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(251, 191, 36, 0.04));
  border: 2px dashed #f59e0b;
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: center;
}



  </style>
</head>
<body>
  <header class="datalaria-shell">
    <div class="shell-left">
      <a id="datalaria-back-link" href="/es/apps/" class="btn-arcade">← Datalaria</a>
      <a href="/apps/maths/" class="shell-brand">
        <span>🧮</span>
        <span id="shell-app-title">Ábaco Arcade</span>
        <button id="btn-check-update" class="shell-badge" title="Buscar actualizaciones (v2.3.0)">v2.3.0</button>
      </a>
    </div>

    <div class="shell-right">
      <button id="btn-install-pwa" class="btn-arcade btn-arcade-install" style="display: none;" title="Instalar en pantalla de inicio">
        <span>📲</span> <span id="label-install-btn">Instalar</span>
      </button>
      <button id="sound-btn" class="btn-arcade" title="Sonido (M)">🔊</button>
      <button id="theme-btn" class="btn-arcade" title="Tema (T)">☀️/🌙</button>
      <button id="lang-btn" class="btn-arcade" style="font-weight: 700;">🇪🇸 ES</button>
      <a id="link-spec" href="/es/apps/maths/" class="btn-arcade">📋 Ficha App</a>

// apps/maths/engine.js - Motor aritmético procedural, PRNG determinista por semilla, evaluador y pistas visuales
(function(window) {
  // Generador pseudoaleatorio determinista por semilla (PRNG Mulberry32)
  function createSeededRng(seedStr) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < seedStr.length; i++) {
      h = Math.imul(h ^ seedStr.charCodeAt(i), 16777619);
    }
    return function() {
      h += 0x6D2B79F5;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randInt(min, max, rng) {
    const f = (typeof rng === 'function') ? rng : Math.random;
    return Math.floor(f() * (max - min + 1)) + min;
  }

  function pickRandom(arr, rng) {
    const f = (typeof rng === 'function') ? rng : Math.random;
    return arr[Math.floor(f() * arr.length)];
  }

  const MathsEngine = {
    randInt,
    createSeededRng,

    // Genera un reto determinista según nivel, idioma y generador PRNG (robusto ante null/undefined)
    generateProblem: function(levelId, lang = 'es', rng) {
      if (typeof rng !== 'function') {
        rng = Math.random;
      }
      switch (levelId) {
        case 'l1': {
          // Nivel 1: Sumas de 1 dígito con resultado <= 10
          const a = randInt(1, 5, rng);
          const b = randInt(1, 5, rng);
          return {
            type: 'standard',
            op: '+',
            a, b,
            answer: a + b,
            display: `${a} + ${b} = ?`,
            visual: { type: 'group', a, b, symbol: '🍎' }
          };
        }
        case 'l2': {
          // Nivel 2: Sumas y restas (1-2 dígitos, sin negativos)
          const op = pickRandom(['+', '-'], rng);
          if (op === '+') {
            const a = randInt(2, 9, rng);
            const b = randInt(2, 9, rng);
            return {
              type: 'standard',
              op: '+',
              a, b,
              answer: a + b,
              display: `${a} + ${b} = ?`,
              visual: { type: 'group', a, b, symbol: '⭐' }
            };
          } else {
            let a = randInt(3, 15, rng);
            let b = randInt(1, a, rng); // asegura a >= b
            return {
              type: 'standard',
              op: '-',
              a, b,
              answer: a - b,
              display: `${a} − ${b} = ?`,
              visual: { type: 'takeaway', total: a, remove: b, symbol: '🎈' }
            };
          }
        }
        case 'l3': {
          // Nivel 3: Sumas, Restas y Multiplicación
          const op = pickRandom(['+', '-', '×'], rng);
          if (op === '×') {
            const a = randInt(2, 9, rng);
            const b = randInt(2, 9, rng);
            return {
              type: 'standard',
              op: '×',
              a, b,
              answer: a * b,
              display: `${a} × ${b} = ?`,
              visual: { type: 'grid', rows: a, cols: b, symbol: '🟦' }
            };
          } else if (op === '+') {
            const a = randInt(10, 50, rng);
            const b = randInt(5, 40, rng);
            return {
              type: 'standard',
              op: '+',
              a, b,
              answer: a + b,
              display: `${a} + ${b} = ?`,
              visual: null
            };
          } else {
            let a = randInt(15, 60, rng);
            let b = randInt(5, a, rng);
            return {
              type: 'standard',
              op: '-',
              a, b,
              answer: a - b,
              display: `${a} − ${b} = ?`,
              visual: null
            };
          }
        }
        case 'l4': {
          // Nivel 4: 4 operaciones (División con cociente y resto)
          const op = pickRandom(['+', '-', '×', '÷'], rng);
          if (op === '÷') {
            const divisor = randInt(2, 9, rng);
            const quotient = randInt(1, 9, rng);
            const remainder = randInt(0, divisor - 1, rng);
            const dividend = divisor * quotient + remainder;
            return {
              type: 'division',
              op: '÷',
              dividend,
              divisor,
              quotient,
              remainder,
              display: `${dividend} ÷ ${divisor} = ?`,
              visual: { type: 'share', total: dividend, groups: divisor, quotient, remainder, symbol: '🍪' }
            };
          } else if (op === '×') {
            const a = randInt(3, 12, rng);
            const b = randInt(3, 9, rng);
            return {
              type: 'standard',
              op: '×',
              a, b,
              answer: a * b,
              display: `${a} × ${b} = ?`,
              visual: { type: 'grid', rows: a, cols: b, symbol: '💎' }
            };
          } else if (op === '+') {
            const a = randInt(25, 99, rng);
            const b = randInt(15, 99, rng);
            return { type: 'standard', op: '+', a, b, answer: a + b, display: `${a} + ${b} = ?`, visual: null };
          } else {
            let a = randInt(30, 99, rng);
            let b = randInt(10, a, rng);
            return { type: 'standard', op: '-', a, b, answer: a - b, display: `${a} − ${b} = ?`, visual: null };
          }
        }
        case 'l5': {
          // Nivel 5: Cerebro Ágil (Combinadas e Incógnitas)
          const kind = pickRandom(['combined', 'unknown'], rng);
          if (kind === 'combined') {
            const a = randInt(2, 20, rng);
            const b = randInt(2, 8, rng);
            const c = randInt(2, 9, rng);
            const answer = a + (b * c);
            return {
              type: 'standard',
              op: 'combined',
              answer,
              display: `${a} + ${b} × ${c} = ?`,
              hintText: { es: 'Recuerda: la multiplicación se hace primero', en: 'Remember: multiplication comes first' },
              visual: null
            };
          } else {
            const a = randInt(12, 50, rng);
            const answer = randInt(5, 40, rng);
            const total = a + answer;
            return {
              type: 'standard',
              op: 'unknown',
              answer,
              display: `${a} + ? = ${total}`,
              hintText: { es: 'Resta el primer número al total', en: 'Subtract the first number from total' },
              visual: null
            };
          }
        }
        case 'l6': {
          // Nivel 6: Leyenda Cuántica (Porcentajes y Potencias)
          const kind = pickRandom(['pct', 'square', 'math_fast'], rng);
          if (kind === 'pct') {
            const pct = pickRandom([10, 20, 25, 50], rng);
            let base;
            if (pct === 25) base = randInt(1, 10, rng) * 40;
            else if (pct === 50) base = randInt(2, 20, rng) * 10;
            else base = randInt(2, 25, rng) * 10;
            const answer = (pct / 100) * base;
            const ofWord = lang === 'en' ? 'of' : 'de';
            return {
              type: 'standard',
              op: '%',
              answer,
              display: `${pct}% ${ofWord} ${base} = ?`,
              hintText: { es: `${pct}% equivale a la fracción adecuada`, en: `${pct}% equals the corresponding fraction` },
              visual: null
            };
          } else if (kind === 'square') {
            const num = randInt(6, 16, rng);
            const answer = num * num;
            return {
              type: 'standard',
              op: 'sq',
              answer,
              display: `${num}² = ?`,
              hintText: { es: `Multiplica ${num} por sí mismo`, en: `Multiply ${num} by itself` },
              visual: null
            };
          } else {
            const a = randInt(11, 25, rng);
            const b = randInt(3, 9, rng);
            return {
              type: 'standard',
              op: '×',
              a, b,
              answer: a * b,
              display: `${a} × ${b} = ?`,
              visual: null
            };
          }
        }
        default:
          return this.generateProblem('l1', lang, rng);
      }
    },

    // Evalúa si la respuesta proporcionada por el usuario es correcta
    evaluateAnswer: function(problem, userVal, userQuo, userRem, lang = 'es') {
      if (problem.type === 'division') {
        const q = parseInt(userQuo, 10);
        const r = parseInt(userRem, 10);
        const isCorrect = (!isNaN(q) && !isNaN(r) && q === problem.quotient && r === problem.remainder);
        const qLabel = lang === 'en' ? 'Quotient' : 'Cociente';
        const rLabel = lang === 'en' ? 'Remainder' : 'Resto';
        return {
          isCorrect,
          correctDisplay: `${qLabel}: ${problem.quotient}, ${rLabel}: ${problem.remainder}`
        };
      } else {
        const val = parseInt(userVal, 10);
        const isCorrect = (!isNaN(val) && val === problem.answer);
        return {
          isCorrect,
          correctDisplay: `${problem.answer}`
        };
      }
    },

    // Generador de HTML para el manipulador visual interactivo
    renderVisualHint: function(visual, lang) {
      if (!visual) {
        return `<div class="p-3 text-center text-sm opacity-80">${lang === 'es' ? '💡 Reto abstracto. ¡Usa tu mente y lápiz si lo necesitas!' : '💡 Abstract challenge. Use your mind or a scratchpad!'}</div>`;
      }

      let html = '<div class="visual-hint-box p-4 rounded-2xl bg-white/70 shadow-inner flex flex-wrap items-center justify-center gap-3">';
      if (visual.type === 'group') {
        html += `<div class="flex items-center gap-2 bg-sky-50 px-3 py-2 rounded-xl border border-sky-200">`;
        for (let i = 0; i < visual.a; i++) html += `<span class="text-2xl">${visual.symbol}</span>`;
        html += `<strong class="ml-1 text-sky-800">(${visual.a})</strong></div>`;
        html += `<span class="text-2xl font-bold text-sky-600">+</span>`;
        html += `<div class="flex items-center gap-2 bg-amber-50 px-3 py-2 rounded-xl border border-amber-200">`;
        for (let i = 0; i < visual.b; i++) html += `<span class="text-2xl">${visual.symbol}</span>`;
        html += `<strong class="ml-1 text-amber-800">(${visual.b})</strong></div>`;
      } else if (visual.type === 'takeaway') {
        html += `<div class="flex flex-wrap items-center gap-2 bg-amber-50 px-3 py-2 rounded-xl border border-amber-200">`;
        for (let i = 0; i < visual.total; i++) {
          if (i >= visual.total - visual.remove) {
            html += `<span class="text-2xl opacity-40 line-through filter grayscale">${visual.symbol}</span>`;
          } else {
            html += `<span class="text-2xl">${visual.symbol}</span>`;
          }
        }
        html += `<span class="ml-2 text-sm text-amber-800 font-semibold">${lang === 'es' ? `Había ${visual.total}, quitamos ${visual.remove}` : `There were ${visual.total}, took away ${visual.remove}`}</span></div>`;
      } else if (visual.type === 'grid') {
        html += `<div class="inline-grid gap-1 bg-emerald-50 p-3 rounded-xl border border-emerald-200" style="grid-template-columns: repeat(${visual.cols}, minmax(0, 1fr));">`;
        for (let r = 0; r < visual.rows; r++) {
          for (let c = 0; c < visual.cols; c++) {
            html += `<span class="text-xl">${visual.symbol}</span>`;
          }
        }
        html += `</div><div class="text-sm font-semibold text-emerald-800">${visual.rows} ${lang === 'es' ? 'filas' : 'rows'} × ${visual.cols} ${lang === 'es' ? 'columnas' : 'cols'}</div>`;
      } else if (visual.type === 'share') {
        html += `<div class="flex flex-wrap gap-2 justify-center items-center">`;
        for (let g = 0; g < visual.groups; g++) {
          html += `<div class="bg-purple-50 p-2 rounded-xl border-2 border-dashed border-purple-300 text-center min-w-[60px]"><span class="text-xs block text-purple-700 font-bold">${lang === 'es' ? 'Caja' : 'Box'} ${g+1}</span><div class="flex gap-1 justify-center mt-1">`;
          for (let q = 0; q < visual.quotient; q++) html += `<span class="text-xl">${visual.symbol}</span>`;
          html += `</div></div>`;
        }
        if (visual.remainder > 0) {
          html += `<div class="bg-rose-50 p-2 rounded-xl border border-rose-300 text-center"><span class="text-xs block text-rose-700 font-bold">${lang === 'es' ? 'Sobra (Resto)' : 'Leftover (Rem)'}</span><div class="flex gap-1 justify-center mt-1">`;
          for (let rem = 0; rem < visual.remainder; rem++) html += `<span class="text-xl">${visual.symbol}</span>`;
          html += `</div></div>`;
        }
        html += `</div>`;
      }
      html += '</div>';
      return html;
    }
  };

  window.MathsEngine = MathsEngine;
})(window);

// apps/maths/audio.js - Sintetizador nativo procedural con Web Audio API y confeti físico
(function(window) {
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  const MathsAudio = {
    toggleSound: function() {
      soundEnabled = !soundEnabled;
      return soundEnabled;
    },
    isSoundEnabled: function() {
      return soundEnabled;
    },
    playTone: function(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Ignorar de forma resiliente si el navegador bloquea audio
      }
    },

    playSuccess: function(combo = 1) {
      if (!soundEnabled) return;
      initAudio();
      // Arpegio alegre ascendente
      const base = 523.25; // Do5
      const note2 = base * (combo >= 2 ? 1.25 : 1.2); 
      const note3 = base * (combo >= 3 ? 1.5 : 1.33);

      this.playTone(base, 'triangle', 0.12, 0.12);
      setTimeout(() => this.playTone(note2, 'triangle', 0.12, 0.12), 80);
      setTimeout(() => this.playTone(note3, 'sine', 0.25, 0.15), 160);
      if (combo >= 5) {
        setTimeout(() => this.playTone(base * 2, 'square', 0.3, 0.08), 240);
      }
    },

    playError: function() {
      if (!soundEnabled) return;
      initAudio();
      // Tono descendente suave tipo "oh-oh"
      this.playTone(280, 'sawtooth', 0.15, 0.06);
      setTimeout(() => this.playTone(220, 'sawtooth', 0.2, 0.06), 120);
    },

    playClick: function() {
      this.playTone(600, 'sine', 0.04, 0.05);
    },

    playWin: function() {
      if (!soundEnabled) return;
      const notes = [440, 554.37, 659.25, 880];
      notes.forEach((freq, idx) => {
        setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.12), idx * 100);
      });
    },

    // Confeti físico sobre canvas
    launchConfetti: function(canvasEl) {
      if (!canvasEl) return;
      const ctx = canvasEl.getContext('2d');
      const width = canvasEl.width = canvasEl.offsetWidth;
      const height = canvasEl.height = canvasEl.offsetHeight;

      const particles = [];
      const colors = ['#0ea5e9', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#f43f5e'];

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: width / 2,
          y: height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      let animId;
      function render() {
        ctx.clearRect(0, 0, width, height);
        let active = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // gravedad
          p.rotation += p.vRot;
          p.opacity -= 0.012;

          if (p.opacity > 0) {
            active = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (active) {
          animId = requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, width, height);
          cancelAnimationFrame(animId);
        }
      }

      render();
    }
  };

  window.MathsAudio = MathsAudio;
})(window);

    unlockedMedals: []

  function getStorageKey(profileId = activeProfileId) {
    return `datalaria_maths_v2_stats_${profileId}`;
  }

  function loadStats() {
    // 1. Cargar perfil activo guardado
    try {
      const savedProfile = localStorage.getItem('datalaria_maths_active_profile');
      if (savedProfile && catalog.profiles && catalog.profiles.some(p => p.id === savedProfile)) {
        activeProfileId = savedProfile;
      }
    } catch (e) { }

    // 2. Migración retrocompatible de datos anteriores a player_1
    try {
      const legacyData = localStorage.getItem('datalaria_maths_v2_stats');
      if (legacyData && !localStorage.getItem('datalaria_maths_v2_stats_player_1')) {
        localStorage.setItem('datalaria_maths_v2_stats_player_1', legacyData);
      }
    } catch (e) { }

    // 3. Cargar estadísticas aisladas del perfil activo
    userStats = {
      highScores: {},
      bestStreakEver: 0,
      unlockedMedals: []
    };
    try {
      const data = localStorage.getItem(getStorageKey());
      if (data) userStats = JSON.parse(data);
    } catch (e) { }

    // 4. Cargar sonido
    try {
      const savedSound = localStorage.getItem('maths-sound');
      if (savedSound !== null) {
        if ((savedSound === 'true') !== audio.isSoundEnabled()) {
          audio.toggleSound();
        }
      }
    } catch (e) { }
  }

    try {

        if (activeDivisionField === 'quo') inputQuo = inputQuo.slice(0, -1);

    } else if (key === 'enter') {

    } else {
      if (!isDivision) {
        if (inputVal.length < 5) inputVal += key;
      } else {
        if (activeDivisionField === 'quo') {
          if (inputQuo.length < 4) inputQuo += key;

    if (!isDivision && inputVal === '') return;
    if (isDivision && (inputQuo === '' || inputRem === '')) return;

    const evaluation = engine.evaluateAnswer(currentProblem, inputVal, inputQuo, inputRem, lang);
    handleAnswerSubmit(evaluation.isCorrect, false, evaluation.correctDisplay);
  }

  function handleAnswerSubmit(isCorrect, isSkipped = false, correctDisplay = '') {
    clearInterval(timerInterval);
    clearTimeout(feedbackTimeout);

    const bannerContainer = document.getElementById('feedback-banner-container');
    let pointsEarned = 0;
    const resolvedCorrectDisplay = correctDisplay || (currentProblem ? (currentProblem.answer !== undefined ? String(currentProblem.answer) : `${t('quotient')}: ${currentProblem.quotient}, ${t('remainder')}: ${currentProblem.remainder}`) : '');

    // Registro de ronda para tira Wordle y repaso de fallos
    roundHistory.push({
      round: roundIndex,
      problem: currentProblem,
      isCorrect: isCorrect,
      usedHint: hintUsedThisRound,
      skipped: isSkipped,
      userVal: inputVal,
      userQuo: inputQuo,
      userRem: inputRem,
      correctDisplay: resolvedCorrectDisplay
    });

    if (isCorrect) {
      streak += 1;
      if (streak > bestStreak) bestStreak = streak;
      correctCount += 1;
      const multiplier = streak >= 5 ? 3 : (streak >= 3 ? 2 : 1);
      pointsEarned = Math.round((100 + (selectedMode === 'classic' || selectedMode === 'daily' ? timeLeft * 10 : 0)) * multiplier);
      score += pointsEarned;
      audio.playSuccess(streak);

      if (selectedMode === 'time_attack' && streak > 0 && streak % 5 === 0) {
        timeLeft = Math.min(60, timeLeft + 3);
      }

      if (bannerContainer) {
        bannerContainer.innerHTML = `
          <div class="feedback-banner feedback-success">
            <span>${t('awesome')} +${pointsEarned} pts</span>
            <span>⭐</span>
          </div>
        `;
      }
    } else {
      streak = 0;
      wrongCount += 1;
      if (!isSkipped) audio.playError();

      if (bannerContainer) {
        bannerContainer.innerHTML = `
          <div class="feedback-banner feedback-error">
            <span>${isSkipped ? t('good_try') : t('good_try')} ${t('correct_answer_is')} <strong>${resolvedCorrectDisplay}</strong></span>
            <button id="btn-next-fast" class="btn-arcade" style="padding: 4px 10px; font-size: 0.8rem; background: var(--bg-surface);">${t('next_question_btn')}</button>
          </div>
        `;
        const nextBtn = document.getElementById('btn-next-fast');
        if (nextBtn) {
          nextBtn.onclick = () => {
            clearTimeout(feedbackTimeout);
            advanceRound();
          };
        }
      }
    }

    checkMedalsProgress();
    inFeedbackPause = true;

    // Pausa pedagógica: corta en aciertos (700ms), didáctica en fallos (1800ms)
    const pauseMs = isCorrect ? 700 : 1800;
    feedbackTimeout = setTimeout(() => {
      advanceRound();
    }, pauseMs);
  }

  function advanceRound() {
    inFeedbackPause = false;
    if ((selectedMode === 'classic' || selectedMode === 'daily') && roundIndex >= TOTAL_ROUNDS) {
      finishGame();
    } else if (selectedMode === 'time_attack' && timeLeft <= 0) {
      finishGame();
    } else {
      nextProblem();
    }
  }

  function startGameSession() {
    inGame = true;
    inFeedbackPause = false;
    roundIndex = 0;
    score = 0;
    correctCount = 0;
    wrongCount = 0;
    streak = 0;
    bestStreak = 0;
    isHintVisible = false;
    hintUsedThisRound = false;
    roundHistory = [];

    if (selectedMode === 'daily') {
      const todayStr = new Date().toISOString().slice(0, 10);
      const dailySeed = `${todayStr}_${selectedLevel}`;
      dailyRng = engine.createSeededRng(dailySeed);
    } else {
      dailyRng = null;
    }

    if (selectedMode === 'time_attack') {
      timeTotal = 60;
      timeLeft = 60;
    } else {
      timeTotal = 10;
      timeLeft = 10;
    }

    nextProblem();
  }

  function nextProblem() {
    roundIndex += 1;
    inputVal = '';
    inputQuo = '';
    inputRem = '';
    activeDivisionField = 'quo';
    isHintVisible = false;
    hintUsedThisRound = false;
    const prng = (selectedMode === 'daily' && typeof dailyRng === 'function') ? dailyRng : Math.random;
    currentProblem = engine.generateProblem(selectedLevel, lang, prng);

    if (selectedMode === 'classic' || selectedMode === 'daily') {
      timeTotal = 10;
      timeLeft = 10;
    }

    renderActiveGame(document.getElementById('tab-content'));
    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    if (selectedMode === 'zen') return;

    timerInterval = setInterval(() => {
      if (inFeedbackPause) return;
      timeLeft -= 0.1;
      const fillEl = document.getElementById('timer-bar-fill');
      if (fillEl) {
        const pct = Math.max(0, (timeLeft / timeTotal) * 100);
        fillEl.style.width = pct + '%';
      }

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        const correctTxt = currentProblem ? (currentProblem.answer !== undefined ? String(currentProblem.answer) : `${t('quotient')}: ${currentProblem.quotient}, ${t('remainder')}: ${currentProblem.remainder}`) : '';
        handleAnswerSubmit(false, false, correctTxt);
      }
    }, 100);
  }

  function finishGame() {
    clearInterval(timerInterval);
    clearTimeout(feedbackTimeout);
    inGame = false;
    inFeedbackPause = false;
    audio.playWin();

    if (!userStats.highScores[selectedLevel] || score > userStats.highScores[selectedLevel]) {
      userStats.highScores[selectedLevel] = score;
    }
    if (bestStreak > userStats.bestStreakEver) {
      userStats.bestStreakEver = bestStreak;
    }
    saveStats();

    const container = document.getElementById('tab-content');
    const totalPlayed = roundHistory.length || roundIndex;
    const accuracy = (totalPlayed > 0) ? Math.round((correctCount / totalPlayed) * 100) : 0;

    // Tira visual estilo Wordle (🟩 Acierto limpio, 💡 Acierto con pista, 🟥 Fallo)
    const emojiStrip = roundHistory.map(r => {
      if (r.isCorrect && !r.usedHint) return '🟩';
      if (r.isCorrect && r.usedHint) return '💡';
      return '🟥';
    }).join('');

    // Preparar lista de fallos para repaso didáctico
    const mistakes = roundHistory.filter(r => !r.isCorrect);
    let mistakesHtml = '';
    if (mistakes.length > 0) {
      mistakesHtml = `
        <div class="mistake-review-section">
          <div class="mistake-review-title">
            <span>${t('mistake_review_title')}</span>
            <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">(${mistakes.length})</span>
          </div>
          <div class="mistake-list">
            ${mistakes.map((m, idx) => `
              <div class="mistake-card">
                <div class="mistake-header">
                  <span class="mistake-problem-text">${m.problem ? m.problem.display : '...'}</span>
                  <span style="font-size: 0.85rem; color: var(--status-error); font-weight: 700;">${t('round')} ${m.round}</span>
                </div>
                <div class="mistake-details">
                  <span>${t('mistake_your_answer')} <strong>${m.userVal || (m.userQuo !== '' ? `${m.userQuo} (r:${m.userRem})` : (m.skipped ? t('skip') : '⏱️'))}</strong></span>
                  <span>${t('mistake_correct_answer')} <strong style="color: var(--status-success);">${m.correctDisplay}</strong></span>
                </div>
                <div class="mistake-hint-toggle">
                  <button class="btn-arcade btn-mistake-hint" data-mistake-idx="${idx}" style="font-size: 0.8rem; padding: 4px 10px; background: var(--bg-surface);">
                    ${t('view_hint_btn')}
                  </button>
                  <div id="mistake-hint-${idx}" class="mistake-hint-container hidden">
                    ${m.problem ? engine.renderVisualHint(m.problem.visual, lang) : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else if (roundHistory.length > 0) {
      mistakesHtml = `
        <div class="mistake-review-section" style="text-align: center;">
          <div style="background: rgba(16, 185, 129, 0.15); border: 2px solid var(--status-success); border-radius: var(--radius-md); padding: 14px 20px; color: #065f46; font-weight: 700;">
            ${t('mistake_review_empty')}
          </div>
        </div>
      `;
    }

    let html = `
      <div class="card text-center" style="position: relative;">
        <canvas id="confetti-canvas"></canvas>
        <div style="font-size: 4rem; margin-bottom: 12px;">🏆</div>
        <h2 style="font-size: 2rem; font-weight: 800; color: var(--text-primary);">${t('game_over')}</h2>
        
        <div style="display: flex; gap: 16px; justify-content: center; margin: 20px 0 12px; flex-wrap: wrap;">
          <div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">⭐ ${t('points')}: <strong>${score}</strong></div>
          <div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">🎯 ${t('accuracy')}: <strong>${accuracy}%</strong></div>
          <div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">🔥 ${t('best_streak')}: <strong>${bestStreak}</strong></div>
        </div>

        ${emojiStrip ? `
          <div class="round-blocks-strip" title="Resumen gráfico de respuestas">${emojiStrip}</div>
        ` : ''}

        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
          <button id="btn-share-result" class="btn-arcade btn-share-result" style="font-size: 1.05rem; padding: 12px 22px;">
            ${t('share_result_btn')}
          </button>
          <button id="btn-again" class="btn-arcade btn-arcade-primary" style="font-size: 1.05rem; padding: 12px 22px;">
            ${t('play_again')}
          </button>
          <button id="btn-finish-diploma" class="btn-arcade btn-arcade-diploma" style="font-size: 1.05rem; padding: 12px 22px;">
            ${t('download_diploma_btn')}
          </button>
          <button id="btn-badges" class="btn-arcade" style="font-size: 1.05rem; padding: 12px 22px;">
            ${t('view_achievements')}
          </button>
        </div>

        ${mistakesHtml}
      </div>
    `;
    container.innerHTML = html;

    const canvas = document.getElementById('confetti-canvas');
    if (canvas) audio.launchConfetti(canvas);

    document.getElementById('btn-again').onclick = () => {
      startGameSession();
    };
    document.getElementById('btn-finish-diploma').onclick = downloadArcadeDiploma;
    document.getElementById('btn-badges').onclick = () => {
      activeTab = 'achievements';
      renderAll();
    };

    document.getElementById('btn-share-result').onclick = () => {
      audio.playClick();
      const todayStr = new Date().toISOString().slice(0, 10);
      const levelObj = catalog.levels.find(l => l.id === selectedLevel);
      const levelName = levelObj ? levelObj.name[lang] : selectedLevel;
      const modeObj = catalog.modes.find(m => m.id === selectedMode);
      const modeName = selectedMode === 'daily'
        ? `${t('daily_challenge_label')} (${todayStr})`
        : (modeObj ? modeObj.name[lang] : selectedMode);

      const shareUrl = `${window.location.origin}${window.location.pathname}?mode=${selectedMode}&level=${selectedLevel}${selectedMode === 'daily' ? '&date=' + todayStr : ''}`;
      const shareText = `Datalaria Maths · ${modeName}\n${levelName} | ⭐ ${score} pts (${correctCount}/${totalPlayed})\n${emojiStrip}\n${shareUrl}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareText).then(() => {
          showToast(t('share_result_copied'));
        }).catch(() => {
          showToast(t('share_result_copied'));
        });
      } else {
        showToast(t('share_result_copied'));
      }
    };

    container.querySelectorAll('.btn-mistake-hint').forEach(btn => {
      btn.onclick = () => {
        const idx = btn.getAttribute('data-mistake-idx');
        const box = document.getElementById(`mistake-hint-${idx}`);
        if (box) box.classList.toggle('hidden');
      };
    });
  }

  function endGameSession() {
    clearInterval(timerInterval);
    clearTimeout(feedbackTimeout);
    inGame = false;
    inFeedbackPause = false;
  }

  function checkMedalsProgress() {
    function unlock(medalId) {
      if (!userStats.unlockedMedals.includes(medalId)) {
        userStats.unlockedMedals.push(medalId);
        saveStats();
        showToast(`🎖️ ${t('badge_unlocked')}`);
      }
    }

    if (correctCount >= 1) unlock('first_win');
    if (streak >= 5) unlock('streak_5');
    if (streak >= 10) unlock('streak_10');
    if (currentProblem && currentProblem.type === 'division') unlock('div_master');
    if ((selectedLevel === 'l5' || selectedLevel === 'l6') && correctCount >= 8) unlock('brain_power');
    if (selectedMode === 'time_attack' && correctCount >= 12) unlock('time_hero');
  }

  // Generador de Diploma Arcade PNG en Canvas 2D (INV-MATHS-11)
  function downloadArcadeDiploma() {
    audio.playSuccess(3);
    showToast(t('diploma_downloaded_toast'), 3000);

    const canvas = document.createElement('canvas');
    canvas.width = 1200;
    canvas.height = 800;
    const ctx = canvas.getContext('2d');

    // 1. Fondo suave pergamino / marfil
    ctx.fillStyle = '#fdfbf7';
    ctx.fillRect(0, 0, 1200, 800);

    const bgGrad = ctx.createLinearGradient(0, 0, 1200, 800);
    bgGrad.addColorStop(0, 'rgba(254, 243, 199, 0.35)');
    bgGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.15)');
    bgGrad.addColorStop(1, 'rgba(219, 234, 254, 0.35)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1200, 800);

    // 2. Orla Dorada Doble y esquinas ornamentales
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 8;
    ctx.strokeRect(30, 30, 1140, 740);

    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 3;
    ctx.strokeRect(42, 42, 1116, 716);

    const corners = [[30, 30], [1170, 30], [30, 770], [1170, 770]];
    ctx.fillStyle = '#b45309';
    corners.forEach(([cx, cy]) => {
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.fill();
    });

    // 3. Encabezados Institucionales
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0284c7';
    ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
    ctx.fillText('DATALARIA ÁBACO ARCADE • ACADEMIA MATEMÁTICA', 600, 95);

    ctx.fillStyle = '#1e1b4b';
    ctx.font = '800 48px system-ui, -apple-system, sans-serif';
    ctx.fillText(lang === 'es' ? 'DIPLOMA DE HONOR' : 'DIPLOMA OF HONOR', 600, 160);

    ctx.fillStyle = '#64748b';
    ctx.font = '600 20px system-ui, -apple-system, sans-serif';
    ctx.fillText(
      lang === 'es' 
        ? 'Por su destacada agilidad mental, razonamiento aritmético y perseverancia' 
        : 'In recognition of outstanding mental arithmetic agility and perseverance',
      600, 202
    );

    // 4. Perfil Activo
    const profileObj = catalog.profiles ? catalog.profiles.find(p => p.id === activeProfileId) : null;
    const profileAvatar = profileObj ? profileObj.avatar : '🦁';
    const profileName = profileObj ? profileObj.name[lang] : 'Jugador 1';
    const profileTitle = profileObj ? profileObj.title[lang] : 'Explorador';

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(260, 235, 680, 135, 16);
    ctx.fill();
    ctx.stroke();

    ctx.font = '64px system-ui, sans-serif';
    ctx.fillText(profileAvatar, 335, 325);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#1e1b4b';
    ctx.font = '800 36px system-ui, -apple-system, sans-serif';
    ctx.fillText(profileName, 400, 295);

    ctx.fillStyle = '#0ea5e9';
    ctx.font = '700 20px system-ui, -apple-system, sans-serif';
    ctx.fillText(`★ ${profileTitle}`, 400, 332);

    // 5. Estadísticas de Logros
    let maxScore = 0;
    Object.values(userStats.highScores || {}).forEach(s => {
      if (s > maxScore) maxScore = s;
    });

    ctx.textAlign = 'center';
    const statBoxes = [
      { label: lang === 'es' ? 'Récord Máximo' : 'High Score', val: `${maxScore} pts` },
      { label: lang === 'es' ? 'Mejor Racha' : 'Best Streak', val: `🔥 ${userStats.bestStreakEver || 0}` },
      { label: lang === 'es' ? 'Medallas de Honor' : 'Badges Earned', val: `🎖️ ${userStats.unlockedMedals.length}/${catalog.medals.length}` }
    ];

    statBoxes.forEach((st, i) => {
      const bx = 220 + i * 260;
      ctx.fillStyle = '#f8faff';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(bx - 110, 400, 220, 85, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      ctx.font = '600 14px system-ui, sans-serif';
      ctx.fillText(st.label, bx, 432);

      ctx.fillStyle = '#0f172a';
      ctx.font = '800 22px system-ui, sans-serif';
      ctx.fillText(st.val, bx, 465);
    });

    // 6. Fila de Medallas
    ctx.fillStyle = '#475569';
    ctx.font = '700 16px system-ui, sans-serif';
    ctx.fillText(lang === 'es' ? 'COLECCIÓN DE MEDALLAS OBTENIDAS:' : 'EARNED BADGES COLLECTION:', 600, 525);

    const medalIcons = catalog.medals.map(m => {
      return userStats.unlockedMedals.includes(m.id) ? m.icon : '⚪';
    }).join('   ');
    ctx.font = '36px system-ui, sans-serif';
    ctx.fillText(medalIcons, 600, 575);

    // 7. Sello Circular
    ctx.save();
    ctx.translate(990, 660);
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 54, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 48, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#b45309';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.fillText('DATALARIA VERIFIED', 0, -20);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillText('★ 🧮 ★', 0, 4);
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.fillText('EXCELENCIA ARCADE', 0, 22);
    ctx.font = 'bold 8px system-ui, sans-serif';
    ctx.fillText('2026', 0, 34);
    ctx.restore();

    // 8. Fecha y Firma
    ctx.textAlign = 'left';
    const nowStr = new Date().toLocaleDateString(lang === 'es' ? 'es-ES' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    ctx.fillStyle = '#64748b';
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.fillText((lang === 'es' ? 'Fecha de Expedición: ' : 'Issued on: ') + nowStr, 90, 680);
    ctx.fillText('Certificado Digital Client-Side (Datalaria SDD)', 90, 705);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#334155';
    ctx.font = 'italic 16px serif';
    ctx.fillText('Datalaria Engineering & Pedagogy Team', 580, 685);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(430, 695);
    ctx.lineTo(730, 695);
    ctx.stroke();
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(lang === 'es' ? 'Firma Institucional Acreditada' : 'Accredited Institutional Signature', 580, 715);

    // 9. Descarga PNG
    try {
      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `diploma_abaco_arcade_${activeProfileId}_${new Date().toISOString().slice(0, 10)}.png`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
      }, 300);
    } catch (err) {
      showToast('Error al exportar diploma PNG', 2500);
    }
  }

  window.downloadArcadeDiploma = downloadArcadeDiploma;

  // Conmutador de Sonido y Tema con persistencia
  function toggleAudio() {
    const enabled = audio.toggleSound();
    try { localStorage.setItem('maths-sound', enabled ? 'true' : 'false'); } catch (e) { }
    document.getElementById('sound-btn').textContent = enabled ? '🔊' : '🔇';
    showToast(enabled ? '🔊 Audio activado' : '🔇 Audio silenciado', 1500);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('pref-theme', next); } catch (e) { }
    showToast(next === 'dark' ? '🌙 Modo Cosmic Night' : '☀️ Modo Daylight Arcade', 1500);
  }

  // Lógica de Instalación PWA
  function setupPwa() {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const btn = document.getElementById('btn-install-pwa');
      if (btn && !isStandalone) btn.style.display = 'inline-flex';
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      isStandalone = true;
      const btn = document.getElementById('btn-install-pwa');
      if (btn) btn.style.display = 'none';
      showToast(t('install_success'));
    });

    const installBtn = document.getElementById('btn-install-pwa');
    if (installBtn) {
      installBtn.onclick = () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          deferredInstallPrompt.userChoice.then((choice) => {
            if (choice.outcome === 'accepted') {
              showToast(t('install_success'));
            }
            deferredInstallPrompt = null;
          }).catch(() => { });
        } else {
          const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()) && !window.MSStream;
          showToast(isIos ? t('install_ios_tip') : t('install_generic_tip'), 4000);
        }
      };
    }

    const checkUpdateBtn = document.getElementById('btn-check-update');
    if (checkUpdateBtn) {
      checkUpdateBtn.onclick = () => checkForUpdatesManual();
    }

    if ('serviceWorker' in navigator && (window.location.protocol.startsWith('http') || window.location.protocol.startsWith('https'))) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/apps/maths/sw.js').then((reg) => {
          swRegistration = reg;
          setupPwaUpdateFlow(reg);
        }).catch(() => { });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!swRefreshing) {
            swRefreshing = true;
            window.location.reload();
          }
        });
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && swRegistration) {
          swRegistration.update().catch(() => {});
        }
      });
    }
  }

  let swRegistration = null;
  let swRefreshing = false;

  function setupPwaUpdateFlow(registration) {
    if (!registration) return;

    if (registration.waiting && navigator.serviceWorker.controller) {
      showUpdateBanner(registration.waiting);
      return;
    }

    registration.addEventListener('updatefound', () => {
      const newWorker = registration.installing;
      if (!newWorker) return;

      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateBanner(newWorker);
        }
      });
    });
  }

  function showUpdateBanner(waitingWorker) {
    if (document.getElementById('pwa-update-banner')) return;

    const banner = document.createElement('div');
    banner.id = 'pwa-update-banner';
    banner.className = 'pwa-update-banner';
    banner.innerHTML = `
      <div class="update-banner-content">
        <span class="update-icon">⚡</span>
        <span class="update-text">${t('update_available')}</span>
      </div>
      <button id="btn-pwa-apply-update" class="btn-pwa-update-action" title="${t('update_now_btn')}">
        <span>🔄</span> <span>${t('update_now_btn')}</span>
      </button>
    `;

    document.body.appendChild(banner);

    const btn = banner.querySelector('#btn-pwa-apply-update');
    if (btn) {
      btn.addEventListener('click', () => {
        btn.disabled = true;
        btn.innerHTML = `<span>⏳</span> <span>...</span>`;
        if (waitingWorker) {
          waitingWorker.postMessage({ action: 'skipWaiting' });
        }
        setTimeout(() => {
          window.location.reload();
        }, 1200);
      });
    }
  }

  async function checkForUpdatesManual() {
    showToast(`🔍 ${t('checking_update')}`, 1800);

    if (!swRegistration) {
      setTimeout(() => {
        showToast(t('up_to_date'), 3000);
      }, 800);
      return;
    }

    if (swRegistration.waiting) {
      showUpdateBanner(swRegistration.waiting);
      return;
    }

    try {
      await swRegistration.update();
      setTimeout(() => {
        if (!swRegistration.waiting && !document.getElementById('pwa-update-banner')) {
          showToast(t('up_to_date'), 3000);
        }
      }, 1500);
    } catch {
      showToast(t('up_to_date'), 3000);
    }
  }

  // Soporte de Teclado Físico y Atajos (0-9, Enter, Tab, T, M, H)
  window.addEventListener('keydown', (e) => {
    // Si pulsa T fuera de inputs, conmuta tema
    if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey) {
      toggleTheme();
      return;
    }
    // Si pulsa M fuera de inputs, conmuta sonido
    if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey) {
      toggleAudio();
      return;
    }
    // Si pulsa H en partida, conmuta pista visual
    if ((e.key === 'h' || e.key === 'H') && inGame && !e.ctrlKey && !e.metaKey) {
      toggleVisualHint();
      return;
    }

    if (!inGame || inFeedbackPause) return;
    if (e.key >= '0' && e.key <= '9') {
      handleNumpadPress(e.key);
    } else if (e.key === 'Backspace') {
      handleNumpadPress('del');
    } else if (e.key === 'Enter') {
      handleNumpadPress('enter');
    } else if (e.key === 'Tab') {
      e.preventDefault();
      if (currentProblem && currentProblem.type === 'division') {
        activeDivisionField = activeDivisionField === 'quo' ? 'rem' : 'quo';
        renderActiveGame(document.getElementById('tab-content'));
      }
    }
  });

  // Inicialización Global
  window.addEventListener('DOMContentLoaded', () => {
    initLang();
    loadStats();
    setupPwa();

    document.getElementById('lang-btn').onclick = () => {
      lang = lang === 'es' ? 'en' : 'es';
      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url);
      renderAll();
    };

    document.getElementById('sound-btn').onclick = toggleAudio;
    document.getElementById('theme-btn').onclick = toggleTheme;

    renderAll();
  });
})();

  </script>
</body>
</html>
