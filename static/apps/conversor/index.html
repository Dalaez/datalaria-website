    <style>
/* apps/conversor/styles.css — Datalaria Helix Engineering Workbench v2.0 Tokens & Layout */

:root {
  --bg-canvas: #0b0f17;
  --bg-surface: #111827;
  --bg-elevated: #1e293b;
  --bg-input: #151d2c;
  --bg-header: rgba(17, 24, 39, 0.88);
  --bg-surface-subtle: rgba(30, 41, 59, 0.45);
  --bg-grid-dot: rgba(148, 163, 184, 0.08);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-primary: #0ea5e9;
  --accent-hover: #38bdf8;
  --accent-secondary: #8b5cf6;
  --status-success: #10b981;
  --status-warning: #f59e0b;
  --status-danger: #ef4444;
  --border-subtle: rgba(148, 163, 184, 0.14);
  --border-focus: #0ea5e9;

  --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.45);
  --shadow-glow: 0 0 20px rgba(14, 165, 233, 0.2);
}

[data-theme="light"] {
  --bg-canvas: #f8fafc;
  --bg-surface: #ffffff;
  --bg-elevated: #f1f5f9;
  --bg-input: #ffffff;
  --bg-header: rgba(255, 255, 255, 0.92);
  --bg-surface-subtle: rgba(241, 245, 249, 0.85);
  --bg-grid-dot: rgba(100, 116, 139, 0.14);
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --accent-primary: #0284c7;
  --accent-hover: #0369a1;
  --accent-secondary: #7c3aed;
  --status-success: #059669;
  --status-warning: #d97706;
  --status-danger: #dc2626;
  --border-subtle: rgba(100, 116, 139, 0.22);
  --border-focus: #0284c7;

  --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06);
  --shadow-glow: 0 0 20px rgba(2, 132, 199, 0.15);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-canvas);
  background-image: radial-gradient(circle at 1px 1px, var(--bg-grid-dot) 1px, transparent 0);
  background-size: 24px 24px;
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* 1. Header Shell Datalaria (<= 64px) */
.app-header {
  height: 56px;
  background-color: var(--bg-header);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.25rem;
  position: sticky;
  top: 0;
  z-index: 50;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}

.header-left, .header-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0.35rem 0.65rem;
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
  border: 1px solid transparent;
}

.back-link:hover {
  color: var(--text-primary);
  background-color: var(--bg-elevated);
  border-color: var(--border-subtle);
}

.app-title-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: -0.01em;
}

.version-chip {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  padding: 0.15rem 0.45rem;
  background-color: rgba(14, 165, 233, 0.15);
  color: var(--accent-primary);
  border: 1px solid rgba(14, 165, 233, 0.3);
  border-radius: var(--radius-full);
}

.lang-switch {
  display: flex;
  background-color: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 2px;
}

.lang-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}

.lang-btn.active {
  background-color: var(--accent-primary);
  color: #ffffff;
}

.btn-theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 28px;
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-theme-toggle:hover {
  color: var(--accent-hover);
  border-color: var(--accent-primary);
  transform: translateY(-1px);
}

.btn-theme-toggle:active {
  transform: translateY(0);
}

.btn-install-pwa {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #10b981;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.35rem 0.65rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

[data-theme="light"] .btn-install-pwa {
  background: rgba(16, 185, 129, 0.12);
  border-color: rgba(16, 185, 129, 0.4);
  color: #059669;
}

.btn-install-pwa:hover {
  background: #10b981;
  border-color: #10b981;
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.8rem;
  padding: 0.35rem 0.65rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-elevated);
  transition: all 0.2s;
  white-space: nowrap;
}

.btn-ghost:hover {
  color: var(--text-primary);
  border-color: var(--accent-primary);
}

.btn-b2b {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  color: #ffffff;
  text-decoration: none;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius-sm);
  transition: opacity 0.2s;
  white-space: nowrap;
}

.btn-b2b:hover {
  opacity: 0.9;
}

/* 2. Main Container */
.workbench-container {
  width: 100%;
  max-width: 1080px;
  margin: 1.5rem auto;
  padding: 0 1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* 3. Categories Navigation Bar */
.categories-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
  background-color: var(--bg-surface);
  padding: 0.4rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}

.category-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0.5rem 0.9rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}

.category-pill:hover {
  color: var(--text-primary);
  background-color: var(--bg-elevated);
}

.category-pill.active {
  background-color: var(--accent-primary);
  color: #0b0f17;
  font-weight: 600;
}

.category-pill.scratchpad-pill.active {
  background-color: var(--accent-secondary);
  color: #ffffff;
}

/* 4. CODATA Quick Constants Bar */
.constants-bar {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  padding: 0.65rem 0.9rem;
  background-color: var(--bg-surface-subtle);
  border-radius: var(--radius-md);
  border: 1px dashed var(--border-subtle);
  overflow: visible;
}

.constants-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.65rem;
}

.constants-title-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.constants-badge {
  background: rgba(14, 165, 233, 0.15);
  color: var(--accent-primary);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 700;
  padding: 0.15rem 0.45rem;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(14, 165, 233, 0.3);
  letter-spacing: 0.04em;
}

.constants-label {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.02em;
}

.constants-chips-deck {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.constant-micro-chip {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.25rem 0.65rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.constant-micro-chip:hover {
  background: var(--bg-elevated);
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(14, 165, 233, 0.2);
}

.constant-micro-chip:active {
  transform: translateY(0);
}

.btn-codata-toggle {
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.25rem 0.65rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.15s ease-in-out;
}

.btn-codata-toggle:hover,
.btn-codata-toggle.active {
  background: var(--bg-surface);
  border-color: var(--accent-primary);
  color: var(--text-primary);
}

.codata-toggle-arrow {
  font-size: 0.65rem;
  color: var(--text-muted);
}

/* Expandable CODATA Table Panel */
.codata-table-panel {
  padding-top: 0.75rem;
  border-top: 1px dashed var(--border-subtle);
  animation: fadeInDown 0.2s ease-out;
}

.codata-table-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.6rem;
}

.codata-card-row {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.5rem 0.75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  transition: border-color 0.15s;
}

.codata-card-row:hover {
  border-color: rgba(14, 165, 233, 0.4);
}

.codata-card-sym-badge {
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--accent-primary);
  min-width: 2.2rem;
  text-align: center;
  background: rgba(14, 165, 233, 0.1);
  padding: 0.2rem 0.4rem;
  border-radius: var(--radius-sm);
}

.codata-card-body {
  flex: 1;
  min-width: 0;
}

.codata-card-title {
  font-size: 0.76rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.codata-card-val {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-primary);
}

.codata-card-unit {
  font-size: 0.74rem;
  color: var(--text-muted);
  font-weight: 400;
}

.btn-codata-inject {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.72rem;
  font-weight: 600;
  padding: 0.25rem 0.55rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.btn-codata-inject:hover {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #0b1120;
}

/* 5. Main Converter Card */
.converter-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 1.75rem;
  box-shadow: var(--shadow-card);
  position: relative;
}

.card-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.subcat-selector {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.subcat-btn {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all 0.2s;
}

.subcat-btn.active {
  background-color: var(--bg-canvas);
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  font-weight: 600;
}

.card-controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.precision-control {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.select-compact {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.25rem 0.45rem;
  border-radius: var(--radius-sm);
}

/* 6. Conversion Dual Cockpit Grid */
.cockpit-grid {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 1.25rem;
  align-items: center;
  margin-bottom: 1.5rem;
}

@media (max-width: 768px) {
  .cockpit-grid {
    grid-template-columns: 1fr;
    gap: 0.75rem;
  }
}

.unit-cell {
  background: var(--bg-canvas);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  transition: border-color 0.2s;
}

.unit-cell:focus-within {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 1px var(--accent-primary);
}

.cell-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.expr-preview {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent-hover);
  background: var(--bg-elevated);
  padding: 0.15rem 0.5rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  letter-spacing: 0;
  text-transform: none;
}

.unit-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 1.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.unit-output {
  width: 100%;
  color: var(--accent-hover);
  font-family: var(--font-mono);
  font-size: 1.75rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  word-break: break-all;
  min-height: 2.2rem;
  display: flex;
  align-items: center;
}

.unit-select {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  padding: 0.5rem 0.65rem;
  border-radius: var(--radius-sm);
  outline: none;
  cursor: pointer;
}

.swap-btn-container {
  display: flex;
  justify-content: center;
  align-items: center;
}

.btn-swap {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--accent-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.25rem;
  transition: all 0.25s ease;
}

.btn-swap:hover {
  background: var(--accent-primary);
  color: #0b0f17;
  transform: rotate(180deg) scale(1.08);
}

/* 7. Action Bar (Copy, Share, Invert) */
.action-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border-subtle);
  padding-top: 1rem;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.action-buttons {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.4rem 0.85rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}

.btn-action:hover {
  color: var(--text-primary);
  border-color: var(--accent-primary);
}

.btn-action.copied {
  background-color: rgba(16, 185, 129, 0.2);
  border-color: var(--status-success);
  color: var(--status-success);
}

/* 8. Omni-Matrix Multi-Scale View & Formula */
.omni-matrix-panel {
  margin-top: 1.25rem;
  background: var(--bg-surface-subtle);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 1.25rem;
}

.omni-title {
  font-family: var(--font-display);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.75rem;
  display: flex;
  justify-content: space-between;
}

.omni-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.omni-item {
  background: var(--bg-canvas);
  border: 1px solid rgba(148, 163, 184, 0.08);
  border-radius: var(--radius-sm);
  padding: 0.65rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.omni-item-label {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.omni-item-val {
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  word-break: break-all;
}

.formula-trace {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: var(--bg-canvas);
  border: 1px dashed var(--border-subtle);
  padding: 0.6rem 0.85rem;
  border-radius: var(--radius-sm);
  color: var(--accent-hover);
  display: flex;
  align-items: center;
  gap: 0.5rem;
  overflow-x: auto;
}

/* 9. Batch Scratchpad View */
.scratchpad-view {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
}

@media (max-width: 768px) {
  .scratchpad-view {
    grid-template-columns: 1fr;
  }
}

.scratchpad-panel {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.scratchpad-textarea {
  width: 100%;
  height: 260px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0.85rem;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 0.875rem;
  line-height: 1.5;
  resize: vertical;
  outline: none;
}

.scratchpad-textarea:focus {
  border-color: var(--accent-secondary);
}

.scratchpad-textarea[readonly] {
  background: var(--bg-canvas);
  color: #4ade80;
}

.scratchpad-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  align-items: center;
  justify-content: space-between;
}

/* 10. History Section */
.history-strip {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0.85rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  overflow: visible;
}

.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.history-title-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: var(--text-muted);
}

.history-title {
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-secondary);
}

.history-badge {
  background: var(--bg-elevated);
  color: var(--accent-primary);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.1rem 0.45rem;
  border-radius: 9999px;
  border: 1px solid var(--border-subtle);
}

.history-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.btn-history-toggle,
.btn-history-clear {
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  font-size: 0.72rem;
  padding: 0.2rem 0.55rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: all 0.15s;
}

.btn-history-toggle:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border-color: var(--accent-primary);
}

.btn-history-clear:hover {
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
  border-color: rgba(239, 68, 68, 0.3);
}

.history-items-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
}

.history-pill-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 0.76rem;
  padding: 0.35rem 0.7rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  transition: all 0.15s;
  white-space: nowrap;
}

.history-pill-card:hover {
  border-color: var(--accent-primary);
  color: var(--text-primary);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}

.hist-from, .hist-to {
  font-weight: 500;
}

.hist-arrow {
  color: var(--accent-primary);
  font-size: 0.72rem;
}

.hist-unit {
  color: var(--text-muted);
  font-size: 0.7rem;
}

/* 11. Didactic Section */
.didactic-section {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.didactic-title {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-hover);
}

.didactic-content {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.6;
}

/* 12. Footer */
.app-footer {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--text-muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--border-subtle);
  margin-top: auto;
}

.app-footer a {
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.2s;
}

.app-footer a:hover {
  color: var(--accent-primary);
}

/* 13. Toast Notification */
.workbench-toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--bg-surface);
  border: 1px solid var(--accent-primary);
  color: var(--text-primary);
  padding: 0.65rem 1.1rem;
  border-radius: var(--radius-md);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 12px rgba(14, 165, 233, 0.25);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  z-index: 9999;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}

.workbench-toast.show {
  opacity: 1;
  transform: translateY(0);
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 14. Responsive Header Shell */
@media (max-width: 768px) {
  .app-header {
    height: auto;
    min-height: 56px;
    padding: 0.5rem 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .header-left, .header-right {
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .btn-ghost, .btn-b2b, .btn-install-pwa {
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
  }
}

/**
 * apps/conversor/engine.js
 * Motor Matemático Determinista y Formateador Numérico
 * Datalaria Helix — Strict SI & Metrology Engine
 */

const SPEED_OF_LIGHT = 299792458; // m/s (CODATA Exact)

const WAVELENGTH_FACTORS = {
  m: 1,
  km: 1000,
  cm: 0.01,
  mm: 0.001,
  um: 1e-6,
  nm: 1e-9
};

const FREQ_FACTORS = {
  hz: 1,
  khz: 1e3,
  mhz: 1e6,
  ghz: 1e9,
  thz: 1e12
};

/**
 * Conversión lineal canónica
 * Invariante INV-CONV-1: convert(convert(x, A, B), B, A) == x
 */
function convertLinear(value, fromUnitKey, toUnitKey, unitsMap) {
  if (value === null || value === undefined || isNaN(value)) return NaN;
  const fromUnit = unitsMap[fromUnitKey];
  const toUnit = unitsMap[toUnitKey];
  if (!fromUnit || !toUnit) {
    throw new Error(`Unidades desconocidas: ${fromUnitKey} -> ${toUnitKey}`);
  }
  const baseValue = Number(value) * fromUnit.factor;
  return baseValue / toUnit.factor;
}

/**
 * Conversión de temperatura (No lineal)
 */
function convertTemperature(value, fromKey, toKey) {
  if (value === null || value === undefined || isNaN(value)) return NaN;
  const val = Number(value);
  if (fromKey === toKey) return val;

  // 1. A Kelvin
  let kelvin;
  switch (fromKey) {
    case 'c': kelvin = val + 273.15; break;
    case 'f': kelvin = (val - 32) * (5 / 9) + 273.15; break;
    case 'k': kelvin = val; break;
    case 'r': kelvin = val * (5 / 9); break;
    default: throw new Error(`Escala desconocida: ${fromKey}`);
  }

  // 2. De Kelvin a Destino
  switch (toKey) {
    case 'c': return kelvin - 273.15;
    case 'f': return (kelvin - 273.15) * (9 / 5) + 32;
    case 'k': return kelvin;
    case 'r': return kelvin * (9 / 5);
    default: throw new Error(`Escala desconocida: ${toKey}`);
  }
}

/**
 * Conversión de potencia logarítmica RF (dBm ⇔ W / mW / kW)
 */
function convertRfPower(value, fromKey, toKey) {
  if (value === null || value === undefined || isNaN(value)) return NaN;
  const val = Number(value);
  if (fromKey === toKey) return val;

  // 1. A milivatios (mW)
  let mw;
  switch (fromKey) {
    case 'dbm':
      mw = Math.pow(10, val / 10);
      break;
    case 'mw':
      mw = val;
      break;
    case 'w':
      mw = val * 1000;
      break;
    case 'kw':
      mw = val * 1e6;
      break;
    default:
      throw new Error(`Unidad RF desconocida: ${fromKey}`);
  }

  // 2. De milivatios a Destino
  switch (toKey) {
    case 'dbm':
      if (mw <= 0) return -Infinity;
      return 10 * Math.log10(mw);
    case 'mw':
      return mw;
    case 'w':
      return mw / 1000;
    case 'kw':
      return mw / 1e6;
    default:
      throw new Error(`Unidad RF desconocida: ${toKey}`);
  }
}

/**
 * Conversión Frecuencia ⇔ Longitud de Onda electromagnética en el vacío (λ = c / f)
 * Bidireccional
 */
function convertRfWavFreq(value, mode, fromUnit, toUnit) {
  if (value === null || value === undefined || isNaN(value)) return NaN;
  const val = Number(value);
  if (val <= 0) return NaN;

  if (mode === 'freq_to_wav') {
    // fromUnit es frecuencia (hz, mhz..), toUnit es longitud (m, cm, nm..)
    const freqFactor = FREQ_FACTORS[fromUnit] || 1;
    const wavFactor = WAVELENGTH_FACTORS[toUnit] || 1;
    const fHz = val * freqFactor;
    if (fHz === 0) return Infinity;
    const lambdaMeters = SPEED_OF_LIGHT / fHz;
    return lambdaMeters / wavFactor;
  } else if (mode === 'wav_to_freq') {
    // fromUnit es longitud (m, cm, nm..), toUnit es frecuencia (hz, mhz..)
    const wavFactor = WAVELENGTH_FACTORS[fromUnit] || 1;
    const freqFactor = FREQ_FACTORS[toUnit] || 1;
    const lambdaMeters = val * wavFactor;
    if (lambdaMeters === 0) return Infinity;
    const fHz = SPEED_OF_LIGHT / lambdaMeters;
    return fHz / freqFactor;
  }

  throw new Error(`Modo RF λ-f inválido: ${mode}`);
}

/**
 * Parser numérico robusto
 * Maneja notación científica (1e-4), formatos US (1,234.56), EU (1.234,56),
 * números negativos y extracción limpia de cantidades con unidades ('15.4 bar').
 */
function parseRobustNumber(str, forceFormat = 'auto') {
  if (!str) return NaN;
  const trimmed = String(str).trim();
  if (!trimmed) return NaN;

  // Extracción del bloque numérico principal (respetando signos y exponente e/E)
  const match = trimmed.match(/[-+]?(?:[\d.,]+(?:[eE][-+]?\d+)?|\d+)/);
  if (!match) return NaN;

  let numStr = match[0];
  const hasDot = numStr.includes('.');
  const hasComma = numStr.includes(',');

  // Separar exponente si existe (ej. 1.23e-4)
  let exponent = '';
  const eIndex = numStr.search(/[eE]/);
  if (eIndex !== -1) {
    exponent = numStr.slice(eIndex);
    numStr = numStr.slice(0, eIndex);
  }

  let finalNumber = NaN;

  if (hasDot && hasComma) {
    // Ambos separadores presentes: el último determina el decimal
    const lastDot = numStr.lastIndexOf('.');
    const lastComma = numStr.lastIndexOf(',');
    if (lastDot > lastComma) {
      // Formato US: 1,234.56 -> comas son miles, punto es decimal
      finalNumber = parseFloat(numStr.replace(/,/g, ''));
    } else {
      // Formato EU: 1.234,56 -> puntos son miles, coma es decimal
      finalNumber = parseFloat(numStr.replace(/\./g, '').replace(',', '.'));
    }
  } else if (hasDot) {
    const parts = numStr.split('.');
    if (forceFormat === 'eu' && parts.length === 2 && parts[1].length === 3 && parts[0].length >= 1) {
      // Usuario forzó EU y es un único punto con 3 dígitos (ej. 1.234 en miles)
      finalNumber = parseFloat(numStr.replace(/\./g, ''));
    } else if (parts.length > 2) {
      // Múltiples puntos: deben ser miles (ej. 1.000.000)
      finalNumber = parseFloat(parts.slice(0, -1).join('') + '.' + parts[parts.length - 1]);
    } else {
      finalNumber = parseFloat(numStr);
    }
  } else if (hasComma) {
    const parts = numStr.split(',');
    if (parts.length > 2) {
      // Múltiples comas: miles US (ej. 1,000,000)
      finalNumber = parseFloat(numStr.replace(/,/g, ''));
    } else if (forceFormat === 'us' && parts[1] && parts[1].length === 3) {
      // Forzado US y 3 dígitos después de coma -> miles
      finalNumber = parseFloat(numStr.replace(/,/g, ''));
    } else {
      // Caso estándar: coma decimal (ej. 1,234 en español o 0,025)
      // FIX del bug anterior donde 1,234 se convertía forzosamente a 1234
      finalNumber = parseFloat(numStr.replace(',', '.'));
    }
  } else {
    finalNumber = parseFloat(numStr);
  }

  if (isNaN(finalNumber)) return NaN;
  if (exponent) {
    return parseFloat(`${finalNumber}${exponent}`);
  }
  return finalNumber;
}

/**
 * Formateador de números científicos y comerciales de alta fidelidad
 * Evita el doble truncamiento de toLocaleString()
 */
function formatEngineeredNumber(num, precision = 'auto', targetFormat = 'es') {
  if (num === null || num === undefined || isNaN(num)) return '--';
  if (!isFinite(num)) return num > 0 ? '∞' : '-∞';
  if (num === 0) return '0';

  const thousandsSep = targetFormat === 'es' || targetFormat === 'eu' ? '.' : ',';
  const decimalSep = targetFormat === 'es' || targetFormat === 'eu' ? ',' : '.';

  let formattedStr = '';
  const absVal = Math.abs(num);

  if (precision === 'sci' || (precision === 'auto' && (absVal < 1e-4 || absVal >= 1e9))) {
    // Formato científico elegante
    const expStr = num.toExponential(4);
    const [mantissa, exp] = expStr.split('e');
    const localizedMantissa = mantissa.replace('.', decimalSep);
    return `${localizedMantissa} × 10${formatSuperscript(exp)}`;
  }

  if (precision === 'auto') {
    // Si es un entero o casi entero
    if (Number.isInteger(num)) {
      formattedStr = String(num);
    } else {
      // Hasta 6 cifras significativas sin ceros superfluos
      const str = num.toPrecision(6);
      formattedStr = String(parseFloat(str));
    }
  } else {
    const decimals = parseInt(precision, 10);
    if (!isNaN(decimals) && decimals >= 0 && decimals <= 12) {
      formattedStr = num.toFixed(decimals);
    } else {
      formattedStr = String(num);
    }
  }

  // Inyectar separadores de miles y decimales
  const [intPart, decPart] = formattedStr.split('.');
  const formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, thousandsSep);

  if (decPart !== undefined && decPart !== '') {
    return `${formattedInt}${decimalSep}${decPart}`;
  }
  return formattedInt;
}

function formatSuperscript(expString) {
  const supers = {
    '-': '⁻',
    '+': '⁺',
    '0': '⁰',
    '1': '¹',
    '2': '²',
    '3': '³',
    '4': '⁴',
    '5': '⁵',
    '6': '⁶',
    '7': '⁷',
    '8': '⁸',
    '9': '⁹'
  };
  return expString.replace(/[-+0-9]/g, char => supers[char] || char);
}

/**
 * Procesador en lote (Batch Scratchpad)
 */
function processBatchText(rawText, options = {}) {
  const {
    targetFormat = 'eu', // 'eu' o 'us'
    convertUnits = false,
    unitCategory = null,
    fromUnit = null,
    toUnit = null,
    precision = 'auto',
    categoriesCatalog = null
  } = options;

  if (!rawText || !rawText.trim()) {
    return { output: '', count: 0, errors: 0 };
  }

  const lines = rawText.split(/\r?\n/);
  let processedCount = 0;
  let errorCount = 0;

  const resultLines = lines.map((line, idx) => {
    if (!line.trim()) return '';

    const parsed = parseRobustNumber(line);
    if (isNaN(parsed)) {
      errorCount++;
      return `[Línea ${idx + 1}: Entrada inválida '${line.trim()}']`;
    }

    let finalVal = parsed;

    if (convertUnits && unitCategory && fromUnit && toUnit && categoriesCatalog) {
      try {
        if (unitCategory === 'temperature') {
          finalVal = convertTemperature(parsed, fromUnit, toUnit);
        } else if (unitCategory === 'rf_power') {
          finalVal = convertRfPower(parsed, fromUnit, toUnit);
        } else {
          // Linear conversion
          const cat = categoriesCatalog[unitCategory];
          if (cat && cat.units) {
            finalVal = convertLinear(parsed, fromUnit, toUnit, cat.units);
          }
        }
      } catch {
        errorCount++;
        return `[Línea ${idx + 1}: Error de conversión]`;
      }
    }

    processedCount++;
    return formatEngineeredNumber(finalVal, precision, targetFormat);
  });

  return {
    output: resultLines.join('\n'),
    count: processedCount,
    errors: errorCount
  };
}

/**
 * Evaluador Seguro de Expresiones Aritméticas (Invariante INV-CONV-9)
 * Analizador sintáctico determinista recursivo (sin 'eval' ni 'Function').
 * Soporta: +, -, *, /, ^, %, (), constantes pi, e, funciones sqrt, abs, sin, cos, tan, log, exp.
 */
function evaluateMathExpression(input) {
  if (input === null || input === undefined) return NaN;
  const str = String(input).trim();
  if (!str) return NaN;

  // Si es un número estándar directo sin operadores aritméticos
  const simpleNum = Number(str);
  if (!isNaN(simpleNum) && !/[+\-*/^%()]/.test(str)) {
    return simpleNum;
  }

  // Normalizar símbolos matemáticos y comas decimales
  const normalized = str
    .replace(/×/g, '*')
    .replace(/÷/g, '/')
    .replace(/\*\*/g, '^')
    .replace(/,/g, '.')
    .replace(/\s+/g, '');

  let pos = 0;

  function peek() {
    return normalized[pos];
  }

  function get() {
    return normalized[pos++];
  }

  function parseExpression() {
    let result = parseTerm();
    while (pos < normalized.length) {
      const op = peek();
      if (op === '+' || op === '-') {
        get();
        const nextTerm = parseTerm();
        result = op === '+' ? result + nextTerm : result - nextTerm;
      } else {
        break;
      }
    }
    return result;
  }

  function parseTerm() {
    let result = parsePower();
    while (pos < normalized.length) {
      const op = peek();
      if (op === '*' || op === '/' || op === '%') {
        get();
        const nextFactor = parsePower();
        if (op === '*') result *= nextFactor;
        else if (op === '/') result /= nextFactor;
        else if (op === '%') result %= nextFactor;
      } else {
        break;
      }
    }
    return result;
  }

  function parsePower() {
    let result = parseFactor();
    if (pos < normalized.length && peek() === '^') {
      get();
      const exponent = parsePower(); // Asociativo por la derecha
      result = Math.pow(result, exponent);
    }
    return result;
  }

  function parseFactor() {
    if (pos >= normalized.length) return NaN;

    // Operador unario + / -
    if (peek() === '+') {
      get();
      return parseFactor();
    }
    if (peek() === '-') {
      get();
      return -parseFactor();
    }

    // Paréntesis
    if (peek() === '(') {
      get();
      const val = parseExpression();
      if (get() !== ')') return NaN;
      return val;
    }

    // Literal numérico (incluyendo notación científica 1.5e-3)
    const numMatch = normalized.slice(pos).match(/^(\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/);
    if (numMatch) {
      pos += numMatch[0].length;
      return parseFloat(numMatch[0]);
    }

    // Identificador: constante o nombre de función
    const idMatch = normalized.slice(pos).match(/^([a-zA-Z_]\w*)/);
    if (idMatch) {
      const id = idMatch[1].toLowerCase();
      pos += idMatch[0].length;

      // Llamada a función matemática: ej. sqrt(144)
      if (peek() === '(') {
        get();
        const arg = parseExpression();
        if (get() !== ')') return NaN;

        switch (id) {
          case 'sqrt': return Math.sqrt(arg);
          case 'abs': return Math.abs(arg);
          case 'sin': return Math.sin(arg);
          case 'cos': return Math.cos(arg);
          case 'tan': return Math.tan(arg);
          case 'log': return Math.log(arg);
          case 'log10': return Math.log10(arg);
          case 'exp': return Math.exp(arg);
          default: return NaN;
        }
      }

      // Constantes conocidas
      if (id === 'pi') return Math.PI;
      if (id === 'e') return Math.E;

      return NaN;
    }

    return NaN;
  }

  try {
    const val = parseExpression();
    if (pos < normalized.length) return NaN;
    return isFinite(val) ? val : NaN;
  } catch {
    return NaN;
  }
}

class UnitConverterApp {
  constructor() {
    this.state = {
      lang: 'es',
      category: 'dimension',
      magnitude: 'length',
      fromUnit: 'm',
      toUnit: 'ft',
      inputValue: 1,
      precision: 'auto',
      // RF Special modes
      rfWavMode: 'freq_to_wav', // or 'wav_to_freq'
      rfWavFromUnit: 'mhz',
      rfWavToUnit: 'm',
      // Batch Scratchpad
      batchTargetFormat: 'eu',
      batchConvertUnits: false,
      batchUnitCategory: 'pressure',
      batchFromUnit: 'bar',
      batchToUnit: 'psi',
      history: [],
      historyCollapsed: false,
      codataTableOpen: false,
      theme: 'dark'
    };
  }

  init() {
    this.readThemePreference();
    this.readUrlParams();
    this.loadHistory();
    this.setupPwaInstallPrompt();
    this.renderShell();
    this.renderCategoryNav();
    this.renderConstantsBar();
    this.bindEvents();
    this.updateView();
    this.registerServiceWorker();
  }

  setupPwaInstallPrompt() {
    this._deferredInstallPrompt = null;
    this._isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // Si ya corre instalada en modo standalone, no mostramos el botón
    if (this._isStandalone) return;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this._deferredInstallPrompt = e;
      this.updateInstallButtonVisibility(true);
    });

    window.addEventListener('appinstalled', () => {
      this._deferredInstallPrompt = null;
      this._isStandalone = true;
      this.updateInstallButtonVisibility(false);
      const t = I18N[this.state.lang];
      this.showToast(t.installSuccessToast);
    });
  }

  updateInstallButtonVisibility(visible) {
    const btn = document.getElementById('btn-install-pwa');
    if (btn) {
      btn.style.display = visible ? 'inline-flex' : 'none';
    }
  }

  async triggerPwaInstall() {
    const t = I18N[this.state.lang];
    if (this._deferredInstallPrompt) {
      this._deferredInstallPrompt.prompt();
      try {
        const { outcome } = await this._deferredInstallPrompt.userChoice;
        if (outcome === 'accepted') {
          this.updateInstallButtonVisibility(false);
          this.showToast(t.installSuccessToast);
        }
      } catch {
        // Fallback silencioso
      }
      this._deferredInstallPrompt = null;
    } else {
      const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()) && !window.MSStream;
      if (isIos) {
        this.showToast(t.installIosInstructions);
      } else {
        this.showToast(t.installGenericInstructions);
      }
    }
  }

  registerServiceWorker() {
    if ('serviceWorker' in navigator && (window.location.protocol.startsWith('http') || window.location.protocol.startsWith('https'))) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/apps/conversor/sw.js')
          .catch(() => {
            // Ignorado silenciosamente en entornos sandbox o sin soporte
          });
      });
    }
  }

  readThemePreference() {
    const saved = localStorage.getItem('pref-theme') || localStorage.getItem('datalaria_theme');
    if (saved === 'light' || saved === 'dark') {
      this.state.theme = saved;
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      this.state.theme = 'light';
    } else {
      this.state.theme = 'dark';
    }
    this.applyTheme();
  }

  applyTheme() {
    document.documentElement.setAttribute('data-theme', this.state.theme);
    if (this.state.theme === 'dark') {
      document.documentElement.classList.add('dark');
      if (document.body) {
        document.body.classList.add('dark');
        document.body.classList.remove('light');
      }
    } else {
      document.documentElement.classList.remove('dark');
      if (document.body) {
        document.body.classList.remove('dark');
        document.body.classList.add('light');
      }
    }
    localStorage.setItem('pref-theme', this.state.theme);
    localStorage.setItem('datalaria_theme', this.state.theme);
  }

  toggleTheme() {
    this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
    this.applyTheme();
    this.renderShell();
    const t = I18N[this.state.lang];
    this.showToast(this.state.theme === 'light' ? t.toastLightMode : t.toastDarkMode);
  }

  readUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang');
    if (lang === 'en' || lang === 'es') {
      this.state.lang = lang;
    } else {
      const stored = localStorage.getItem('datalaria_lang');
      if (stored === 'en' || stored === 'es') this.state.lang = stored;
    }

    const cat = params.get('cat');
    if (cat && CATEGORIES[cat]) {
      this.state.category = cat;
      const mag = params.get('mag');
      if (mag && CATEGORIES[cat].magnitudes && CATEGORIES[cat].magnitudes[mag]) {
        this.state.magnitude = mag;
      } else if (CATEGORIES[cat].magnitudes) {
        this.state.magnitude = Object.keys(CATEGORIES[cat].magnitudes)[0];
      }
    }

    const val = params.get('val');
    if (val !== null && !isNaN(Number(val))) {
      this.state.inputValue = Number(val);
    }

    const from = params.get('from');
    const to = params.get('to');
    if (from) this.state.fromUnit = from;
    if (to) this.state.toUnit = to;

    const prec = params.get('prec');
    if (prec) this.state.precision = prec;
  }

  syncUrlParams() {
    const params = new URLSearchParams();
    params.set('lang', this.state.lang);
    params.set('cat', this.state.category);
    if (this.state.category !== 'scratchpad') {
      params.set('mag', this.state.magnitude);
      params.set('val', this.state.inputValue);
      params.set('from', this.state.fromUnit);
      params.set('to', this.state.toUnit);
      if (this.state.precision !== 'auto') {
        params.set('prec', this.state.precision);
      }
    }
    const newUrl = `${window.location.pathname}?${params.toString()}`;
    window.history.replaceState({}, '', newUrl);
  }

  setLanguage(lang) {
    if (this.state.lang === lang) return;
    this.state.lang = lang;
    localStorage.setItem('datalaria_lang', lang);
    this.renderShell();
    this.renderCategoryNav();
    this.renderConstantsBar();
    this.updateView();
    this.syncUrlParams();

    this.syncUrlParams();
    this.showToast(`${t.injectedToast}: ${sym} = ${formatEngineeredNumber(val, 'sci', this.state.lang)} ${unit}`);

  showToast(msg) {
    let toast = document.getElementById('workbench-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'workbench-toast';
      toast.className = 'workbench-toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    if (this._toastTimer) clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2200);

    if (cat.magnitudes) {
      this.state.magnitude = Object.keys(cat.magnitudes)[0];
      const mag = cat.magnitudes[this.state.magnitude];
      if (mag.units) {
        this.state.fromUnit = mag.defaultFrom || Object.keys(mag.units)[0];
        this.state.toUnit = mag.defaultTo || Object.keys(mag.units)[1] || Object.keys(mag.units)[0];
      }
    }
    this.renderCategoryNav();
    this.updateView();
    this.syncUrlParams();
  }

    if (this.state.magnitude === magId) return;
    this.state.magnitude = magId;
    const cat = CATEGORIES[this.state.category];
    const mag = cat.magnitudes[magId];
    if (mag.units) {
      this.state.fromUnit = mag.defaultFrom || Object.keys(mag.units)[0];
      this.state.toUnit = mag.defaultTo || Object.keys(mag.units)[1] || Object.keys(mag.units)[0];
    }
    this.updateView();
    this.syncUrlParams();
  }

    if (this.state.category === 'scratchpad') {
      if (mainCard) mainCard.style.display = 'none';
      if (scratchpadCard) scratchpadCard.style.display = 'block';
      this.renderScratchpad();
    } else {
      if (scratchpadCard) scratchpadCard.style.display = 'none';
      if (mainCard) mainCard.style.display = 'block';
      this.renderConverterCard();
    }

    if (didacticCard) {
      const lang = this.state.lang;
      const text = DIDACTIC_TEXTS[this.state.category] ? DIDACTIC_TEXTS[this.state.category][lang] : '';
      didacticCard.innerHTML = `
        <h3 class="didactic-title">${CATEGORIES[this.state.category].icon} ${CATEGORIES[this.state.category].title[lang]}</h3>
        <p class="didactic-content">${text}</p>
      `;
    }

    this.renderHistory();
  }

        </div>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

    // Bind subcategory click
    cardEl.querySelectorAll('.subcat-btn').forEach(btn => {
      btn.addEventListener('click', () => this.selectMagnitude(btn.dataset.mag));

    // Precision select
    const precSelect = cardEl.querySelector('#precision-select');
    if (precSelect) {
      precSelect.addEventListener('change', (e) => {
        this.state.precision = e.target.value;
        this.calculateAndRender();
        this.syncUrlParams();
      });
    }

    // Share button
    const shareBtn = cardEl.querySelector('#btn-share');
    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        this.syncUrlParams();
        navigator.clipboard.writeText(window.location.href).then(() => {
          shareBtn.innerHTML = `<span>${t.linkCopied}</span>`;
          setTimeout(() => {
            shareBtn.innerHTML = `
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>

  bindConverterInputs() {
    const inputEl = document.getElementById('main-unit-input');
    const fromSelect = document.getElementById('main-from-unit-select');
    const toSelect = document.getElementById('main-to-unit-select');
    const swapBtn = document.getElementById('btn-swap-units');

    if (inputEl) {
      inputEl.addEventListener('input', (e) => {
        const raw = e.target.value.trim();
        const previewEl = document.getElementById('input-expr-preview');
        const evaluated = evaluateMathExpression(raw);

        if (!isNaN(evaluated)) {
          this.state.inputValue = evaluated;
          if (/[+\-*/^%()]|[a-zA-Z]/.test(raw) && previewEl) {
            previewEl.textContent = `= ${formatEngineeredNumber(evaluated, this.state.precision, this.state.lang)}`;
            previewEl.style.display = 'inline-block';
            inputEl.classList.add('has-expr');
          } else if (previewEl) {
            previewEl.style.display = 'none';
            inputEl.classList.remove('has-expr');
          }
          this.calculateAndRender();
          this.syncUrlParams();
        } else if (raw === '') {
          this.state.inputValue = 0;
          if (previewEl) previewEl.style.display = 'none';
          inputEl.classList.remove('has-expr');
          this.calculateAndRender();
        } else if (previewEl) {
          previewEl.textContent = '...';
          previewEl.style.display = 'inline-block';
        }
      });

      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const raw = inputEl.value.trim();
          const evaluated = evaluateMathExpression(raw);
          if (!isNaN(evaluated)) {
            inputEl.value = evaluated;
            const previewEl = document.getElementById('input-expr-preview');
            if (previewEl) previewEl.style.display = 'none';
            inputEl.classList.remove('has-expr');
            this.state.inputValue = evaluated;
            this.calculateAndRender();
            this.syncUrlParams();
            this.showToast(`= ${evaluated}`);
          }
        }
      });
    }

    if (fromSelect) {
      fromSelect.addEventListener('change', (e) => {
        this.state.fromUnit = e.target.value;
        this.calculateAndRender();
        this.syncUrlParams();
      });
    }

    if (toSelect) {
      toSelect.addEventListener('change', (e) => {
        this.state.toUnit = e.target.value;
        this.calculateAndRender();
        this.syncUrlParams();
      });
    }

    if (swapBtn) {
      swapBtn.addEventListener('click', () => {
        const temp = this.state.fromUnit;
        this.state.fromUnit = this.state.toUnit;
        this.state.toUnit = temp;
        if (fromSelect) fromSelect.value = this.state.fromUnit;
        if (toSelect) toSelect.value = this.state.toUnit;
        this.calculateAndRender();
        this.syncUrlParams();
      });
    }

    // Special RF λ-f binding
    const rfSwapBtn = document.getElementById('btn-swap-rf-wav');
    const rfFromSelect = document.getElementById('rf-from-select');
    const rfToSelect = document.getElementById('rf-to-select');

    if (rfSwapBtn) {
      rfSwapBtn.addEventListener('click', () => {
        this.state.rfWavMode = this.state.rfWavMode === 'freq_to_wav' ? 'wav_to_freq' : 'freq_to_wav';
        this.renderConverterCard();
      });
    }

    if (rfFromSelect) {
      rfFromSelect.addEventListener('change', (e) => {
        if (this.state.rfWavMode === 'freq_to_wav') this.state.rfWavFromUnit = e.target.value;
        else this.state.rfWavToUnit = e.target.value;
        this.calculateAndRender();
      });
    }

    if (rfToSelect) {
      rfToSelect.addEventListener('change', (e) => {
        if (this.state.rfWavMode === 'freq_to_wav') this.state.rfWavToUnit = e.target.value;
        else this.state.rfWavFromUnit = e.target.value;
        this.calculateAndRender();
      });
    }
  }

  calculateAndRender() {
    const outputEl = document.getElementById('main-unit-output');
    const traceEl = document.getElementById('formula-trace-container');
    const omniEl = document.getElementById('omni-matrix-container');
    if (!outputEl) return;

    const cat = CATEGORIES[this.state.category];
    const mag = cat.magnitudes[this.state.magnitude];
    const val = this.state.inputValue;
    const lang = this.state.lang;
    let result = NaN;
    let traceText = '';

    if (mag.isSpecialRfWav) {
      const mode = this.state.rfWavMode;
      const fromU = mode === 'freq_to_wav' ? this.state.rfWavFromUnit : this.state.rfWavToUnit;
      const toU = mode === 'freq_to_wav' ? this.state.rfWavToUnit : this.state.rfWavFromUnit;
      result = convertRfWavFreq(val, mode, fromU, toU);
      traceText = mode === 'freq_to_wav' ?
        `λ = c / f = 299.792.458 m/s ÷ (${val} ${fromU.toUpperCase()})` :
        `f = c / λ = 299.792.458 m/s ÷ (${val} ${fromU.toUpperCase()})`;
    } else if (mag.isSpecialRfPower) {
      result = convertRfPower(val, this.state.fromUnit, this.state.toUnit);
      traceText = `dBm ⇔ W/mW: P(mW) = 10^(dBm / 10)`;
    } else if (mag.isNonLinear && mag.id === 'temperature') {
      result = convertTemperature(val, this.state.fromUnit, this.state.toUnit);
      traceText = `T(${this.state.toUnit.toUpperCase()}) = escala(${this.state.fromUnit.toUpperCase()} ➔ K ➔ ${this.state.toUnit.toUpperCase()})`;
    } else {
      result = convertLinear(val, this.state.fromUnit, this.state.toUnit, mag.units);
      const fromU = mag.units[this.state.fromUnit];
      const toU = mag.units[this.state.toUnit];
      if (fromU && toU) {
        traceText = `${val} × ${fromU.factor} ${mag.baseUnit} ÷ ${toU.factor} = ${toU.symbol}`;
      }
    }

    const formatted = formatEngineeredNumber(result, this.state.precision, lang);
    outputEl.textContent = formatted;

    if (traceEl) {
      traceEl.innerHTML = `<strong>${I18N[lang].formulaTraceLabel}</strong> <span>${traceText}</span>`;
    }

    // Omni Matrix rendering
    if (omniEl && mag.units && !mag.isSpecialRfWav) {
      this.renderOmniMatrix(omniEl, val, mag, lang);
    } else if (omniEl) {
      omniEl.innerHTML = '';
    }

    // Save calculation to history
    this.saveCalculationToHistory(val, this.state.fromUnit, result, this.state.toUnit, mag);
  }

  renderOmniMatrix(container, val, mag, lang) {
    const t = I18N[lang];
    const allUnits = Object.values(mag.units);
    // Take 4 representative units different from current from/to
    const otherUnits = allUnits.filter(u => u.id !== this.state.fromUnit && u.id !== this.state.toUnit).slice(0, 4);

    if (otherUnits.length === 0) {
      container.innerHTML = '';
      return;
    }

    const cardsHtml = otherUnits.map(u => {
      let r = NaN;
      if (mag.isNonLinear && mag.id === 'temperature') {
        r = convertTemperature(val, this.state.fromUnit, u.id);
      } else if (mag.isSpecialRfPower) {
        r = convertRfPower(val, this.state.fromUnit, u.id);
      } else {
        r = convertLinear(val, this.state.fromUnit, u.id, mag.units);
      }
      return `
        <div class="omni-item">
          <span class="omni-item-label">${u.name[lang]}</span>
          <span class="omni-item-val">${formatEngineeredNumber(r, this.state.precision, lang)}</span>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="omni-title">
        <span>${t.omniTitle}</span>
        <span>Equivalencias Simultáneas</span>
      </div>
      <div class="omni-grid">
        ${cardsHtml}
      </div>
    `;
  }

  bindScratchpadEvents() {
    const inputEl = document.getElementById('batch-input');
    const outputEl = document.getElementById('batch-output');
    const formatSelect = document.getElementById('batch-format-select');
    const unitToggle = document.getElementById('batch-unit-toggle');
    const sampleBtn = document.getElementById('btn-batch-sample');
    const copyBtn = document.getElementById('btn-batch-copy');
    const csvBtn = document.getElementById('btn-batch-csv');
    const statusText = document.getElementById('batch-status-text');

    const updateBatch = () => {
      if (!inputEl || !outputEl) return;
      const text = inputEl.value;
      const res = processBatchText(text, {
        targetFormat: this.state.batchTargetFormat,
        convertUnits: this.state.batchConvertUnits,
        unitCategory: this.state.batchUnitCategory,
        fromUnit: this.state.batchFromUnit,
        toUnit: this.state.batchToUnit,
        precision: this.state.precision,
        categoriesCatalog: this.getFlattenedCatalog()
      });
      outputEl.value = res.output;
      if (statusText) {
        statusText.textContent = `${res.count} líneas procesadas (${res.errors} errores)`;
      }
    };

    if (inputEl) inputEl.addEventListener('input', updateBatch);

    if (formatSelect) {
      formatSelect.addEventListener('change', (e) => {
        this.state.batchTargetFormat = e.target.value;
        updateBatch();
      });
    }

    if (unitToggle) {
      unitToggle.addEventListener('change', (e) => {
        this.state.batchConvertUnits = e.target.checked;
        const row = document.getElementById('batch-unit-selector-row');
        if (row) row.style.display = e.target.checked ? 'flex' : 'none';
        this.populateBatchUnits();
        updateBatch();
      });
    }

    if (sampleBtn) {
      sampleBtn.addEventListener('click', () => {
        if (inputEl) {
          inputEl.value = I18N[this.state.lang].scratchpadSample;
          updateBatch();
        }
      });
    }

    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        if (outputEl && outputEl.value) {
          navigator.clipboard.writeText(outputEl.value).then(() => {
            copyBtn.textContent = I18N[this.state.lang].copiedFeedback;
            setTimeout(() => { copyBtn.textContent = I18N[this.state.lang].copyOutputBtn; }, 1800);
          });
        }
      });
    }

    if (csvBtn) {
      csvBtn.addEventListener('click', () => {
        if (outputEl && outputEl.value) {
          const blob = new Blob([outputEl.value], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `datalaria_conversor_lote_${Date.now()}.csv`;
          a.click();
          URL.revokeObjectURL(url);
        }
      });
    }

    this.populateBatchUnits();
  }

  getFlattenedCatalog() {
    const flat = {};
    Object.values(CATEGORIES).forEach(c => {
      if (c.magnitudes) {
        Object.entries(c.magnitudes).forEach(([magKey, magObj]) => {
          flat[magKey] = magObj;
        });
      }
    });
    return flat;
  }

  populateBatchUnits() {
    const catSelect = document.getElementById('batch-category-select');
    const fromSelect = document.getElementById('batch-from-select');
    const toSelect = document.getElementById('batch-to-select');
    if (!catSelect || !fromSelect || !toSelect) return;

    const flat = this.getFlattenedCatalog();
    const currentMag = flat[this.state.batchUnitCategory];
    if (!currentMag || !currentMag.units) return;

    const units = Object.values(currentMag.units);
    const lang = this.state.lang;

    fromSelect.innerHTML = units.map(u => `<option value="${u.id}" ${u.id === this.state.batchFromUnit ? 'selected' : ''}>${u.name[lang]}</option>`).join('');
    toSelect.innerHTML = units.map(u => `<option value="${u.id}" ${u.id === this.state.batchToUnit ? 'selected' : ''}>${u.name[lang]}</option>`).join('');

    catSelect.value = this.state.batchUnitCategory;

    catSelect.onchange = (e) => {
      this.state.batchUnitCategory = e.target.value;
      const m = flat[e.target.value];
      if (m && m.units) {
        const uKeys = Object.keys(m.units);
        this.state.batchFromUnit = uKeys[0];
        this.state.batchToUnit = uKeys[1] || uKeys[0];
      }
      this.populateBatchUnits();
      const inEl = document.getElementById('batch-input');
      if (inEl) inEl.dispatchEvent(new Event('input'));
    };

    fromSelect.onchange = (e) => {
      this.state.batchFromUnit = e.target.value;
      const inEl = document.getElementById('batch-input');
      if (inEl) inEl.dispatchEvent(new Event('input'));
    };

    toSelect.onchange = (e) => {
      this.state.batchToUnit = e.target.value;
      const inEl = document.getElementById('batch-input');
      if (inEl) inEl.dispatchEvent(new Event('input'));
    };
  }

  saveCalculationToHistory(fromVal, fromUnit, toVal, toUnit, mag) {
    if (isNaN(toVal) || !isFinite(toVal)) return;
    const item = {
      fromVal,
      fromUnit,
      toVal: formatEngineeredNumber(toVal, 'auto', this.state.lang),
      toUnit,
      category: this.state.category,
      magnitude: this.state.magnitude,
      time: Date.now()
    };
    // Keep max 8 unique items
    const filtered = this.state.history.filter(h => !(h.fromUnit === fromUnit && h.toUnit === toUnit && h.fromVal === fromVal));
    filtered.unshift(item);
    this.state.history = filtered.slice(0, 8);
    localStorage.setItem('datalaria_conversor_hist', JSON.stringify(this.state.history));
    this.renderHistory();
  }

  loadHistory() {
    try {
      const data = localStorage.getItem('datalaria_conversor_hist');
      if (data) this.state.history = JSON.parse(data);
    } catch {
      this.state.history = [];
    }
  }

  renderHistory() {
    const stripEl = document.getElementById('history-strip');
    if (!stripEl) return;
    const t = I18N[this.state.lang];
    const lang = this.state.lang;

    if (this.state.history.length === 0) {
      stripEl.style.display = 'none';
      return;
    }

    stripEl.style.display = 'flex';
    const isCollapsed = this.state.historyCollapsed;

    stripEl.innerHTML = `
      <div class="history-header">
        <div class="history-title-group">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="history-title">${t.historyTitle}</span>
          <span class="history-badge">${this.state.history.length}</span>
        </div>
        <div class="history-actions">
          <button id="btn-toggle-history" class="btn-history-toggle" title="${isCollapsed ? t.expandHistory : t.collapseHistory}">
            <span class="history-toggle-arrow">${isCollapsed ? '▶' : '▼'}</span>
            <span>${isCollapsed ? t.expandHistory : t.collapseHistory}</span>
          </button>
          <button id="btn-clear-history" class="btn-history-clear" title="${t.clearHistory}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span>${t.clearHistory}</span>
          </button>
        </div>
      </div>
      <div id="history-items-container" class="history-items-grid" style="${isCollapsed ? 'display: none;' : 'display: flex;'}">
        ${this.state.history.map((h, i) => `
          <button class="history-pill-card" data-idx="${i}" title="${h.fromVal} ${h.fromUnit} = ${h.toVal} ${h.toUnit}">
            <span class="hist-from">${h.fromVal} <small class="hist-unit">${h.fromUnit}</small></span>
            <span class="hist-arrow">➔</span>
            <span class="hist-to">${h.toVal} <small class="hist-unit">${h.toUnit}</small></span>
          </button>
        `).join('')}
      </div>
    `;

    const clearBtn = stripEl.querySelector('#btn-clear-history');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        this.state.history = [];
        localStorage.removeItem('datalaria_conversor_hist');
        this.renderHistory();
        this.showToast('✓ ' + (lang === 'es' ? 'Historial limpiado' : 'History cleared'));
      });
    }

    const toggleBtn = stripEl.querySelector('#btn-toggle-history');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        this.state.historyCollapsed = !this.state.historyCollapsed;
        this.renderHistory();
      });
    }

    stripEl.querySelectorAll('.history-pill-card').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = this.state.history[Number(btn.dataset.idx)];
        if (item) {
          this.state.category = item.category;
          this.state.magnitude = item.magnitude;
          this.state.fromUnit = item.fromUnit;
          this.state.toUnit = item.toUnit;
          this.state.inputValue = item.fromVal;
          this.renderCategoryNav();
          this.updateView();
          this.syncUrlParams();
          this.showToast(`✓ ${item.fromVal} ${item.fromUnit} ➔ ${item.toVal} ${item.toUnit}`);
        }
      });
    });
  }

  bindEvents() {
    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      // Don't trigger if typing in textarea or input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'x' || e.key === 'X') {
        const swapBtn = document.getElementById('btn-swap-units') || document.getElementById('btn-swap-rf-wav');
        if (swapBtn) swapBtn.click();
      } else if (e.key === 'c' || e.key === 'C') {
        const copyBtn = document.getElementById('btn-copy-result');
        if (copyBtn) copyBtn.click();
      } else if (e.key === 't' || e.key === 'T') {
        const themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) themeBtn.click();
      }
    });
  }
}


document.addEventListener('DOMContentLoaded', () => {
    const app = new UnitConverterApp();
    app.init();
    window._datalariaConversorApp = app;
});
    </script>
</body>
