<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lector Arcade — Aprendizaje de Lectura (Datalaria)</title>
  <meta name="theme-color" content="#0284c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/apps/reading/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/apps/reading/icon.svg">
  <link rel="alternate icon" type="image/png" href="/apps/reading/icon-192.png">
  <link rel="apple-touch-icon" href="/apps/reading/apple-touch-icon.png">
  <script>
    // Script Anti-FOUC para tema visual instantáneo (INV-READ-9)
    (function() {
      try {
        var savedTheme = localStorage.getItem('pref-theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <style>
/* apps/reading/styles.css - Design Tokens nativos y estilos Arcade 3D para Lector Arcade */
/* Especificación vinculada: DESIGN-APP-READING v1.0.0 (Comunalidad directa con apps/maths/styles.css) */

:root {
  /* Daylight Arcade (Light Mode - Default) */
  --bg-canvas: #f0f4ff;
  --bg-surface: #ffffff;
  --bg-elevated: #f8faff;
  --bg-inset: #eef2ff;
  --text-primary: #1e1b4b;
  --text-secondary: #475569;
  --text-muted: #64748b;
  --border-card: #e2e8f0;
  --border-strong: #cbd5e1;

  /* Acentos Arcade Base (Paridad Maths) */
  --op-add: #0284c7;
  --op-add-shadow: #0369a1;
  --op-sub: #f59e0b;
  --op-sub-shadow: #d97706;
  --op-mul: #10b981;
  --op-mul-shadow: #059669;
  --op-div: #8b5cf6;
  --op-div-shadow: #7c3aed;
  --op-mixed: #ec4899;
  --op-mixed-shadow: #db2777;

  --status-success: #10b981;
  --status-error: #f43f5e;
  --status-warning: #f59e0b;
  --accent-combo: #ff007a;

  /* Tokens Semánticos de Lectura y Sílabas */
  --syl-a: #0284c7;
  --syl-b: #e11d48;
  --syl-complex: #7c3aed;
  --vowel-bg: rgba(16, 185, 129, 0.14);
  --consonant-bg: rgba(14, 165, 233, 0.12);

  /* Dimensiones y Geometría */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 9999px;
  --font-sans: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --reading-max-width: 44ch;
  --reading-line-height: 1.65;
}

[data-theme="dark"] {
  /* Cosmic Night (Dark Mode) */
  --bg-canvas: #0b1120;
  --bg-surface: #1e293b;
  --bg-elevated: #334155;
  --bg-inset: #0f172a;
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --border-card: #334155;
  --border-strong: #475569;

  --syl-a: #38bdf8;
  --syl-b: #fb7185;
  --syl-complex: #a78bfa;
  --vowel-bg: rgba(16, 185, 129, 0.22);
  --consonant-bg: rgba(14, 165, 233, 0.20);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* ==========================================================================
   Shell Visual Datalaria (Header <= 60px)
   ========================================================================== */
.datalaria-shell {
  background: var(--bg-surface);
  border-bottom: 2px solid var(--border-card);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  z-index: 50;
  min-height: 52px;
}

.shell-left, .shell-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  max-width: 100%;
}

.shell-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--text-primary);
  text-decoration: none;
}

.shell-badge {
  background: var(--bg-inset);
  color: var(--op-add);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 0.75rem;
  font-weight: 700;
  font-family: var(--font-mono);
  border: 1px solid rgba(2, 132, 199, 0.25);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.shell-badge:hover {
  background: var(--op-add);
  color: #ffffff;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
}

/* Botones Arcade Generales */
.btn-arcade {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  border-bottom: 3px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 6px 12px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
  user-select: none;
}

.btn-arcade:active {
  transform: translateY(2px);
  border-bottom-width: 1px;
}

.btn-arcade-primary {
  background: var(--op-add);
  color: #ffffff;
  border-color: var(--op-add-shadow);
  border-bottom: 4px solid var(--op-add-shadow);
}

.btn-arcade-primary:active {
  border-bottom-width: 1px;
}

.btn-arcade-success {
  background: var(--status-success);
  color: #ffffff;
  border-color: var(--op-mul-shadow);
  border-bottom: 4px solid var(--op-mul-shadow);
}

.btn-arcade-danger {
  background: var(--status-error);
  color: #ffffff;
  border-color: #be123c;
  border-bottom: 4px solid #be123c;
}

.btn-arcade-install {
  background: linear-gradient(135deg, #10b981, #0284c7);
  color: #ffffff;
  border-color: #059669;
  border-bottom: 3px solid #047857;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* ==========================================================================
   Selector de Perfiles Familiares (#profile-bar)
   ========================================================================== */
.profile-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 16px;
  background: var(--bg-inset);
  border-bottom: 1px solid var(--border-card);
}

.profile-bar-label {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

.profile-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}

.profile-chip:hover {
  transform: translateY(-1px);
  color: var(--text-primary);
  border-color: var(--op-add);
}

.profile-chip.active {
  background: linear-gradient(135deg, rgba(2, 132, 199, 0.15), rgba(16, 185, 129, 0.15));
  border-color: var(--op-add);
  color: var(--op-add);
  box-shadow: 0 0 10px rgba(2, 132, 199, 0.25);
}

/* ==========================================================================
   Navegación por Pestañas (#tabs-nav)
   ========================================================================== */
.tabs-nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 16px auto;
  max-width: 600px;
  background: var(--bg-surface);
  padding: 6px;
  border-radius: var(--radius-pill);
  border: 2px solid var(--border-card);
}

.tab-btn {
  flex: 1;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
  user-select: none;
}

.tab-btn.active {
  background: var(--op-add);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
}

/* ==========================================================================
   Contenedores Principales y Tarjetas
   ========================================================================== */
.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 16px;
  flex: 1;
  width: 100%;
}

.card {
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  border: 2px solid var(--border-card);
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  margin-bottom: 20px;
  position: relative;
}

/* Grids de Selección: Niveles y Modos */
.levels-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px;
  margin: 16px 0;
}

.selectable-item {
  border: 2px solid var(--border-card);
  border-bottom: 4px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 14px;
  background: var(--bg-elevated);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.selectable-item:hover {
  border-color: var(--op-add);
}

.selectable-item.selected {
  border-color: var(--op-add);
  border-bottom-color: var(--op-add-shadow);
  background: var(--bg-inset);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(2, 132, 199, 0.2);
}

/* HUD de Juego */
.game-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px dashed var(--border-card);
}

.stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-inset);
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 0.9rem;
}

.streak-badge {
  background: linear-gradient(135deg, #f59e0b, #ec4899);
  color: #ffffff;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-weight: 800;
  animation: pulseStreak 1.5s infinite;
}

@keyframes pulseStreak {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* ==========================================================================
   Barra Pedagógica Transversal (.pedagogy-toolbar)
   ========================================================================== */
.pedagogy-toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 12px 0;
  flex-wrap: wrap;
}

.pedagogy-toggle-btn {
  background: var(--bg-surface);
  border: 2px solid var(--border-strong);
  border-bottom: 3px solid var(--border-strong);
  border-radius: var(--radius-pill);
  padding: 6px 14px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}

.pedagogy-toggle-btn.active {
  border-color: var(--op-add);
  border-bottom-color: var(--op-add-shadow);
  color: var(--op-add);
  background: var(--bg-inset);
  box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2);
}

/* Case transform */
.case-upper {
  text-transform: uppercase !important;
}

/* Tokens cromáticos silábicos */
.syl-a {
  color: var(--syl-a);
  font-weight: 800;
}

.syl-b {
  color: var(--syl-b);
  font-weight: 800;
}

.syl-complex {
  color: var(--syl-complex);
  font-weight: 800;
}

/* ==========================================================================
   Área de Lectura (.reading-stage)
   ========================================================================== */
.reading-stage {
  text-align: center;
  padding: 24px 16px;
  background: var(--bg-inset);
  border-radius: var(--radius-lg);
  margin: 16px 0;
  position: relative;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

/* Hero Word (L1, L2, L3, L4) */
.reading-word-hero {
  font-size: clamp(2.6rem, 7vw, 4.4rem);
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: 0.04em;
  word-break: break-word;
  user-select: none;
}

.reading-emoji-anchor {
  font-size: clamp(3.2rem, 9vw, 5.2rem);
  line-height: 1.1;
  user-select: none;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
}

/* ==========================================================================
   Ilustraciones Vectoriales SVG Inline (INV-READ-13)
   ========================================================================== */
.reading-svg-icon {
  width: 3.5rem;
  height: 3.5rem;
  display: inline-block;
  vertical-align: middle;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.reading-emoji-anchor .reading-svg-icon {
  width: clamp(3.4rem, 8vw, 5.2rem);
  height: clamp(3.4rem, 8vw, 5.2rem);
}

.phonics-emoji .reading-svg-icon {
  width: 2.2rem;
  height: 2.2rem;
}

.hint-emoji-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
}

.hint-emoji-wrap .reading-svg-icon {
  width: 1.9rem;
  height: 1.9rem;
}

.micro-check-btn .reading-svg-icon {
  width: 1.8rem;
  height: 1.8rem;
  margin-right: 4px;
}

.reading-emoji-char {
  display: inline-block;
  vertical-align: middle;
}

/* Frases de 2 y 3 Líneas (L5, L6) */
.reading-sentence-lines {
  max-width: var(--reading-max-width);
  line-height: var(--reading-line-height);
  letter-spacing: 0.02em;
  font-size: clamp(1.3rem, 4vw, 1.85rem);
  font-weight: 600;
  color: var(--text-primary);
  text-align: center;
  margin: 0 auto;
}

.reading-sentence-line {
  margin-bottom: 8px;
}

/* Puntos de golpeteo silábico y tokens */
.syllable-tokens-wrap {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.syllable-row {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.syl-token {
  padding: 2px 6px;
  border-radius: 6px;
  display: inline-block;
}

.syl-dot {
  font-weight: 900;
  color: var(--text-muted);
  margin: 0 1px;
}

.clap-dots-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  color: var(--op-sub);
  font-size: 0.8rem;
  opacity: 0.85;
}

/* ==========================================================================
   Cronómetro Lector Split y Botón "¡Leído!"
   ========================================================================== */
.stopwatch-pill {
  font-family: var(--font-mono);
  font-size: 1.25rem;
  font-weight: 800;
  background: var(--bg-surface);
  border: 2px solid var(--op-add);
  color: var(--op-add);
  padding: 6px 16px;
  border-radius: var(--radius-pill);
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.stopwatch-pill.frozen {
  border-color: var(--status-success);
  color: var(--status-success);
  background: rgba(16, 185, 129, 0.12);
  animation: popIn 0.3s ease;
}

.btn-read-done {
  min-height: 56px;
  min-width: 220px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #ffffff;
  border: 2px solid #047857;
  border-bottom: 5px solid #064e3b;
  border-radius: var(--radius-md);
  font-size: 1.35rem;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: transform 0.08s ease, filter 0.15s ease;
  user-select: none;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
}

.btn-read-done:hover {
  filter: brightness(1.08);
}

.btn-read-done:active {
  transform: translateY(3px);
  border-bottom-width: 2px;
}

/* ==========================================================================
   Huecos de Letras Faltantes (.letter-slot) & Teclado Táctil (.alpha-pad)
   ========================================================================== */
.letter-slots-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin: 16px auto;
  flex-wrap: wrap;
}

.letter-slot {
  width: 52px;
  height: 64px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-strong);
  border-bottom: 4px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 2.2rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  transition: all 0.15s ease;
}

.letter-slot.revealed {
  background: var(--bg-inset);
  color: var(--text-secondary);
}

.letter-slot.blank {
  background: var(--bg-surface);
  border-color: var(--op-add);
  border-style: dashed;
}

.letter-slot.active {
  border-color: var(--op-add);
  border-bottom-color: var(--op-add-shadow);
  border-style: solid;
  box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
  animation: pulseSlot 1.2s infinite;
}

.letter-slot.filled {
  border-style: solid;
  border-color: var(--op-add);
  background: rgba(2, 132, 199, 0.08);
  animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes pulseSlot {
  0%, 100% { border-color: var(--op-add); }
  50% { border-color: rgba(2, 132, 199, 0.3); }
}

/* Teclado Alfabético Táctil 3D (>= 52x52px) */
.alpha-pad {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  max-width: 480px;
  margin: 16px auto 0;
}

.alpha-btn {
  width: 54px;
  height: 56px;
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  border: 2px solid var(--border-strong);
  border-bottom: 5px solid var(--border-strong);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 1.55rem;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.08s ease, background 0.15s ease;
  user-select: none;
}

.alpha-btn:hover {
  border-color: var(--op-add);
}

.alpha-btn:active {
  transform: translateY(3px);
  border-bottom-width: 2px;
}

.alpha-btn.action-backspace {
  width: 72px;
  background: var(--status-error);
  color: #ffffff;
  border-color: #be123c;
  border-bottom-color: #be123c;
  font-size: 1.2rem;
}

/* ==========================================================================
   Opciones de Elección Múltiple y Micro-Check
   ========================================================================== */
.choices-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  width: 100%;
  max-width: 540px;
  margin: 16px auto 0;
}

.choice-btn {
  padding: 16px 20px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-card);
  border-bottom: 4px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 1.4rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: transform 0.08s ease, border-color 0.15s ease;
  user-select: none;
}

.choice-btn:hover {
  border-color: var(--op-add);
}

.choice-btn:active {
  transform: translateY(2px);
  border-bottom-width: 2px;
}

/* MicroCheck Container */
.micro-check-card {
  width: 100%;
  max-width: 540px;
  margin: 16px auto 0;
  padding: 18px;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-card);
  background: var(--bg-surface);
  text-align: center;
  animation: popIn 0.25s ease;
}

.micro-check-question {
  font-size: 1.15rem;
  font-weight: 800;
  margin-bottom: 14px;
  color: var(--text-primary);
}

.micro-check-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.micro-check-btn {
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border-strong);
  border-bottom: 4px solid var(--border-strong);
  background: var(--bg-elevated);
  color: var(--text-primary);
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  transition: all 0.15s ease;
}

.micro-check-btn:hover {
  border-color: var(--op-add);
  background: var(--bg-inset);
}

  function heuristicHyphenate(word, lang = 'es') {

    const VOWELS = new Set(['A', 'E', 'I', 'O', 'U', 'Á', 'É', 'Í', 'Ó', 'Ú', 'Ü', 'Y']);
    const STRONG_VOWELS = new Set(['A', 'E', 'O', 'Á', 'É', 'Ó', 'Í', 'Ú']);
    const INSEPARABLE = new Set([
      'CH', 'LL', 'RR',
      'BL', 'BR', 'CL', 'CR', 'DR', 'FL', 'FR', 'GL', 'GR', 'PL', 'PR', 'TR'
    ]);

    const vowelIndices = [];
    for (let i = 0; i < w.length; i++) {
      if (VOWELS.has(w[i])) {
        vowelIndices.push(i);
      }
    }

    if (vowelIndices.length <= 1) {
      return [w];
    }

    const splitPoints = [];
    for (let vi = 0; vi < vowelIndices.length - 1; vi++) {
      const v1 = vowelIndices[vi];
      const v2 = vowelIndices[vi + 1];
      const consLen = v2 - v1 - 1;

      if (consLen === 0) {
        const c1 = w[v1];
        const c2 = w[v2];
        if (STRONG_VOWELS.has(c1) && STRONG_VOWELS.has(c2)) {
          splitPoints.push(v1);
        }
      } else if (consLen === 1) {
        splitPoints.push(v1);
      } else if (consLen === 2) {
        const cluster = w.slice(v1 + 1, v2);
        if (INSEPARABLE.has(cluster)) {
          splitPoints.push(v1);
        } else {
          splitPoints.push(v1 + 1);
        }
      } else if (consLen === 3) {
        const lastTwo = w.slice(v2 - 2, v2);
        if (INSEPARABLE.has(lastTwo)) {
          splitPoints.push(v1 + 1);
        } else {
          splitPoints.push(v1 + 2);
        }
      } else {
        splitPoints.push(v1 + 2);
      }
    }

    if (splitPoints.length === 0) return [w];

    const syllables = [];
    let start = 0;
    for (const sp of splitPoints) {
      const syl = w.slice(start, sp + 1);
      if (syl) syllables.push(syl);
      start = sp + 1;
    }
    const lastSyl = w.slice(start);
    if (lastSyl) syllables.push(lastSyl);

    if (syllables.join('') !== w) {
      return [w];
    }
    return syllables;

   * Obtiene sílabas e ilustración para una palabra personalizada:
   * 1. Si existe en el catálogo, reutiliza sus sílabas canónicas y emoji/SVG.

  /**
   * Genera un reto dinámico de tipo 'fill_letters' (Nivel 3 con teclado 3D táctil)

    let pool = words;
    if (Array.isArray(recentIds) && recentIds.length > 0 && words.length > recentIds.length) {
      const excluded = new Set(recentIds);
      const filtered = words.filter(w => !excluded.has(`custom_${w}`));
      if (filtered.length > 0) pool = filtered;

    const pickedWord = pickRandom(pool, safeRng).toUpperCase();
    const sylData = splitCustomSyllables(pickedWord, safeLang);
    const syllables = sylData.syllables;
    const emoji = sylData.emoji;

    const len = pickedWord.length;
    const missingCount = len >= 5 ? 2 : 1;
    const indices = [];
    for (let i = 0; i < len; i++) indices.push(i);
    const shuffledIndices = shuffleArray(indices, safeRng);
    const missingIndices = shuffledIndices.slice(0, missingCount).sort((a, b) => a - b);

    const maskedSlots = missingIndices.map(idx => ({
      index: idx,
      expected: pickedWord.charAt(idx)

    const keyboardChars = buildKeyboardChars(pickedWord, missingIndices, safeLang, safeRng);

    return {
      id: `custom_${pickedWord}`,
      levelId: 'l3',
      lang: safeLang,
      kind: 'fill_letters',
      prompt: pickedWord,
      syllables,
      emoji,
      wordCount: 1,
      missingIndices,
      maskedSlots,
      keyboardChars,
      isCustomWord: true

    normalizeAnswer,
    normalizeChar,
    computeWpm,
    computeRoundScore,
    computeStarsForScore,
    parseCustomWordsParam,

// apps/reading/audio.js - Sintetizador Web Audio 8-bit, Web Speech TTS Dual (1.0x / 0.5x tortuga) y confeti en Canvas
(function(window) {
  'use strict';

  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (typeof window === 'undefined') return;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && AudioContextClass) {
      try {
        audioCtx = new AudioContextClass();
      } catch (e) {
        audioCtx = null;
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      try {
        audioCtx.resume();
      } catch (e) {
        // Ignorar bloqueo por política autoplay
      }
    }
  }

  const ReadingAudio = {
    toggleSound: function() {
      soundEnabled = !soundEnabled;
      return soundEnabled;
    },

    isSoundEnabled: function() {
      return soundEnabled;
    },

    setSoundEnabled: function(val) {
      soundEnabled = Boolean(val);
      return soundEnabled;
    },

    playTone: function(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Audio no bloqueante en entornos headless o sin permisos
      }
    },

    playSuccess: function(combo = 1) {
      if (!soundEnabled) return;
      initAudio();
      const base = 523.25; // Do5
      const note2 = base * (combo >= 2 ? 1.25 : 1.2);
      const note3 = base * (combo >= 3 ? 1.5 : 1.33);

      this.playTone(base, 'triangle', 0.12, 0.12);
      setTimeout(() => this.playTone(note2, 'triangle', 0.12, 0.12), 80);
      setTimeout(() => this.playTone(note3, 'sine', 0.25, 0.15), 160);
      if (combo >= 5) {
        setTimeout(() => this.playTone(base * 2, 'square', 0.3, 0.08), 240);
      }
    },

    playError: function() {
      if (!soundEnabled) return;
      initAudio();
      this.playTone(280, 'sawtooth', 0.15, 0.06);
      setTimeout(() => this.playTone(220, 'sawtooth', 0.2, 0.06), 120);
    },

    playClick: function() {
      this.playTone(600, 'sine', 0.04, 0.05);
    },

    playWin: function() {
      if (!soundEnabled) return;
      const notes = [440, 554.37, 659.25, 880];
      notes.forEach((freq, idx) => {
        setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.12), idx * 100);
      });
    },

    /**
     * Pronuncia un texto usando Web Speech API nativa sin llamadas a la nube (INV-READ-3).
     * Soporta velocidad normal (1.0x) y modo tortuga (0.5x).
     * Resiliente si window.speechSynthesis o SpeechSynthesisUtterance no existen.
     */
    speakText: function(text, lang = 'es', rate = 1.0) {
      if (!text || typeof window === 'undefined' || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance === 'undefined') {
        return false;
      }

      try {
        window.speechSynthesis.cancel();

        const UtteranceClass = window.SpeechSynthesisUtterance;
        const utterance = new UtteranceClass(String(text));
        utterance.rate = Math.max(0.45, Math.min(2.0, Number(rate) || 1.0));
        utterance.pitch = 1.0;

        const normLang = String(lang || 'es').toLowerCase();
        const targetLang = normLang.startsWith('en') ? 'en-US' : 'es-ES';
        utterance.lang = targetLang;

        if (typeof window.speechSynthesis.getVoices === 'function') {
          const voices = window.speechSynthesis.getVoices();
          if (Array.isArray(voices) && voices.length > 0) {
            const prefix = normLang.slice(0, 2);
            const matchingVoice = voices.find(v => v && typeof v.lang === 'string' && v.lang.toLowerCase().startsWith(prefix));
            if (matchingVoice) {
              utterance.voice = matchingVoice;
            }
          }
        }

        window.speechSynthesis.speak(utterance);
        return true;
      } catch (e) {
        return false;
      }
    },

    /**
     * Confeti físico sobre canvas sin dependencias externas.
     */
    launchConfetti: function(canvasEl) {
      if (!canvasEl || typeof canvasEl.getContext !== 'function') return;
      const ctx = canvasEl.getContext('2d');
      if (!ctx) return;

      const width = canvasEl.width = canvasEl.offsetWidth || (typeof window !== 'undefined' ? window.innerWidth : 800);
      const height = canvasEl.height = canvasEl.offsetHeight || (typeof window !== 'undefined' ? window.innerHeight : 600);

      const particles = [];
      const colors = ['#0ea5e9', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#f43f5e'];

      for (let i = 0; i < 70; i++) {
        particles.push({
          x: width / 2,
          y: height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 14,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      let animId = null;
      const raf = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : (fn => setTimeout(fn, 16));
      const caf = (typeof cancelAnimationFrame === 'function') ? cancelAnimationFrame : clearTimeout;

      function render() {
        ctx.clearRect(0, 0, width, height);
        let active = false;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // gravedad
          p.rotation += p.vRot;
          p.opacity -= 0.012;

          if (p.opacity > 0) {
            active = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        }

        if (active) {
          animId = raf(render);
        } else {
          ctx.clearRect(0, 0, width, height);
          if (animId !== null) caf(animId);
        }
      }

      render();
    }
  };

  window.ReadingAudio = ReadingAudio;
})(window);

    const profileObj = catalog.profiles.find(p => p.id === profileId);
    const profileName = profileObj ? `${profileObj.avatar} ${profileObj.name[lang]}` : profileId;
    showToast(`${t('profile_switched')} ${profileName}`);
    renderAll();
  }

  function showToast(msg, duration = 3000) {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  function initLang() {
    const params = new URLSearchParams(window.location.search);
    const urlLang = params.get('lang');
    if (urlLang === 'en' || urlLang === 'es') {
      lang = urlLang;
    } else {
      lang = (navigator.language && navigator.language.startsWith('en')) ? 'en' : 'es';
    }

    const queryMode = params.get('mode');
    if (queryMode && ['normal', 'stopwatch', 'sprint', 'daily'].includes(queryMode)) {
      selectedMode = queryMode;
    }
    const queryLevel = params.get('level');
    if (queryLevel && catalog.levels.some(l => l.id === queryLevel)) {
      selectedLevel = queryLevel;
    }
    const queryDate = params.get('date');
    if (queryDate && /^\d{4}-\d{2}-\d{2}$/.test(queryDate)) {
      dailyDateParam = queryDate;
    }

    const queryWords = params.get('words');
    if (queryWords && engine && typeof engine.parseCustomWordsParam === 'function') {
      customWordsList = engine.parseCustomWordsParam(queryWords);
    }

    const queryTab = params.get('tab');
    if (queryTab && ['play', 'learn', 'achievements'].includes(queryTab)) {
      activeTab = queryTab;
    }
  }

  function t(key) {
    return (catalog.i18n[lang] && catalog.i18n[lang][key]) || key;
  }

  function formatWordCase(str) {
    const raw = String(str || '');
    return useUpperCase ? raw.toUpperCase() : raw.toLowerCase();
  }

  function formatSentenceCase(str) {
    const raw = String(str || '');
    return useUpperCase ? raw.toUpperCase() : raw;
  }

  function formatStopwatch(ms) {
    const safeMs = Math.max(0, Number(ms) || 0);
    const totalTenths = Math.floor(safeMs / 100);
    const tenths = totalTenths % 10;
    const totalSec = Math.floor(totalTenths / 10);
    const secs = totalSec % 60;
    const mins = Math.floor(totalSec / 60);
    const mStr = String(mins).padStart(2, '0');
    const sStr = String(secs).padStart(2, '0');
    return `${mStr}:${sStr}.${tenths}`;
  }

  function getSafetyCapSec(levelId) {
    return (levelId === 'l5' || levelId === 'l6') ? 45 : 20;
  }

    return `

          ${useUpperCase ? 'AA MAYÚS' : 'Aa minús'}

      };

  // ==========================================================================
  // Pestaña 1: Jugar
  // ==========================================================================

              return `
                <div class="selectable-item ${selectedLevel === lvl.id ? 'selected' : ''}" data-level="${esc(lvl.id)}">
                  <div style="font-size: 1.8rem; margin-bottom: 4px;">${esc(lvl.icon)}</div>

                  <span style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-top: 4px;">${esc(lvl.desc[lang])}</span>
                  <div class="level-stars-badge" title="${stars}/3 estrellas">
                    <span>${starsGlyph}</span>
                    ${bestScore > 0 ? `<span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 4px;">${bestScore} pts</span>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <h2 style="font-size: 1.4rem; font-weight: 800; margin: 24px 0 8px;">${esc(t('choose_mode'))}</h2>

            ${catalog.modes.map(m => `
              <div class="selectable-item ${selectedMode === m.id ? 'selected' : ''}" data-mode="${esc(m.id)}">
                <div style="font-size: 1.8rem; margin-bottom: 4px;">${esc(m.icon)}</div>
                <strong style="display: block; font-size: 1.05rem;">${esc(m.name[lang])}</strong>
                <span style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-top: 4px;">${esc(m.desc[lang])}</span>

              ${customWordsList.length > 0 ? `<span class="custom-words-badge">${esc(t('custom_words_active_badge'))} (${customWordsList.length})</span>` : ''}
            </div>
            <p style="font-size: 0.88rem; color: var(--text-secondary); margin: 6px 0 8px;">${esc(t('custom_words_desc'))}</p>
            <input id="custom-words-input" type="text" class="custom-words-input" placeholder="${esc(t('custom_words_placeholder'))}" value="${esc(customWordsList.join(', '))}" />
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button id="btn-apply-custom-words" class="btn-arcade btn-arcade-primary" style="font-size: 0.9rem; padding: 8px 16px;">
                ${esc(t('custom_words_apply'))}
              </button>
              ${customWordsList.length > 0 ? `
                <button id="btn-clear-custom-words" class="btn-arcade" style="font-size: 0.9rem; padding: 8px 16px;">
                  ${esc(t('custom_words_clear'))}
                </button>
                <button id="btn-share-custom-words" class="btn-arcade" style="font-size: 0.9rem; padding: 8px 16px;">
                  ${esc(t('custom_words_share'))}

          <div style="text-align: center; margin-top: 30px;">
            <button id="btn-start" class="btn-arcade btn-arcade-primary" style="font-size: 1.3rem; padding: 14px 36px; border-radius: var(--radius-pill);">

      });
      container.querySelectorAll('[data-mode]').forEach(el => {

        applyWordsBtn.onclick = () => {
          audio.playClick();

            const parsed = engine.parseCustomWordsParam(inputEl.value);
            if (parsed.length > 0) {
              customWordsList = parsed;
              showToast(`${t('custom_words_active_badge')} (${parsed.length})`);

              customWordsList = [];
            }
            renderPlayTab();
          }
        };
      }

      if (clearWordsBtn) {
        clearWordsBtn.onclick = () => {
          audio.playClick();
          customWordsList = [];
          renderPlayTab();
        };
      }

      const shareWordsBtn = document.getElementById('btn-share-custom-words');
      if (shareWordsBtn) {
        shareWordsBtn.onclick = () => {
          audio.playClick();
          const url = `${window.location.origin}${window.location.pathname}?words=${encodeURIComponent(customWordsList.join(','))}`;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url)

              .catch(() => showToast(t('custom_words_copied')));
          } else {
            showToast(t('custom_words_copied'));
          }
        };

      const startBtn = document.getElementById('btn-start');
      if (startBtn) startBtn.onclick = startGameSession;
      return;
    }

    renderActiveGame(container);

  function renderVisual(emojiOrToken, wordHint) {
    if (typeof window !== 'undefined' && window.ReadingIllustrations && typeof window.ReadingIllustrations.renderVisual === 'function') {
      return window.ReadingIllustrations.renderVisual(emojiOrToken, wordHint);
    }
    return `<span class="reading-emoji-char">${esc(emojiOrToken || '')}</span>`;
  }

  function renderActiveStageContent() {
    if (!currentChallenge) return '<div>...</div>';
    const ch = currentChallenge;

    if (ch.levelId === 'l1') {
      const anchor = String(ch.anchorWord || ch.prompt || '');
      const target = String(ch.prompt || '');
      const upperAnchor = anchor.toUpperCase();
      const upperTarget = target.toUpperCase();
      let restWord = anchor;
      if (upperAnchor.startsWith(upperTarget)) {
        restWord = anchor.slice(target.length);
      }
      const promptLabel = lang === 'es' ? '¿Con qué letra o sílaba empieza?' : 'Starts with which letter?';

      return `
        <div class="reading-emoji-anchor" aria-hidden="true">${renderVisual(ch.emoji, ch.anchorWord || ch.prompt)}</div>
        <div class="reading-word-hero ${useUpperCase ? 'case-upper' : ''}">
          <span class="syl-a" style="border-bottom: 4px solid var(--op-add); padding: 0 6px;">?</span><span>${esc(formatWordCase(restWord))}</span>
        </div>
        <div style="font-size: 0.95rem; color: var(--text-secondary); font-weight: 600;">${esc(promptLabel)}</div>
        <div class="choices-grid">
          ${(ch.choices || []).map((c, idx) => `
            <button class="choice-btn ${useUpperCase ? 'case-upper' : ''}" data-choice-idx="${idx}" ${inFeedbackPause ? 'disabled' : ''}>
              <span>${esc(formatWordCase(c.label))}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    if (ch.levelId === 'l2') {
      const promptLabel = lang === 'es' ? 'Elige la palabra correcta para esta imagen:' : 'Pick the word matching this picture:';
      return `
        <div class="reading-emoji-anchor" aria-hidden="true">${renderVisual(ch.emoji, ch.prompt)}</div>
        <div style="font-size: 0.95rem; color: var(--text-secondary); font-weight: 600;">${esc(promptLabel)}</div>
        <div class="choices-grid">
          ${(ch.choices || []).map((c, idx) => `
            <button class="choice-btn ${useUpperCase ? 'case-upper' : ''}" data-choice-idx="${idx}" ${inFeedbackPause ? 'disabled' : ''}>
              <span>${esc(formatWordCase(c.label))}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    if (ch.levelId === 'l3') {
      const word = String(ch.prompt || '');
      const maskedIndices = ch.missingIndices || [];
      let slotCounter = 0;

      const slotsHtml = word.split('').map((char, charIdx) => {
        const isMissing = maskedIndices.includes(charIdx);
        if (!isMissing) {
          return `<div class="letter-slot revealed">${esc(formatWordCase(char))}</div>`;
        }
        const sIdx = slotCounter++;
        const filledChar = filledSlots[sIdx] || '';
        const isCurrent = sIdx === activeSlotCursor && !filledChar;
        const cls = filledChar
          ? 'letter-slot filled'
          : `letter-slot blank ${isCurrent ? 'active' : ''}`;
        return `<div class="${cls}" data-slot-idx="${sIdx}" role="button" tabindex="0">${esc(filledChar ? formatWordCase(filledChar) : '')}</div>`;
      }).join('');

      return `
        <div class="reading-emoji-anchor" aria-hidden="true">${renderVisual(ch.emoji, ch.prompt)}</div>
        <div style="font-size: 0.9rem; color: var(--text-secondary); font-weight: 600;">${esc(t('keyboard_tap_hint'))}</div>
        <div class="letter-slots-container ${useUpperCase ? 'case-upper' : ''}">
          ${slotsHtml}
        </div>
        <div class="alpha-pad">
          ${(ch.keyboardChars || []).map(kChar => `
            <button class="alpha-btn ${useUpperCase ? 'case-upper' : ''}" data-alpha-char="${esc(kChar)}" ${inFeedbackPause ? 'disabled' : ''}>
              ${esc(formatWordCase(kChar))}
            </button>
          `).join('')}
          <button class="alpha-btn action-backspace" data-alpha-action="del" title="${esc(t('clear_letter_btn'))}" ${inFeedbackPause ? 'disabled' : ''}>
            ⌫
          </button>
        </div>
      `;
    }

    // l4, l5, l6 ('read_check')
    let readingHtml = '';
    if (ch.levelId === 'l4') {
      if (colorSyllables && Array.isArray(ch.syllables) && ch.syllables.length > 0) {
        const styledSyllables = ch.syllables.map((s, idx) => {
          const formatted = formatWordCase(s);
          const cls = idx % 2 === 0 ? 'syl-a' : 'syl-b';
          return `<span class="${cls}">${esc(formatted)}</span>`;
        }).join('<span class="syl-dot" aria-hidden="true">·</span>');
        readingHtml = `<div class="reading-word-hero ${useUpperCase ? 'case-upper' : ''}">${styledSyllables}</div>`;
      } else {
        readingHtml = `<div class="reading-word-hero ${useUpperCase ? 'case-upper' : ''}">${esc(formatWordCase(ch.prompt))}</div>`;
      }
    } else {
      const lines = Array.isArray(ch.lines) ? ch.lines : [ch.prompt];
      readingHtml = `
        <div class="reading-sentence-lines ${useUpperCase ? 'case-upper' : ''}">
          ${lines.map(line => `<div class="reading-sentence-line">${esc(formatSentenceCase(line))}</div>`).join('')}
        </div>
      `;
    }

    if (!awaitingMicroCheck) {
      return `
        ${readingHtml}
        ${selectedMode === 'stopwatch' ? `<div style="font-size: 0.88rem; color: var(--text-secondary); font-weight: 600;">${esc(t('stopwatch_hint'))}</div>` : ''}
        <button id="btn-read-done" class="btn-read-done" ${inFeedbackPause ? 'disabled' : ''}>
          ${esc(t('read_done_btn'))}
        </button>
      `;
    }

    // Estado 2 tras congelar cronómetro: Micro-Check de Comprensión
    const mc = ch.microCheck || { question: '', options: [] };
    return `
      ${ch.levelId === 'l4' && ch.emoji ? `<div class="reading-emoji-anchor" style="font-size: 3rem;" aria-hidden="true">${renderVisual(ch.emoji, ch.prompt)}</div>` : ''}
      <div class="micro-check-card">
        <div style="font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--op-add); margin-bottom: 6px;">
          ${esc(t('micro_check_title'))}
        </div>
        <div class="micro-check-question">${esc(mc.question)}</div>
        <div class="micro-check-options">
          ${(mc.options || []).map((opt, idx) => `
            <button class="micro-check-btn" data-mc-idx="${idx}" ${inFeedbackPause ? 'disabled' : ''}>
              <span class="mc-icon-wrap" style="font-size: 1.5rem; display: inline-flex; align-items: center;">${renderVisual(opt.icon || opt.emoji || '', opt.label)}</span>
              <span>${esc(opt.label)}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderActiveGame(container) {
    if (!container) return;

    let roundLabel = '';
    if (selectedMode === 'normal') roundLabel = `🧘 ${t('round')} ${roundIndex}/${TOTAL_ROUNDS}`;
    else if (selectedMode === 'stopwatch') roundLabel = `⏱️ ${t('round')} ${roundIndex}/${TOTAL_ROUNDS}`;
    else if (selectedMode === 'daily') roundLabel = `📅 ${t('daily_challenge_label')} ${roundIndex}/${TOTAL_ROUNDS}`;
    else roundLabel = `⚡ ${t('round')} ${roundIndex}`;

    const comboMultiplier = streak >= 5 ? 3 : (streak >= 3 ? 2 : 1);

    let clockHudHtml = '';
    if (selectedMode === 'stopwatch' || selectedMode === 'daily') {
      const isFrozen = frozenElapsedMs !== null;
      const shownMs = isFrozen ? frozenElapsedMs : stopwatchElapsedMs;
      const wpmBadge = isFrozen && frozenWpm > 0 ? ` · ${frozenWpm} ${t('wpm_label')}` : '';
      clockHudHtml = `
        <div id="stopwatch-pill" class="stopwatch-pill ${isFrozen ? 'frozen' : ''}">
          <span>${isFrozen ? '✅' : '⏱️'}</span>
          <span id="stopwatch-display">${formatStopwatch(shownMs)}${esc(wpmBadge)}</span>
        </div>
      `;
    } else if (selectedMode === 'sprint') {
      const pct = Math.max(0, Math.min(100, (sprintTimeLeft / sprintTotalTime) * 100));
      clockHudHtml = `
        <div class="stat-chip" style="border: 2px solid var(--op-add); color: var(--op-add); font-family: var(--font-mono);">
          ⚡ <span id="sprint-seconds">${Math.max(0, sprintTimeLeft).toFixed(1)}s</span>
        </div>
        <div style="width: 100%; height: 10px; background: var(--bg-inset); border-radius: var(--radius-pill); overflow: hidden;">
          <div id="timer-bar-fill" style="height: 100%; width: ${pct}%; background: linear-gradient(90deg, var(--op-add), var(--op-mul)); transition: width 0.1s linear;"></div>
        </div>
      `;
    }

    const html = `
      <div class="card" style="position: relative;">
        <canvas id="confetti-canvas"></canvas>
        <div class="game-header">
          <button id="btn-exit-game" class="btn-arcade">${esc(t('back_menu'))}</button>
          <div class="stat-chip">${esc(roundLabel)}</div>
          <div class="stat-chip">⭐ ${esc(t('points'))}: <strong style="font-family: var(--font-mono); margin-left: 4px;">${score}</strong></div>
          ${streak >= 2 ? `<div class="streak-badge">🔥 ${streak} ${esc(t('streak'))} (x${comboMultiplier})</div>` : ''}
          ${clockHudHtml}
        </div>

        ${renderPedagogyToolbar()}

        <div id="feedback-banner-container"></div>

        <div class="reading-stage">
          ${renderActiveStageContent()}
        </div>

        <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
          <button id="btn-toggle-hint" class="btn-arcade" style="background: var(--bg-inset);">
            ${esc(isHintVisible ? t('hide_hint') : t('visual_hint'))}
          </button>
          <button id="btn-listen-normal" class="btn-arcade" style="background: var(--bg-inset);">
            🔊 ${esc(t('listen_normal_btn'))}
          </button>
          <button id="btn-listen-slow" class="btn-arcade" style="background: var(--bg-inset);">
            🐢 ${esc(t('listen_slow_btn'))}
          </button>
          <button id="btn-skip" class="btn-arcade" style="background: var(--bg-inset);">
            ${esc(t('skip'))}
          </button>
        </div>

        <div id="hint-container" class="${isHintVisible ? '' : 'hidden'}" style="margin-bottom: 16px;">
          ${currentChallenge ? engine.renderVisualHint(currentChallenge, lang) : ''}
        </div>
      </div>
    `;

    container.innerHTML = html;

    bindPedagogyToolbar(() => {
      if (inGame && !inFeedbackPause) {
        renderActiveGame(document.getElementById('tab-content'));
      }
    });

    const exitBtn = document.getElementById('btn-exit-game');
    if (exitBtn) {
      exitBtn.onclick = () => {
        endGameSession();
        renderPlayTab();
      };
    }

    const hintBtn = document.getElementById('btn-toggle-hint');
    if (hintBtn) hintBtn.onclick = toggleVisualHint;

    const listenNormalBtn = document.getElementById('btn-listen-normal');
    if (listenNormalBtn) {
      listenNormalBtn.onclick = () => {
        if (!currentChallenge || inFeedbackPause) return;
        hintUsedThisRound = true;
        const textToSpeak = currentChallenge.levelId === 'l1'
          ? `${currentChallenge.prompt}. ${currentChallenge.anchorWord || ''}`
          : currentChallenge.prompt;
        audio.speakText(textToSpeak, lang, 1.0);
        triggerSyllableKaraoke(1.0);
      };
    }

    const listenSlowBtn = document.getElementById('btn-listen-slow');
    if (listenSlowBtn) {
      listenSlowBtn.onclick = () => {
        if (!currentChallenge || inFeedbackPause) return;
        hintUsedThisRound = true;
        const textToSpeak = currentChallenge.levelId === 'l1'
          ? `${currentChallenge.prompt}. ${currentChallenge.anchorWord || ''}`
          : currentChallenge.prompt;
        audio.speakText(textToSpeak, lang, 0.5);
        triggerSyllableKaraoke(0.5);
      };
    }

    const skipBtn = document.getElementById('btn-skip');
    if (skipBtn) {
      skipBtn.onclick = () => {
        if (inFeedbackPause) return;
        const elapsed = frozenElapsedMs !== null ? frozenElapsedMs : Math.max(400, Math.round(performance.now() - roundStartMs));
        handleChallengeResult(false, true, getExpectedDisplay(), elapsed, 0, '');
      };
    }

    // Bindings específicos por nivel
    container.querySelectorAll('[data-choice-idx]').forEach(btn => {
      btn.onclick = () => {
        if (inFeedbackPause || !currentChallenge) return;
        const idx = Number(btn.getAttribute('data-choice-idx'));
        const choice = currentChallenge.choices[idx];
        if (!choice) return;
        const elapsed = Math.max(400, Math.round(performance.now() - roundStartMs));
        freezeClockOnly(elapsed);
        const evalRes = engine.evaluateChallenge(currentChallenge, choice, lang);
        handleChallengeResult(evalRes.isCorrect, false, evalRes.correctDisplay, elapsed, frozenWpm, evalRes.userDisplay);
      };
    });

    container.querySelectorAll('[data-alpha-char]').forEach(btn => {
      btn.onclick = () => {
        handleAlphaPress(btn.getAttribute('data-alpha-char'));
      };
    });

    const backspaceBtn = container.querySelector('[data-alpha-action="del"]');
    if (backspaceBtn) {
      backspaceBtn.onclick = () => handleAlphaBackspace();
    }

    container.querySelectorAll('.letter-slot[data-slot-idx]').forEach(slotEl => {
      slotEl.onclick = () => {
        if (inFeedbackPause) return;
        const sIdx = Number(slotEl.getAttribute('data-slot-idx'));
        if (filledSlots[sIdx]) {
          filledSlots[sIdx] = '';
        }
        activeSlotCursor = sIdx;
        renderActiveGame(document.getElementById('tab-content'));
      };
    });

    const readDoneBtn = document.getElementById('btn-read-done');
    if (readDoneBtn) {
      readDoneBtn.onclick = () => handleReadDone();
    }

    container.querySelectorAll('[data-mc-idx]').forEach(btn => {
      btn.onclick = () => {
        if (inFeedbackPause || !currentChallenge) return;
        const idx = Number(btn.getAttribute('data-mc-idx'));
        const evalRes = engine.evaluateChallenge(currentChallenge, { index: idx }, lang);
        const elapsed = frozenElapsedMs !== null ? frozenElapsedMs : Math.max(400, Math.round(performance.now() - roundStartMs));
        handleChallengeResult(evalRes.isCorrect, false, evalRes.correctDisplay, elapsed, frozenWpm, evalRes.userDisplay);
      };
    });
  }

  function getExpectedDisplay() {
    if (!currentChallenge) return '';
    if (currentChallenge.kind === 'read_check' && currentChallenge.microCheck) {
      const corr = (currentChallenge.microCheck.options || []).find(o => o.isCorrect);
      if (corr) return `${corr.icon || corr.emoji || ''} ${corr.label}`.trim();
    }
    return currentChallenge.prompt || '';
  }

  function toggleVisualHint() {
    isHintVisible = !isHintVisible;
    if (isHintVisible) hintUsedThisRound = true;
    const hintEl = document.getElementById('hint-container');
    const btnEl = document.getElementById('btn-toggle-hint');
    if (hintEl && btnEl) {
      if (isHintVisible) {
        hintEl.classList.remove('hidden');
        btnEl.textContent = t('hide_hint');
      } else {
        hintEl.classList.add('hidden');
        btnEl.textContent = t('visual_hint');
      }
    }
  }

  function triggerSyllableKaraoke(rate) {
    karaokeTimeouts.forEach(t => clearTimeout(t));
    karaokeTimeouts = [];
    document.querySelectorAll('.karaoke-active').forEach(el => el.classList.remove('karaoke-active'));

    let targets = Array.from(document.querySelectorAll('.reading-stage .syl-token, .reading-stage .syl-a, .reading-stage .syl-b, .reading-stage .letter-slot'));
    if (targets.length === 0) {
      targets = Array.from(document.querySelectorAll('.reading-stage .reading-sentence-line, .reading-stage .reading-word-hero'));
    }
    if (targets.length === 0) return;

    const stepMs = rate <= 0.6 ? 620 : 320;
    targets.forEach((el, idx) => {
      const tStart = setTimeout(() => {
        targets.forEach(t => t.classList.remove('karaoke-active'));
        el.classList.add('karaoke-active');
      }, idx * stepMs);

      const tEnd = setTimeout(() => {
        el.classList.remove('karaoke-active');
      }, (idx + 1) * stepMs);

      karaokeTimeouts.push(tStart, tEnd);
    });
  }

  function freezeClockOnly(elapsedMs) {
    if (selectedMode !== 'sprint') {
      clearInterval(timerInterval);
    }
    frozenElapsedMs = elapsedMs;
    const count = (currentChallenge && currentChallenge.wordCount) || 1;
    frozenWpm = currentChallenge ? engine.computeWpm(count, elapsedMs) : 0;
  }

  function handleReadDone() {
    if (!inGame || inFeedbackPause || awaitingMicroCheck || !currentChallenge) return;
    audio.playClick();
    const elapsed = Math.max(400, Math.round(performance.now() - roundStartMs));
    freezeClockOnly(elapsed);
    awaitingMicroCheck = true;
    renderActiveGame(document.getElementById('tab-content'));
  }

  function handleAlphaPress(ch) {
    if (!inGame || inFeedbackPause || !currentChallenge || currentChallenge.kind !== 'fill_letters') return;
    const slotsCount = (currentChallenge.maskedSlots || []).length;
    if (slotsCount === 0) return;

    audio.playClick();
    const normChar = engine.normalizeChar(ch);
    if (!normChar) return;

    // Buscar hueco activo o el siguiente vacío
    let targetSlot = activeSlotCursor;
    if (targetSlot < 0 || targetSlot >= slotsCount || filledSlots[targetSlot]) {
      const nextEmpty = findFirstEmptySlot(slotsCount);
      if (nextEmpty === -1) return;
      targetSlot = nextEmpty;
    }

    filledSlots[targetSlot] = normChar;
    const nextEmpty = findFirstEmptySlot(slotsCount);

    if (nextEmpty === -1) {
      // Último hueco rellenado: detener cronómetro al instante y evaluar
      activeSlotCursor = slotsCount - 1;
      const elapsed = Math.max(400, Math.round(performance.now() - roundStartMs));
      freezeClockOnly(elapsed);
      renderActiveGame(document.getElementById('tab-content'));
      const evalRes = engine.evaluateChallenge(currentChallenge, filledSlots, lang);
      handleChallengeResult(evalRes.isCorrect, false, evalRes.correctDisplay, elapsed, frozenWpm, evalRes.userDisplay);
    } else {
      activeSlotCursor = nextEmpty;
      renderActiveGame(document.getElementById('tab-content'));
    }
  }

  function findFirstEmptySlot(slotsCount) {
    for (let i = 0; i < slotsCount; i++) {
      if (!filledSlots[i]) return i;
    }
    return -1;
  }

  function handleAlphaBackspace() {
    if (!inGame || inFeedbackPause || !currentChallenge || currentChallenge.kind !== 'fill_letters') return;
    audio.playClick();
    const slotsCount = (currentChallenge.maskedSlots || []).length;
    if (filledSlots[activeSlotCursor]) {
      filledSlots[activeSlotCursor] = '';
    } else {
      for (let i = slotsCount - 1; i >= 0; i--) {
        if (filledSlots[i]) {
          filledSlots[i] = '';
          activeSlotCursor = i;
          break;
        }
      }
    }
    renderActiveGame(document.getElementById('tab-content'));
  }

  function submitL3IfComplete() {
    if (!inGame || inFeedbackPause || !currentChallenge || currentChallenge.kind !== 'fill_letters') return;
    const slotsCount = (currentChallenge.maskedSlots || []).length;
    if (findFirstEmptySlot(slotsCount) !== -1) return;
    const elapsed = Math.max(400, Math.round(performance.now() - roundStartMs));
    freezeClockOnly(elapsed);
    const evalRes = engine.evaluateChallenge(currentChallenge, filledSlots, lang);
    handleChallengeResult(evalRes.isCorrect, false, evalRes.correctDisplay, elapsed, frozenWpm, evalRes.userDisplay);
  }

  function handleChallengeResult(isCorrect, isSkipped, correctDisplay, elapsedMs, roundWpm, userDisplay) {
    clearInterval(timerInterval);
    clearTimeout(feedbackTimeout);

    const bannerContainer = document.getElementById('feedback-banner-container');
    let pointsEarned = 0;
    const resolvedCorrect = correctDisplay || getExpectedDisplay();

    roundHistory.push({
      round: roundIndex,
      challenge: currentChallenge,
      isCorrect: Boolean(isCorrect),
      usedHint: hintUsedThisRound,
      skipped: Boolean(isSkipped),
      elapsedMs: elapsedMs || 0,
      wpm: isCorrect ? (roundWpm || 0) : 0,
      userDisplay: userDisplay || '',
      correctDisplay: resolvedCorrect
    });

    if (isCorrect) {
      streak += 1;
      if (streak > bestStreak) bestStreak = streak;
      correctCount += 1;

      const targetSec = getSafetyCapSec(selectedLevel);
      pointsEarned = engine.computeRoundScore({
        mode: selectedMode,
        streak,
        usedHint: hintUsedThisRound,
        elapsedMs,
        targetSec
      });
      score += pointsEarned;
      audio.playSuccess(streak);

      if (roundWpm > 0 && roundWpm > (userStats.bestWpm || 0)) {
        userStats.bestWpm = roundWpm;
        saveStats();
      }

      if (selectedMode === 'sprint' && streak > 0 && streak % 5 === 0) {
        sprintTimeLeft = Math.min(60, sprintTimeLeft + 3);
      }

      if (roundWpm >= 120) {
        unlockMedal('speed_reader');
      }

      const speedNote = roundWpm > 0
        ? ` · ${roundWpm} ${t('wpm_label')}`
        : ` (${(elapsedMs / 1000).toFixed(1)}s)`;

      if (bannerContainer) {
        bannerContainer.innerHTML = `
          <div class="feedback-banner feedback-success">
            <span>${esc(t('awesome'))} +${pointsEarned} pts${esc(speedNote)}</span>
            <span>⭐</span>
          </div>
        `;
      }
    } else {
      streak = 0;
      wrongCount += 1;
      if (!isSkipped) audio.playError();

      if (bannerContainer) {
        bannerContainer.innerHTML = `
          <div class="feedback-banner feedback-error">
            <span>${esc(t('good_try'))} ${esc(t('correct_answer_is'))} <strong>${esc(resolvedCorrect)}</strong></span>
            <button id="btn-next-fast" class="btn-arcade" style="padding: 4px 10px; font-size: 0.8rem; background: var(--bg-surface);">${esc(t('next_question_btn'))}</button>
          </div>
        `;
        const nextBtn = document.getElementById('btn-next-fast');
        if (nextBtn) {
          nextBtn.onclick = () => {
            clearTimeout(feedbackTimeout);
            advanceRound();
          };
        }
      }
    }

    checkMedalsDuringGame();
    inFeedbackPause = true;

    const pauseMs = isCorrect ? 850 : 2100;
    feedbackTimeout = setTimeout(() => {
      advanceRound();
    }, pauseMs);
  }

  function advanceRound() {
    inFeedbackPause = false;
    awaitingMicroCheck = false;
    if ((selectedMode === 'normal' || selectedMode === 'stopwatch' || selectedMode === 'daily') && roundIndex >= TOTAL_ROUNDS) {
      finishGame();
    } else if (selectedMode === 'sprint' && sprintTimeLeft <= 0) {
      finishGame();
    } else {
      nextChallenge();
    }
  }

  function startGameSession() {
    inGame = true;
    inFeedbackPause = false;
    awaitingMicroCheck = false;
    roundIndex = 0;
    score = 0;
    correctCount = 0;
    wrongCount = 0;
    streak = 0;
    bestStreak = 0;
    isHintVisible = false;
    hintUsedThisRound = false;
    roundHistory = [];
    recentIds = [];

    if (selectedMode === 'daily') {
      const dateStr = dailyDateParam || new Date().toISOString().slice(0, 10);
      dailyRng = engine.createSeededRng(`${dateStr}_${selectedLevel}`);
    } else {
      dailyRng = null;
    }

    if (selectedMode === 'sprint') {
      sprintTotalTime = 60.0;
      sprintTimeLeft = 60.0;
    }

    nextChallenge();
  }

  function nextChallenge() {
    clearInterval(timerInterval);
    clearTimeout(feedbackTimeout);

    roundIndex += 1;
    isHintVisible = false;
    hintUsedThisRound = false;
    awaitingMicroCheck = false;
    frozenElapsedMs = null;
    frozenWpm = 0;
    stopwatchElapsedMs = 0;
    filledSlots = [];
    activeSlotCursor = 0;

    const prng = (selectedMode === 'daily' && typeof dailyRng === 'function') ? dailyRng : null;
    if (customWordsList && customWordsList.length > 0) {
      currentChallenge = engine.generateCustomChallenge(customWordsList, lang, prng, recentIds);
    } else {
      currentChallenge = engine.generateChallenge(selectedLevel, lang, prng, recentIds);
    }
    if (currentChallenge && currentChallenge.id) {
      recentIds.push(currentChallenge.id);
      if (recentIds.length > 10) recentIds.shift();
    }
    if (currentChallenge && Array.isArray(currentChallenge.maskedSlots)) {
      filledSlots = new Array(currentChallenge.maskedSlots.length).fill('');
    }

    roundStartMs = performance.now();
    renderActiveGame(document.getElementById('tab-content'));
    startTimer();
  }

  function startTimer() {
    clearInterval(timerInterval);
    if (selectedMode === 'normal') return;

    const safetyCapMs = getSafetyCapSec(selectedLevel) * 1000;

    timerInterval = setInterval(() => {
      if (inFeedbackPause) return;

      if (selectedMode === 'sprint') {
        sprintTimeLeft -= 0.1;
        const secEl = document.getElementById('sprint-seconds');
        if (secEl) secEl.textContent = `${Math.max(0, sprintTimeLeft).toFixed(1)}s`;
        const fillEl = document.getElementById('timer-bar-fill');
        if (fillEl) {
          fillEl.style.width = `${Math.max(0, (sprintTimeLeft / sprintTotalTime) * 100)}%`;
        }
        if (sprintTimeLeft <= 0) {
          clearInterval(timerInterval);
          finishGame();
        }
        return;
      }

      // 'stopwatch' o 'daily'
      if (frozenElapsedMs !== null) return;
      stopwatchElapsedMs = Math.max(0, performance.now() - roundStartMs);
      const dispEl = document.getElementById('stopwatch-display');
      if (dispEl) {
        dispEl.textContent = formatStopwatch(stopwatchElapsedMs);
      }

      if (selectedMode === 'stopwatch' && stopwatchElapsedMs >= safetyCapMs) {
        clearInterval(timerInterval);
        handleChallengeResult(false, false, getExpectedDisplay(), safetyCapMs, 0, '');
      }
    }, 100);
  }

  function unlockMedal(medalId) {
    if (!userStats.unlockedMedals.includes(medalId)) {
      userStats.unlockedMedals.push(medalId);
      saveStats();
      showToast(`🎖️ ${t('badge_unlocked')}`);
    }
  }

  function checkMedalsDuringGame() {
    if (streak >= 5) unlockMedal('streak_5');
    if (streak >= 10) unlockMedal('streak_10');
  }

  function checkEndOfGameMedals() {
    if (correctCount >= 1) unlockMedal('first_win');
    if ((selectedLevel === 'l3' || selectedLevel === 'l4') && wrongCount === 0 && correctCount >= 5) {
      unlockMedal('syllable_master');
    }
    if ((selectedLevel === 'l5' || selectedLevel === 'l6') && wrongCount === 0 && correctCount >= 5) {
      unlockMedal('storyteller');
    }
  }

  function finishGame() {
    clearInterval(timerInterval);
    clearTimeout(feedbackTimeout);
    inGame = false;
    inFeedbackPause = false;
    awaitingMicroCheck = false;
    audio.playWin();

    if (!userStats.highScores[selectedLevel] || score > userStats.highScores[selectedLevel]) {
      userStats.highScores[selectedLevel] = score;
    }
    if (bestStreak > userStats.bestStreakEver) {
      userStats.bestStreakEver = bestStreak;
    }
    checkEndOfGameMedals();
    saveStats();

    const container = document.getElementById('tab-content');
    if (!container) return;

    const totalPlayed = roundHistory.length || roundIndex;
    const accuracy = totalPlayed > 0 ? Math.round((correctCount / totalPlayed) * 100) : 0;

    // Estadísticas PPM de la sesión
    const wpmList = roundHistory.map(r => r.wpm).filter(w => w > 0);
    const avgWpm = wpmList.length > 0 ? Math.round(wpmList.reduce((a, b) => a + b, 0) / wpmList.length) : 0;
    const maxWpmSession = wpmList.length > 0 ? Math.max(...wpmList) : 0;
    const effectiveWpm = Math.round(avgWpm * (accuracy / 100));

    // Tira Wordle (🟩 Acierto limpio, 💡 Acierto con pista, 🟥 Fallo)
    const emojiStrip = roundHistory.map(r => {
      if (r.isCorrect && !r.usedHint) return '🟩';
      if (r.isCorrect && r.usedHint) return '💡';
      return '🟥';
    }).join('');

    const mistakes = roundHistory.filter(r => !r.isCorrect);
    let mistakesHtml = '';
    if (mistakes.length > 0) {
      mistakesHtml = `
        <div class="mistake-review-section">
          <div class="mistake-review-title">
            <span>${esc(t('mistake_review_title'))}</span>
            <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">(${mistakes.length})</span>
          </div>
          <div class="mistake-list">
            ${mistakes.map((m, idx) => `
              <div class="mistake-card">
                <div class="mistake-header" style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
                  <span class="mistake-problem-text" style="font-weight:800; font-size:1.1rem;">${esc(m.challenge ? m.challenge.prompt : '...')}</span>
                  <span style="font-size: 0.85rem; color: var(--status-error); font-weight: 700;">${esc(t('round'))} ${m.round}</span>
                </div>
                <div class="mistake-details" style="display:flex; flex-direction:column; gap:4px; font-size:0.9rem; margin-bottom:10px;">
                  <span>${esc(t('mistake_your_answer'))} <strong>${esc(m.userDisplay || (m.skipped ? t('skip') : '⏱️'))}</strong></span>
                  <span>${esc(t('mistake_correct_answer'))} <strong style="color: var(--status-success);">${esc(m.correctDisplay)}</strong></span>
                </div>
                <div class="mistake-hint-toggle" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                  <button class="btn-arcade btn-mistake-audio" data-mistake-idx="${idx}" style="font-size: 0.8rem; padding: 4px 10px; background: var(--bg-surface);">
                    🐢 ${esc(t('listen_slow_btn'))}
                  </button>
                  <button class="btn-arcade btn-mistake-hint" data-mistake-idx="${idx}" style="font-size: 0.8rem; padding: 4px 10px; background: var(--bg-surface);">
                    ${esc(t('view_hint_btn'))}
                  </button>
                  <div id="mistake-hint-${idx}" class="mistake-hint-container hidden" style="width:100%;">
                    ${m.challenge ? engine.renderVisualHint(m.challenge, lang) : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else if (roundHistory.length > 0) {
      mistakesHtml = `
        <div class="mistake-review-section" style="text-align: center;">
          <div style="background: rgba(16, 185, 129, 0.15); border: 2px solid var(--status-success); border-radius: var(--radius-md); padding: 14px 20px; color: #065f46; font-weight: 700;">
            ${esc(t('mistake_review_empty'))}
          </div>
        </div>
      `;
    }

    const html = `
      <div class="card text-center" style="position: relative;">
        <canvas id="confetti-canvas"></canvas>
        <div style="font-size: 4rem; margin-bottom: 12px;">🏆</div>
        <h2 style="font-size: 2rem; font-weight: 800; color: var(--text-primary);">${esc(t('game_over'))}</h2>

        <div style="display: flex; gap: 16px; justify-content: center; margin: 20px 0 12px; flex-wrap: wrap;">
          <div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">⭐ ${esc(t('points'))}: <strong>${score}</strong></div>
          <div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">🎯 ${esc(t('accuracy'))}: <strong>${accuracy}%</strong></div>
          <div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">🔥 ${esc(t('best_streak'))}: <strong>${bestStreak}</strong></div>
          ${avgWpm > 0 ? `<div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">⏱️ ${esc(t('wpm_label'))}: <strong>${avgWpm} (${lang === 'es' ? 'Máx' : 'Max'} ${maxWpmSession})</strong></div>` : ''}
          ${avgWpm > 0 ? `<div class="stat-chip" style="font-size: 1.1rem; padding: 10px 18px;">🎯 ${esc(t('effective_wpm_label'))}: <strong>${effectiveWpm} ${esc(t('wpm_label'))}</strong></div>` : ''}
        </div>

        ${emojiStrip ? `
          <div class="round-blocks-strip" title="Resumen gráfico de respuestas">${emojiStrip}</div>
        ` : ''}

        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
          <button id="btn-share-result" class="btn-arcade btn-share-result" style="font-size: 1.05rem; padding: 12px 22px;">
            ${esc(t('share_result_btn'))}
          </button>
          <button id="btn-again" class="btn-arcade btn-arcade-primary" style="font-size: 1.05rem; padding: 12px 22px;">
            ${esc(t('play_again'))}
          </button>
          <button id="btn-download-sheet" class="btn-arcade btn-arcade-sheet" style="font-size: 1.05rem; padding: 12px 22px;">
            ${esc(t('download_sheet_btn'))}
          </button>
          <button id="btn-finish-diploma" class="btn-arcade btn-arcade-diploma" style="font-size: 1.05rem; padding: 12px 22px;">
            ${esc(t('download_diploma_btn'))}
          </button>
          <button id="btn-badges" class="btn-arcade" style="font-size: 1.05rem; padding: 12px 22px;">
            ${esc(t('view_achievements'))}
          </button>
        </div>

        ${mistakesHtml}
      </div>
    `;
    container.innerHTML = html;

    const canvas = document.getElementById('confetti-canvas');
    if (canvas) audio.launchConfetti(canvas);

    const againBtn = document.getElementById('btn-again');
    if (againBtn) againBtn.onclick = startGameSession;

    const sheetBtn = document.getElementById('btn-download-sheet');
    if (sheetBtn) sheetBtn.onclick = downloadPracticeSheet;

    const diplomaBtn = document.getElementById('btn-finish-diploma');
    if (diplomaBtn) diplomaBtn.onclick = downloadReadingDiploma;

    const badgesBtn = document.getElementById('btn-badges');
    if (badgesBtn) {
      badgesBtn.onclick = () => {
        activeTab = 'achievements';
        renderAll();
      };
    }

    const shareBtn = document.getElementById('btn-share-result');
    if (shareBtn) {
      shareBtn.onclick = () => {
        audio.playClick();
        const todayStr = dailyDateParam || new Date().toISOString().slice(0, 10);
        const levelObj = catalog.levels.find(l => l.id === selectedLevel);
        const levelName = levelObj ? levelObj.name[lang] : selectedLevel;
        const modeObj = catalog.modes.find(m => m.id === selectedMode);
        const modeName = selectedMode === 'daily'
          ? `${t('daily_challenge_label')} (${todayStr})`
          : (modeObj ? modeObj.name[lang] : selectedMode);

        const shareUrl = `${window.location.origin}${window.location.pathname}?mode=${selectedMode}&level=${selectedLevel}${selectedMode === 'daily' ? '&date=' + todayStr : ''}`;
        const wpmLine = maxWpmSession > 0 ? ` | ⏱️ ${maxWpmSession} ${t('wpm_label')}` : '';
        const shareText = `Datalaria Reading · ${modeName}\n${levelName} | ⭐ ${score} pts (${correctCount}/${totalPlayed})${wpmLine}\n${emojiStrip}\n${shareUrl}`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareText)
            .then(() => showToast(t('share_result_copied')))
            .catch(() => showToast(t('share_result_copied')));
        } else {
          showToast(t('share_result_copied'));
        }
      };
    }

    container.querySelectorAll('.btn-mistake-audio').forEach(btn => {
      btn.onclick = () => {
        const idx = Number(btn.getAttribute('data-mistake-idx'));
        const item = mistakes[idx];
        if (item && item.challenge) {
          audio.speakText(item.challenge.prompt, lang, 0.5);
        }
      };
    });

    container.querySelectorAll('.btn-mistake-hint').forEach(btn => {
      btn.onclick = () => {
        const idx = btn.getAttribute('data-mistake-idx');
        const box = document.getElementById(`mistake-hint-${idx}`);
        if (box) box.classList.toggle('hidden');
      };
    });
  }

  function endGameSession() {
    clearInterval(timerInterval);
    clearTimeout(feedbackTimeout);
    inGame = false;
    inFeedbackPause = false;
    awaitingMicroCheck = false;
  }

          resetBtn.textContent = `⚠️ ${t('confirm_reset')}`;
          resetBtn.style.background = '#dc2626';
          if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
          resetConfirmTimer = setTimeout(() => {
            resetConfirmPending = false;
            resetBtn.textContent = t('clean_history');
            resetBtn.style.background = '';
          }, 4000);
        } else {
          clearTimeout(resetConfirmTimer);
          resetConfirmPending = false;
          userStats = createEmptyStats();
          saveStats();
          showToast(t('stats_reset_toast'));
          renderAchievementsTab();
        }
      };
    }
  }

      ctx.beginPath();
      ctx.moveTo(60, y + rowHeight);
      ctx.lineTo(1140, y + rowHeight);

      ctx.font = '700 18px system-ui, -apple-system, sans-serif';
      ctx.fillText(String(idx + 1), 80, y + 50);

      // Palabra
      const wordText = item.challenge ? (item.challenge.prompt || '') : '';
      ctx.fillStyle = '#0f172a';
      ctx.font = '800 22px system-ui, -apple-system, sans-serif';
      ctx.fillText(wordText.slice(0, 18), 125, y + 50);

      let sylStr = '';
      if (item.challenge && Array.isArray(item.challenge.syllables)) {
        sylStr = item.challenge.syllables.join(' · ');
      } else {
        const sylObj = engine.splitCustomSyllables(wordText, lang);
        sylStr = (sylObj.syllables || []).join(' · ');
      }
      ctx.fillStyle = '#0284c7';
      ctx.font = '700 18px monospace';
      ctx.fillText(sylStr.slice(0, 20), 420, y + 50);

      ctx.fillStyle = item.isCorrect ? '#16a34a' : '#dc2626';

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(800, y + 60);
      ctx.lineTo(1100, y + 60);
      ctx.stroke();

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(800, y + 40);
      ctx.lineTo(1100, y + 40);
      ctx.stroke();
      ctx.setLineDash([]);
    });

    // 4. Pie de página institucional
    ctx.textAlign = 'center';
    ctx.fillStyle = '#64748b';
    ctx.font = '600 14px system-ui, -apple-system, sans-serif';
    ctx.fillText('Datalaria Lector Arcade · Material de Apoyo a la Lectoescritura Infantil y Familiar · Sin publicidad · https://datalaria.com', 600, 1540);

    try {
      const dataUrl = canvas.toDataURL('image/png');

      a.download = `lamina_repaso_lector_arcade_${activeProfileId}_${new Date().toISOString().slice(0, 10)}.png`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => document.body.removeChild(a), 300);
    } catch {
      showToast(lang === 'es' ? 'Error al exportar lámina imprimible' : 'Failed to export practice sheet', 2500);
    }
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
