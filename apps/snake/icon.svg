<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filtro de Resplandor Neón -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradientes Neón -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="50%" stop-color="#0b1224" />
      <stop offset="100%" stop-color="#120820" />
    </linearGradient>

    <linearGradient id="snake-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <radialGradient id="golden-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo Cuadrado con Esquinas Redondeadas -->
  <rect width="512" height="512" rx="105" fill="url(#cyber-bg)" />

  <!-- Rejilla Cyberpunk sutil -->
  <g stroke="#00f0ff" stroke-opacity="0.12" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />
    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Borde Neón Cuadrante -->
  <rect x="24" y="24" width="464" height="464" rx="85" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="3" />

  <!-- Cuerpo de la Serpiente S-Curve -->
  <path d="M 120 380 C 120 280, 240 300, 256 220 C 270 140, 360 130, 380 200" 
        fill="none" 
        stroke="url(#snake-body)" 
        stroke-width="44" 
        stroke-linecap="round" 
        filter="url(#neon-glow)" />

  <!-- Cabeza de la Serpiente Cibernética -->
  <g transform="translate(380, 200) rotate(45)" filter="url(#neon-glow)">
    <polygon points="35,0 -25,-25 -10,0 -25,25" fill="#00f0ff" stroke="#ffffff" stroke-width="3" />
    <!-- Ojos Neón -->
    <circle cx="8" cy="-10" r="4" fill="#ffffff" />
    <circle cx="8" cy="10" r="4" fill="#ffffff" />
  </g>

  <!-- Segmentos de Luz en el Cuerpo -->
  <circle cx="120" cy="380" r="14" fill="#ff007a" filter="url(#neon-glow)" />
  <circle cx="160" cy="320" r="15" fill="#e01292" filter="url(#neon-glow)" />
  <circle cx="215" cy="270" r="16" fill="#a855f7" filter="url(#neon-glow)" />
  <circle cx="256" cy="220" r="17" fill="#38bdf8" filter="url(#neon-glow)" />
  <circle cx="295" cy="170" r="18" fill="#00f0ff" filter="url(#neon-glow)" />

  <!-- Nodo Cibernético Dorado de Alto Valor -->
  <circle cx="390" cy="340" r="28" fill="url(#golden-glow)" />
  <polygon points="390,318 398,333 414,335 402,347 405,363 390,355 375,363 378,347 366,335 382,333" 
           fill="#ffe600" stroke="#ffffff" stroke-width="2" filter="url(#neon-glow)" />

  <!-- Partículas Neón Dispersas -->
  <circle cx="330" cy="380" r="4" fill="#00f0ff" opacity="0.8" />
  <circle cx="430" cy="290" r="5" fill="#ffe600" opacity="0.8" />
  <circle cx="180" cy="150" r="4" fill="#ff007a" opacity="0.8" />
  <circle cx="140" cy="210" r="3" fill="#00ff66" opacity="0.8" />
</svg>
