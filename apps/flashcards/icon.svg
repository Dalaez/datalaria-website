<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8faff" />
    </linearGradient>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo Redondeado App -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />

  <!-- Carta Trasera Inclinada (Efecto Baraja 3D) -->
  <g transform="translate(256, 256) rotate(-14) translate(-256, -256)" filter="url(#shadow)">
    <rect x="116" y="116" width="280" height="340" rx="28" fill="url(#cardBack)" stroke="#34d399" stroke-width="4" />
    <circle cx="256" cy="286" r="48" fill="#ffffff" opacity="0.25" />
    <path d="M236 286 L250 300 L280 268" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Carta Frontal Principal -->
  <g transform="translate(256, 256) rotate(6) translate(-256, -256)" filter="url(#shadow)">
    <rect x="126" y="96" width="280" height="340" rx="28" fill="url(#cardFront)" stroke="#cbd5e1" stroke-width="4" />
    <!-- Líneas de Vocabulario y Fonética -->
    <rect x="166" y="156" width="200" height="24" rx="8" fill="#8b5cf6" />
    <rect x="186" y="196" width="160" height="14" rx="6" fill="#cbd5e1" />
    <rect x="166" y="246" width="200" height="8" rx="4" fill="#e2e8f0" />
    <rect x="166" y="266" width="180" height="8" rx="4" fill="#e2e8f0" />
    <rect x="166" y="286" width="140" height="8" rx="4" fill="#e2e8f0" />
    
    <!-- Icono de Sonido Fonético -->
    <circle cx="256" cy="356" r="28" fill="#eef2ff" />
    <path d="M246 348 L254 348 L262 342 L262 370 L254 364 L246 364 Z" fill="#8b5cf6" />
    <path d="M268 350 C272 353 272 359 268 362" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Destello Mágico IA (Estrella de 4 puntas) -->
  <g transform="translate(380, 100)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#fbbf24" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
  <g transform="translate(100, 390) scale(0.6)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#fbbf24" />
  </g>
</svg>
