product_hunt:
  - product_id: "pack-obs"
    app_slug: "obs-management"
    brand_vertical: "executive_b2b"
    embargo_until: "2026-12-09"
    status: "staged_embargoed"
    launch_url: "https://datalaria.com/apps/obs-management/?lang=en&scenario=ltb-crisis&utm_source=producthunt&utm_medium=launch&utm_campaign=pack_obs_dec2026"
    tagline: "IEC 62402 BOM obsolescence & Last Time Buy vs Redesign cockpit"
    description: "Free Zero-CDN interactive sandbox for supply chain & engineering leads facing component EOL/PDN crises. Traverse multilevel BOM trees, score IEC 62402 criticality, and run deterministic Last Time Buy (LTB) vs FFF Redesign CAPEX math in your browser."
    topics:
      - "Productivity"
      - "SaaS"
      - "Developer Tools"
      - "Analytics"
      - "Artificial Intelligence"
    maker_first_comment: |
      Hi Product Hunt! I built Agentic Radar v2.0 after seeing manufacturing and electronics teams lose weeks (and six-figure margins) scrambling through spreadsheets whenever a supplier drops a Product Discontinuation Notice (PDN).

      Two design choices behind v2.0:
      1. Deterministic math first: BOM graph explosion, WACC-adjusted Last Time Buy (LTB) vs. Form-Fit-Function (FFF) Redesign CAPEX, and bridge safety stock (SS_LTB) run in pure audited code — never LLM guesswork.
      2. Zero-friction Sandbox: Open the link, zero login, <45 KB Zero-CDN PWA, and simulate an EOL crisis in 15 seconds.

      For teams who want the full offline Excel 5-sheet engine (zero VBA), PostgreSQL RLS starter schema, and 5-page IEC 62402 PDF playbook, the companion B2B Decision Kit launches today at 19 € (Early-Bird). Would love your feedback on the LTB vs. Redesign trade-off math!
    visual_checklist:
      - "Thumbnail 240x240px: Agentic Radar dark cockpit icon"
      - "Slide 1 (1600x980px): Live BOM DAG tree + Margin-at-Risk KPI header"
      - "Slide 2 (1600x980px): Deterministic LTB vs. FFF Redesign financial comparator"
      - "Slide 3 (1600x980px): 5-Sheet Zero-VBA Excel Kit & PDF Playbook composite"
      - "Demo GIF (< 5 MB, 20s): Triggering a PDN notice to CAPEX recommendation"

  - product_id: "pack-sdd"
    app_slug: "helix"
    brand_vertical: "ai_systems"
    embargo_until: "2027-01-19"
    status: "staged_embargoed"
    launch_url: "https://datalaria.com/en/resources/#pack-sdd?utm_source=producthunt&utm_medium=launch&utm_campaign=helix_jan2027"
    tagline: "12-agent Spec-Driven Development squad with deterministic veto CLI"
    description: "Stop shipping fragile vibe-coded prototypes. Datalaria Helix is a Spec-Driven Development OS with 12 specialized AI agents, XS-XL triage, independent Security/QA veto gates, and a zero-dependency Python CLI for Antigravity, Claude Code, Cursor & Codex."
    topics:
      - "Developer Tools"
      - "Artificial Intelligence"
      - "Software Engineering"
      - "Open Source"
      - "Productivity"
    maker_first_comment: |
      Hi Product Hunt! Datalaria Helix was born from real production friction (Operation Crucible): when you ask a single AI agent to design, build, and verify complex software, it cuts corners and approves its own bugs.

      Helix enforces three engineering invariants:
      1. Spec-First + Separation of Powers (INV-HELIX-1): Builder agents cannot approve their own code. Independent Security and QA agents hold binding veto power.
      2. Deterministic XS–XL Triage: Only loads the 2–4 agent specs required per task (zero context bloat).
      3. Zero-dependency Python CLI: `init`, `triage`, `new-spec`, `checkpoint`, `verify`, and `rollback`, compiling adapters for Antigravity, Claude Code, Cursor, and Codex.

      We are launching with a free Starter Kit + 19 € Early-Bird Core Kit (List 39 €) and a 99 € Team License. Curious how other teams enforce QA gates on AI-written code!
    visual_checklist:
      - "Thumbnail 240x240px: Helix DNA dark-mode emblem"
      - "Slide 1 (1600x980px): 4-Cell 12-Agent architecture & Veto Gate flow"
      - "Slide 2 (1600x980px): Terminal capture of `helix triage` & `helix verify` (100/100)"
      - "Slide 3 (1600x980px): Interactive Web Sandbox & MarginGuard Case Study"
      - "Slide 4 (1600x980px): Multi-IDE compiled adapters (Antigravity, Claude, Cursor)"

hacker_news_show_hn:
  - product_id: "pack-obs"
    embargo_until: "2026-12-09"
    title: "Show HN: Zero-CDN IEC 62402 BOM Obsolescence & Last-Time-Buy Simulator"
    url: "https://datalaria.com/apps/obs-management/?lang=en&scenario=ltb-crisis&utm_source=hackernews&utm_medium=show_hn&utm_campaign=pack_obs_dec2026"
    first_comment_technical: |
      I built this client-side (<45 KB Zero-CDN) simulator to model hardware component End-of-Life (PDN/EOL) decisions under IEC 62402.
      The core problem: standard safety-stock ROP formulas break once a semiconductor hits EOL because replenishment is frozen — you have a one-shot Last Time Buy (LTB) vs. Form-Fit-Function (FFF) redesign CAPEX decision with inventory decay and WACC carrying cost.
      The BOM traversal engine runs cycle-safe DAG explosion in deterministic JS (mirrored in Python/PostgreSQL RLS in the companion blueprint). Happy to discuss the DAG cycle handling or LTB holding-cost math.

  - product_id: "pack-sdd"
    embargo_until: "2027-01-19"
    title: "Show HN: Datalaria Helix – 12-Agent Spec-Driven Dev OS with Binding QA Veto"
    url: "https://datalaria.com/en/posts/sdd_vs_vibe_coding/?utm_source=hackernews&utm_medium=show_hn&utm_campaign=helix_jan2027"
    first_comment_technical: |
      Over the last year I maintained 10 production apps and a bilingual portal with AI coding agents. Single-prompt "vibe coding" consistently degraded after ~15 files due to context bloat and self-approval bias.
      Datalaria Helix splits engineering into 12 strict Markdown+YAML agent specs (<=85 lines each, validated with Pydantic v2), loads only 2–4 roles via deterministic XS–XL triage, and separates builders from Security/QA veto roles. A zero-dependency Python CLI compiles the same specs into Antigravity, Claude Code, and Cursor adapters and runs spec verification + git checkpoint rollbacks. Feedback on the spec-scoring rubric is very welcome.

