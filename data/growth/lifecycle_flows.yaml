html_template_skeleton:
  max_width_px: 600
  background_hex: "#0b0f17"
  card_bg_hex: "#111827"
  text_hex: "#f8fafc"
  accent_hex: "#38bdf8"
  table_layout_snippet: |
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b0f17;font-family:Arial,Helvetica,sans-serif;color:#f8fafc;">
      <tr><td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#111827;border:1px solid #1f2937;border-radius:12px;">
          <tr><td style="padding:24px;">
            <p style="margin:0 0 12px;font-size:12px;color:#38bdf8;font-weight:700;letter-spacing:0.06em;">DATALARIA · DETERMINISTIC ENGINEERING</p>
            <h1 style="margin:0 0 14px;font-size:20px;line-height:1.3;color:#f8fafc;">{{ params.SUBJECT }}</h1>
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#162032;border-left:3px solid #38bdf8;border-radius:6px;margin:0 0 18px;">
              <tr><td style="padding:14px 16px;font-size:14px;line-height:1.55;color:#e2e8f0;">{{ params.VALUE_60S_HTML }}</td></tr>
            </table>
            <p style="margin:0 0 20px;"><a href="{{ params.CTA_URL }}" style="display:inline-block;background:#0ea5e9;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 20px;border-radius:8px;">{{ params.CTA_LABEL }}</a></p>
            <p style="margin:0;font-size:11px;color:#94a3b8;">Datalaria · Zero-spam technical dispatch · <a href="{{ unsubscribe }}" style="color:#38bdf8;">Unsubscribe</a></p>
          </td></tr>
        </table>
      </td></tr>
    </table>
