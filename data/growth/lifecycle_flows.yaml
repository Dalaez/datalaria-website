brevo_constraints:
  monthly_cost_eur: 0
  daily_send_cap: 300
  min_text_to_image_ratio_pct: 80
  max_hero_images_per_email: 1
  allow_mailto_links: false
  html_layout_standard: "clean_tabular_600px_outlook_gmail_safe"
  utm_base: "utm_source=brevo_auto&utm_medium=email"
  digest_collision_rule: "Pause automated step by 24h if E05 weekly digest is scheduled on the same day"
  lists:
    newsletter_es: 3
    newsletter_en: 4
    helix_waitlist_es: 5
    helix_waitlist_en: 6
    buyers_es: 7
    buyers_en: 8

cross_sell_coupon_spec:
  id: "OPP-MON-01"
  provider: "lemon_squeezy"
  name: "DATALARIA-UPGRADE20"
  code: "UPGRADE20"
  discount_type: "percentage"
  discount_value: 20
  eligible_products:
    - "suite-01"
    - "suite-02"
    - "suite-03"
    - "mega-bundle"
  excluded_embargoed_products:
    - "pack-obs"
    - "pack-sdd"
    - "suite-sdd"
  max_uses_per_buyer: 1
  validity_days: 14

flows:
  - id: "welcome_segmented"
    name_es: "Flujo 1 — Bienvenida Segmentada por Vertical"
    name_en: "Flow 1 — Vertical-Segmented Welcome Sequence"
    status: "ready_to_activate"
    trigger: "Contact added to List #3 (ES) or List #4 (EN)"
    segmentation:
      attribute: "VERTICAL_INTEREST"
      segments:
        - id: "executive_b2b"
          label: "Executive B2B (Operations, Supply Chain, PMO, Finance)"
          primary_sandbox_es: "https://datalaria.com/apps/obs-management/?lang=es&utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_b2b"
          primary_sandbox_en: "https://datalaria.com/apps/obs-management/?lang=en&utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_b2b"
          primary_offer_es: "https://datalaria.com/es/recursos/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_b2b#mega-bundle"
          primary_offer_en: "https://datalaria.com/en/resources/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_b2b#mega-bundle"
        - id: "ai_systems"
          label: "AI Systems (Engineering, Content Ops, SDD)"
          primary_sandbox_es: "https://datalaria.com/apps/pulse/?demo=true&utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_ai"
          primary_sandbox_en: "https://datalaria.com/apps/pulse/?demo=true&utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_ai"
          primary_offer_es: "https://datalaria.com/es/recursos/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_ai#pack-pulse"
          primary_offer_en: "https://datalaria.com/en/resources/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_ai#pack-pulse"
    emails:
      - step: 1
        delay_days: 0
        goal: "Deliver 60-second quantitative value and capture vertical preference"
        es:
          subject: "Bienvenido a Datalaria: 3 herramientas deterministas listas en 60 segundos"
          preheader: "Sin humo ni registro: abre nuestros Sandboxes y elige tu vertical."
          value_60s:
            - "1) Radar IEC 62402 (Supply Chain): simula un aviso EOL y calcula margen en riesgo en el navegador."
            - "2) Datalaria Pulse (Content Ops): audita un CSV de Notion 100% en cliente sin subir datos."
            - "3) 13 modelos cuantitativos Excel + PPTX sin macros VBA listos para comité de dirección."
          cta_label: "Explorar Sandboxes y Catálogo →"
          cta_url: "https://datalaria.com/es/recursos/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d0"
          secondary_cta_label: "Indícanos tu vertical (Operaciones B2B o Sistemas IA)"
          secondary_cta_url: "https://datalaria.com/es/contact/?topic=vertical-preference&utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d0"
        en:
          subject: "Welcome to Datalaria: 3 deterministic tools ready in 60 seconds"
          preheader: "Zero hype, zero login: launch our Sandboxes and pick your track."
          value_60s:
            - "1) Agentic Radar (IEC 62402 Supply Chain): simulate an EOL notice and compute margin at risk in-browser."
            - "2) Datalaria Pulse (Content Ops): audit a Notion CSV 100% client-side with zero uploads."
            - "3) 13 zero-VBA Excel + 16:9 PPTX quantitative decision packs ready for board reviews."
          cta_label: "Explore Sandboxes & Decision Kits →"
          cta_url: "https://datalaria.com/en/resources/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d0"
          secondary_cta_label: "Tell us your track (Executive B2B or AI Systems)"
          secondary_cta_url: "https://datalaria.com/en/contact/?topic=vertical-preference&utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d0"
      - step: 2
        delay_days: 2
        goal: "Drive hands-on interaction with free Dual-Mode Sandbox by vertical"
        es:
          subject: "Prueba en vivo: separa cálculo determinista de opinión en 2 minutos"
          preheader: "Executive B2B (BOM/LTB) o AI Systems (Pulse Content Ops) directo en tu navegador."
          value_60s:
            - "Vertical Executive B2B: abre Agentic Radar v2.0 y ejecuta el escenario de crisis LTB vs. Rediseño."
            - "Vertical AI Systems: abre Datalaria Pulse en Modo Demo y revisa el scoring SEO determinista 0–100."
            - "Por qué lo hacemos así: la aritmética financiera siempre vive en código verificable, nunca en prompts."
          cta_label: "Abrir Sandbox Interactivo Gratis →"
          cta_url: "https://datalaria.com/es/apps/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d2"
        en:
          subject: "Hands-on test: separate deterministic math from guesswork in 2 minutes"
          preheader: "Executive B2B (BOM/LTB) or AI Systems (Pulse Content Ops) right in your browser."
          value_60s:
            - "Executive B2B Track: launch Agentic Radar v2.0 and run the LTB vs. FFF Redesign crisis scenario."
            - "AI Systems Track: open Datalaria Pulse in Demo Mode and inspect the 0–100 deterministic SEO scorer."
            - "Core principle: financial arithmetic always runs in audited code, never in probabilistic prompts."
          cta_label: "Launch Free Interactive Sandbox →"
          cta_url: "https://datalaria.com/en/apps/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d2"
      - step: 3
        delay_days: 5
        goal: "Showcase flagship suites and real savings comparison"
        es:
          subject: "De horas en hojas frágiles a 1 slide defendible ante el CFO"
          preheader: "Cómo funcionan nuestras Suites Ejecutivas sin macros VBA (ahorro hasta 52%)."
          value_60s:
            - "Suite 1 (Estrategia MBA · 19 €): DAFO, Porter, PESTEL, BCG y McKinsey/GE con fórmulas auditadas."
            - "Suite 2 (Decisiones · 15 €): Matriz DAR con veto binario, RICE/ICE y Business Case VAN/TIR."
            - "Suite 3 (Operaciones · 22 €) y Datalaria Pulse Kit (19 €): listos para Excel, Sheets y PowerPoint 16:9."
          cta_label: "Comparar Kits y Suites (Ahorro >52%) →"
          cta_url: "https://datalaria.com/es/recursos/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d5#pricing-comparison"
        en:
          subject: "From fragile spreadsheets to 1 CFO-ready decision slide"
          preheader: "Inside our zero-VBA Executive Suites (save over 52% with bundles)."
          value_60s:
            - "Suite 1 (MBA Strategy · 19 €): SWOT, Porter, PESTEL, BCG & McKinsey/GE with audited formulas."
            - "Suite 2 (Decisions · 15 €): Binary-veto DAR Matrix, RICE/ICE & NPV/IRR Business Case."
            - "Suite 3 (Operations · 22 €) & Datalaria Pulse Kit (19 €): ready for Excel, Google Sheets & 16:9 PPTX."
          cta_label: "Compare Kits & Suites (Save >52%) →"
          cta_url: "https://datalaria.com/en/resources/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d5#pricing-comparison"
      - step: 4
        delay_days: 9
        goal: "Bridge to Mega Bundle (39 €) and B2B Team/Corporate Licenses (99–149 €)"
        es:
          subject: "El arsenal completo (39 €) y licencias para equipos B2B (99 €)"
          preheader: "13 modelos estratégicos y operativos con factura IVA/VIES inmediata."
          value_60s:
            - "Uso individual: Mega Bundle con los 13 kits por 39 € (frente a 82 € por separado)."
            - "Equipos y PMOs (5–20 personas): Licencia Equipo (99 €) y Corporativa (149 €) con 12 meses de updates."
            - "Todo con descarga .ZIP inmediata vía Lemon Squeezy y cero macros VBA para pasar auditorías IT."
          cta_label: "Ver Mega Bundle y Licencias Equipo →"
          cta_url: "https://datalaria.com/es/recursos/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d9#b2b-team-license"
        en:
          subject: "The complete 13-pack arsenal (39 €) and B2B Team Licenses (99 €)"
          preheader: "Instant VAT/VIES invoicing and zero-VBA compliance for operations & engineering teams."
          value_60s:
            - "Individual license: Total Mega Bundle with all 13 packs for 39 € (vs. 82 € separately)."
            - "Teams & PMOs (5–20 seats): Team License (99 €) and Corporate License (149 €) with 12-month updates."
            - "Instant .ZIP delivery via Lemon Squeezy and zero VBA macros to clear corporate IT security."
          cta_label: "View Mega Bundle & Team Licenses →"
          cta_url: "https://datalaria.com/en/resources/?utm_source=brevo_auto&utm_medium=email&utm_campaign=welcome_d9#b2b-team-license"

