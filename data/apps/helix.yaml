title:
  es: "Datalaria Helix"
  en: "Datalaria Helix"

tagline:
  es: "Spec-Driven Development OS — La spec es el ADN de tu app; los agentes solo la expresan."
  en: "Spec-Driven Development OS — The spec is your app's DNA; AI agents merely express it."

summary:
  es: "Sistema operativo de ingeniería para gobernar el desarrollo de software asistido por IA mediante Spec-Driven Development (SDD). Elimina la degradación de contexto y el colapso arquitectónico (Vibe Debt) coordinando un escuadrón de 12 agentes especializados con triaje determinista XS-XL, sistema de diseño por tokens, evaluación matemática formal SpecQualityScore (0..100), verificación independiente con derecho a veto en Seguridad y QA, y CLI multiplataforma en Python puro para crear checkpoints y ejecutar rollback en un comando."
  en: "Engineering operating system designed to govern AI-assisted software development through Spec-Driven Development (SDD). Eradicates context drift and architectural collapse (Vibe Debt) by coordinating a specialized 12-agent squad with deterministic XS-XL triage, token-driven design systems, formal mathematical SpecQualityScore auditing (0..100), independent verification with binding veto power in Security and QA, and a pure Python cross-platform CLI for instantaneous git checkpoints and 1-command rollback."

objectives:
  - es: "Garantizar la Primacía de la Especificación (Spec-First Invariant): cero código de producción sin contrato tipado ni verificación previa."
    en: "Enforce the Spec-First Invariant: zero production code written without approved typed contracts and predefined verification gates."
  - es: "Reducir el gasto de contexto LLM en un ~87% mediante triaje determinista y carga bajo demanda de roles (INV-HELIX-2)."
    en: "Reduce LLM context spend by ~87% through deterministic triage and on-demand role loading (INV-HELIX-2)."
  - es: "Blindar la calidad mediante veto vinculante e independiente de Seguridad y QA Verifier (INV-HELIX-1)."
    en: "Enforce quality assurance via independent binding veto power in Security and QA Verifier roles (INV-HELIX-1)."
  - es: "Ofrecer arquitectura Dual-Mode: Sandbox gratuito en navegador (Modo A+B) y Kits descargables Starter y Core en Lemon Squeezy."
    en: "Provide a robust Dual-Mode architecture: free client-side browser Sandbox (Modes A+B) and commercial Starter and Core Kits on Lemon Squeezy."

features:
  - icon: "🎯"
    es: "Escuadrón Canónico de 12 Agentes: 4 células especializadas (Dirección, Construcción, Garantía con Veto y Entrega) agnósticas de modelo."
    en: "Canonical 12-Agent Squad: 4 specialized cells (Direction, Construction, Veto Assurance, and Delivery) fully model-agnostic."
  - icon: "⚡"
    es: "Triaje Determinista XS–XL: algoritmo estricto que dimensiona tareas y convoca solo 2-4 agentes por turno protegiendo el contexto."
    en: "Deterministic XS–XL Triage: strict algorithm sizing tasks and activating only 2-4 agents per session to preserve context."
  - icon: "📐"
    es: "SpecQualityScore (0..100): auditoría matemática en 5 pilares de 20 puntos (Problema, Non-Goals, Contratos, Invariantes y Gates)."
    en: "SpecQualityScore (0..100): 5-pillar mathematical auditing of Problem, Non-Goals, Contracts, Invariants, and Gates."
  - icon: "🛡️"
    es: "Separación de Poderes y Veto Vinculante: Seguridad y QA operan de forma independiente; nadie valida su propio trabajo."
    en: "Separation of Powers and Binding Veto: Security and QA act independently; no builder role ever approves its own work."
  - icon: "🔄"
    es: "CLI helix.py en Python Puro: subcomandos init, triage, new-spec, checkpoint, verify y rollback sin dependencias externas."
    en: "Zero-Dependency CLI helix.py: subcommands for init, triage, new-spec, checkpoint, verify, and rollback in standard Python."
  - icon: "🚀"
    es: "3 Blueprints y 2 Casos Reales: arquitecturas llave en mano para calculadoras estáticas, SaaS Supabase y motores cuantitativos."
    en: "3 Blueprints and 2 Real-World Case Studies: turnkey reference setups for static tools, Supabase SaaS, and quant engines."

design:
  architecture:
    es: "Arquitectura agnóstica de múltiples capas: las 12 fichas canónicas en Markdown estructurado (specs/squad/) son la Fuente Única de Verdad. El compilador Python ops/helix/build_adapters.py genera adaptadores sincronizados para Google Antigravity (.agents/), Claude Code (.claude/ + CLAUDE.md) y Cursor (.cursor/). La SPA web React 19 + TypeScript ejecuta el Spec Builder determinista en el cliente con empaquetado ZIP en TypeScript puro sin enviar datos a servidores."
    en: "Multi-layered tool-agnostic architecture: 12 canonical Markdown specifications (specs/squad/) form the Single Source of Truth. The Python adapter compiler ops/helix/build_adapters.py deterministically generates adapters for Google Antigravity (.agents/), Claude Code (.claude/ + CLAUDE.md), and Cursor (.cursor/). The React 19 + TypeScript SPA executes client-side deterministic spec generation with pure TypeScript ZIP bundling without transmitting user data."
  principles:
    - es: "Spec-First & Agnosticismo: la especificación gobierna el código y opera de forma idéntica con Gemini, Claude o Codex."
      en: "Spec-First and Agnosticism: the specification governs implementation across Gemini, Claude, or Codex models identically."
    - es: "Separación Construcción vs Verificación: ningún agente constructor puede validar sus propios entregables (INV-HELIX-1)."
      en: "Separation of Construction and Verification: no builder role may approve its own deliverables (INV-HELIX-1)."
    - es: "Capacidad de Rollback Inmediata: todo cambio cuenta con checkpoint Git y vuelta atrás automática al segundo fallo (INV-HELIX-7)."
      en: "Instant Rollback Guarantee: every task is tagged before coding and rolls back cleanly on two consecutive gate failures (INV-HELIX-7)."
  diagram: |
    flowchart LR
      SPEC["12 Canonical Specs\n(specs/squad/*.md)"] --> COMP["Adapter Compiler\n(build_adapters.py)"]
      COMP --> AGY[".agents/squad/\n(Antigravity)"]
      COMP --> CLD[".claude/agents/\n(Claude Code)"]
      COMP --> CUR[".cursor/rules/\n(Cursor IDE)"]
      SPEC --> CLI["CLI helix.py\n(Python Stdlib)"]
      SPEC --> WEB["Helix Spec Builder\n(React 19 / Vite)"]

tech:
  - layer: frontend
    items: ["React 19", "TypeScript", "Vite 8", "HTML5 Canvas", "Lucide Icons"]
  - layer: backend
    items: ["Python 3.13 Stdlib", "Pydantic v2", "PyMuPDF (fitz)", "Pillow", "PyYAML"]
  - layer: multi_agent
    items: ["Google Antigravity", "Claude Code", "Cursor Rules", "OpenAI Codex"]
  - layer: infra
    items: ["Hugo Static Portal", "Git Pre-Commit Hooks", "GitHub Actions CI/CD"]

