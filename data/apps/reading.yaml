title:
  es: "Lector Arcade (Aprendizaje de Lectura)"
  en: "Reader Arcade (Playful Reading & Literacy)"

tagline:
  es: "Entrenamiento lúdico de fluidez lectora, sílabas y phonics con cronómetro split, audio nativo y perfiles familiares."
  en: "Gamified reading fluency, syllables, and phonics arcade with split stopwatch, native audio, and family profiles."

summary:
  es: "Aplicación interactiva y lúdica diseñada para la enseñanza y práctica de la lectura progresiva en niños (4 a 11 años) y personas adultas en aprendizaje de segundas lenguas. Siguiendo la arquitectura y ergonomía de Ábaco Arcade (apps/maths/), Lector Arcade ofrece 6 niveles adaptativos (desde conciencia fonológica y silabario hasta mini-relatos de 3 líneas con micro-checks de comprensión), 4 modos de juego (Normal, Contrarreloj split con cálculo PPM/WPM universal en l1-l6, Sprint 60s y Reto Diario con PRNG determinista), sintetizador nativo de voz Web Speech API con audio dual 1.0x y tortuga 0.5x con karaoke silábico, efectos 8-bit procedurales con Web Audio API, librería vectorial SVG nativa (ReadingIllustrations), modo '✏️ Mis Palabras' con deep-links (?words=...), 3 estrellas de dominio por nivel, 3 perfiles familiares locales aislados, generador de Diploma Arcade PNG editable (1200x800) y generador de Lámina de Repaso Imprimible A4 PNG (1200x1600), operando 100% offline y sin librerías externas."
  en: "Interactive reading arcade designed for progressive literacy and reading fluency training in children (ages 4 to 11) and second-language adult learners. Inheriting the architecture and ergonomic foundations of Abacus Arcade (apps/maths/), Reader Arcade delivers 6 adaptive levels (from phonological awareness and syllable matrices to 3-line short stories with comprehension micro-checks), 4 game modes (Relaxed Normal, Split Stopwatch with universal WPM calculation in l1-l6, 60s Sprint, and Deterministic Daily Challenge with PRNG), native Web Speech API voice synthesis with dual 1.0x and 0.5x turtle audio with syllable karaoke, procedural 8-bit Web Audio sound effects, native SVG vector library (ReadingIllustrations), '✏️ My Words' mode with deep-links (?words=...), 3 mastery stars per level, 3 isolated family profiles, editable Arcade PNG Diploma generator (1200x800), and printable A4 PNG Practice Sheet generator (1200x1600), operating 100% offline with zero external libraries."

objectives:
  - es: "Crear un entorno arcade lúdico, táctil y motivador para el aprendizaje lector infantil sin estrés ni frustración."
    en: "Create an engaging, tactile, and motivating arcade environment for early literacy practice free of stress and penalty."
  - es: "Desarrollar la conciencia fonológica y la fluidez lectora progresiva en español (silabario directo/inverso/trabado) e inglés (phonics, blends y digraphs)."
    en: "Develop phonological awareness and reading fluency in Spanish (syllabic progression) and English (phonics, blends, and digraphs)."
  - es: "Medir la velocidad lectora objetiva (PPM / WPM) y la fluidez efectiva mediante cronómetro split de parada voluntaria con micro-check de comprensión inmediata."
    en: "Measure reading velocity objectively (WPM) and effective fluency via split stopwatch with instant freeze upon self-paced completion followed by comprehension checks."
  - es: "Garantizar privacidad total infantil y resiliencia offline 100% client-side (PWA) sin micrófonos remotos ni dependencias externas."
    en: "Guarantee strict child privacy and 100% client-side offline resilience (PWA) with zero cloud microphones or external CDNs."

features:
  - icon: "🌱"
    es: "6 Niveles Adaptativos: desde letras iniciales y silabario básico hasta palabras complejas, frases de 2 líneas y mini-relatos de 3 líneas."
    en: "6 Adaptive Levels: ranging from letter sounds and basic syllables to complex words, 2-line sentences, and 3-line short stories."
  - icon: "⏱️"
    es: "Contrarreloj Split con Cálculo Universal PPM/WPM: cronómetro de alta precisión que se congela al pulsar '¡Leído!' y evalúa la fluidez con micro-check de comprensión en todos los niveles (l1–l6)."
    en: "Split Stopwatch with Universal WPM Calculation: high-precision timer freezing upon 'Read Done!' and validating comprehension via 1-tap checks across all levels (l1–l6)."
  - icon: "🔊"
    es: "Audio Dual 1.0x y Tortuga 0.5x con Karaoke Silábico: escucha a velocidad normal o pausada con iluminación reactiva de sílabas al ritmo de la locución."
    en: "Dual Audio 1.0x & 0.5x Turtle with Syllable Karaoke: listen at normal or deliberate pace with reactive syllable highlighting synchronized with voice."
  - icon: "🎨"
    es: "Librería Vectorial SVG Inline (ReadingIllustrations): 15 ilustraciones a todo color (Mesa, Nido, Nudo, Iglú, Foca, Ñandú, etc.) garantizando cero glifos rotos en cualquier dispositivo."
    en: "Inline SVG Vector Library (ReadingIllustrations): 15 full-color illustrations (Mesa, Nido, Nudo, Iglú, Foca, Ñandú, etc.) guaranteeing zero broken glyphs on any device."
  - icon: "✏️"
    es: "Modo 'Mis Palabras' con Deep-Links (?words=...): crea retos personalizados para practicar el vocabulario escolar semanal y compártelos fácilmente con familias y alumnos."
    en: "'My Words' Mode with Deep-Links (?words=...): create customized challenges to practice weekly school vocabulary and share them easily with families and students."
  - icon: "⭐"
    es: "Estrellas de Dominio (⭐⭐⭐): progresión visible en el selector de niveles según la puntuación obtenida, fomentando la maestría progresiva sin frustración."
    en: "Mastery Stars (⭐⭐⭐): visible progression on level cards based on scores achieved, promoting mastery and motivation without penalty."
  - icon: "💡"
    es: "Laboratorio Fonético & Mesa de Mezclas: módulo 'Aprender' con exploración silábica bilingüe, selector AA/Aa y sintetizador de voz normal (1.0x) y tortuga (0.5x)."
    en: "Phonics Lab & Syllable Mixer: 'Learn' section featuring bilingual phonetic grids, AA/Aa case toggle, and normal (1.0x) / turtle (0.5x) voice synthesis."
  - icon: "⌨️"
    es: "Teclado Táctil 3D Integrado: teclado alfabético en pantalla con botones de 52px adaptados a pantallas táctiles de tablets y móviles."
    en: "Integrated 3D Tactile Keypad: on-screen alphabetic keypad with 52px touch-friendly buttons preventing keyboard layout shift."
  - icon: "🎮"
    es: "4 Modos de Juego y Medallas: Modo Normal, Contrarreloj Lector, Sprint 60s y Reto Diario determinista con 6 medallas coleccionables."
    en: "4 Game Modes & Badges: Normal Mode, Reading Stopwatch, 60s Sprint, and Deterministic Daily Challenge with 6 unlockable badges."
  - icon: "🖨️"
    es: "Lámina de Repaso A4 y Diploma PNG: generador de lámina imprimible A4 PNG (1200x1600) para repaso analógico en papel y diploma de honor con nombre personalizado (1200x800)."
    en: "A4 Practice Sheet & PNG Diploma: printable A4 PNG sheet generator (1200x1600) for paper review and personalized honors diploma (1200x800)."
  - icon: "📲"
    es: "PWA 100% Offline e Instalable: Service Worker con precaché resiliente, botón de instalación en pantalla de inicio y cero dependencias CDN."
    en: "100% Offline Installable PWA: Service Worker with resilient precache, home screen install prompt, and zero CDN dependencies."
  - icon: "📅"
    es: "Reto Diario Wordle & Repaso Didáctico: reto diario determinista por fecha con tira visual para compartir y repaso guiado de fallos con audio tortuga a 0.5x."
    en: "Wordle-Style Daily Challenge & Mistake Review: date-seeded daily challenge with share card and pedagogical review module with 0.5x turtle audio."

design:
  architecture:
    es: "Arquitectura SPA estática y autónoma bajo Single-Source-of-Truth en /apps/reading/: el catálogo curricular bilingüe expone el banco léxico curado y las reglas fonéticas en memoria cliente. El motor procedimental determinista ReadingEngine valida las respuestas y calcula la fluidez lectora en PPM y PPM Efectivas. El empaquetador build.py compila un bundle monolítico en static/apps/reading/index.html sin dependencias de red externas."
    en: "Self-contained Single-Source-of-Truth client-side SPA in /apps/reading/: curated bilingual phonetic catalogs and lexical databases loaded in browser memory. The deterministic ReadingEngine validates answers and calculates reading speed (WPM) and Effective WPM. The build.py packager compiles an inlined monolithic bundle in static/apps/reading/index.html with zero external network dependencies."
  principles:
    - es: "Pedagogía y Estética Lúdica (Consumer Playful): botones arcade 3D, pistas visuales amigables, resaltado silábico cromático y diseño sin penalizaciones punitivas."
      en: "Playful Pedagogy & Aesthetics (Consumer Playful): 3D arcade buttons, friendly visual hints, chromatic syllable highlighting, and positive reinforcement."
    - es: "Cero Dependencias de Red Externas: 100% CSS nativo sin frameworks CDN y tipografía del sistema optimizada para legibilidad infantil."
      en: "Zero External Network Dependencies: 100% native CSS eliminating CDN bloat with system typography optimized for early reader ergonomics."
    - es: "Ergonomía Táctil y Multidispositivo: Teclado táctil en pantalla de gran tamaño (>= 52px) y soporte para atajos de teclado físicos (A-Z, Espacio, Enter, T, M, H)."
      en: "Tactile & Multi-Device Ergonomics: Large on-screen keypad (>= 52px) paired with full desktop physical keyboard shortcuts (A-Z, Space, Enter, T, M, H)."
  diagram: |
    flowchart TD
      START["Selección de Nivel (1-6) & Modo (Normal / Contrarreloj / Sprint / Diario)"] --> STAGE["Escenario Lector (reading-stage)"]
      STAGE --> HINT{"¿Necesita Pista?"}
      HINT -- "Sí" --> VISUAL["Pista Fonética / Audio Tortuga 0.5x / Karaoke Silábico"]
      HINT -- "No" --> ACTION["Lectura o Entrada por Teclado 3D"]
      ACTION --> DONE["Congelación de Cronómetro Split ('¡Leído!')"]
      DONE --> CHECK{"Micro-Check de Comprensión"}
      CHECK -- "Acierto" --> COMBO["+Puntos & PPM & PPM Efectivas & Combo Racha & Web Audio 8-bit"]
      CHECK -- "Fallo" --> CORR["Feedback Didáctico & Registro para Repaso"]
      COMBO --> NEXT["Siguiente Reto"]
      CORR --> NEXT
      NEXT --> STATS["Resumen de Sesión & Estrellas & Lámina A4 & Diploma PNG"]

tech:
  - layer: frontend
    items: ["HTML5 Nativo", "CSS3 Design Tokens (Daylight Arcade & Cosmic Night)", "Vanilla JavaScript Moderno", "Service Worker PWA Offline"]
  - layer: audio_canvas
