  - layer: pedagogy
    items: ["Currículo Fonético Bilingüe (Silabario ES / Phonics EN)", "Micro-Checks de Comprensión en 1 Toque", "Cálculo Universal de PPM / WPM (l1-l6) y PPM Efectivas", "Modo Mis Palabras (?words=...)", "Estrellas de Dominio (⭐⭐⭐)", "Mesa de Mezclas Silábica"]
  - layer: methodology
    items: ["Spec-Driven Development (SDD)", "Datalaria Helix (12 Agentes)", "Test-Driven Development (pytest + Node.js)"]
  - layer: hosting
    items: ["Hugo Static Engine (/apps/reading/)"]

