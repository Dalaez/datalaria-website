releases:
  - version: v2.1.0
    date: "2026-11-06"
    state: released
    type: release
    title:
      es: "Flashcards v2.1.0: PWA Offline Completa, Suite de Iconos Maskable, Instalación Universal y Actualización In-App"
      en: "Flashcards v2.1.0: Full Offline PWA, Maskable Icon Suite, Universal Install and In-App Update"
    changes:
      - es: "Suite completa de 6 iconos PNG y SVG con soporte nativo de capa maskable (192px y 512px) y apple-touch-icon para Android e iOS."
        en: "Full suite of 6 PNG and SVG icons with native maskable support (192px & 512px) and apple-touch-icon for Android & iOS."
      - es: "Actualización de Service Worker v2.1.0 con soporte skipWaiting, precaché integral de iconos y recarga instantánea via controllerchange."
        en: "Service Worker v2.1.0 update with skipWaiting support, full icon precaching, and instant reload via controllerchange."
      - es: "Botón de instalación PWA universal en barra superior con detección inteligente de standalone y guía en toast para Safari en iOS."
        en: "Universal PWA install button in header with smart standalone detection and toast guidance for iOS Safari."
      - es: "Badge interactivo #btn-check-update (v2.1.0) para comprobación manual de versión y banner flotante #pwa-update-banner."
        en: "Interactive #btn-check-update (v2.1.0) badge for manual version checks and #pwa-update-banner floating action."
      - es: "Empaquetado Single-File Inline: inyección directa de CSS y módulos JS en index.html, eliminando peticiones sueltas y asegurando carga offline instantánea."
        en: "Single-File Inline bundling: direct injection of CSS and JS modules into index.html, removing loose requests and guaranteeing instant offline startup."
      - es: "Sistema flotante de notificaciones Toasts (#toast-container) para feedback lúdico, logros y estados de la app."
        en: "Floating Toasts notification system (#toast-container) for playful feedback, achievements, and app status."

