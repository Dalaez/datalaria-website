title:
  es: "Flashcards AI"
  en: "Flashcards AI"

tagline:
  es: "Mazo mágico interactivo de estudio activo con giro 3D, pronunciación fonética por voz (1x y 0.75x), 3 modos de juego y generación masiva con IA."
  en: "Magic active recall study deck with 3D flips, speech phonetics (1x & 0.75x slow mode), 3 study modes, and batch AI card generation."

summary:
  es: "Aplicación de estudio activo (Active Recall) y memorización bilingüe diseñada para niños (ciencias escolares, espacio, capitales) y adultos (Business English, conceptos de IA, finanzas). Incorpora giro tridimensional de tarjetas con CSS 3D, pronunciación por voz nativa con Web Speech API en velocidad normal y lenta (modo tortuga), 3 modos de estudio (Giro Leitner, Quiz Arcade 4 opciones y Modo Escritura con pistas), importación/exportación CSV RFC-4180 y autogeneración mágica en lote con Google Gemini API."
  en: "Active Recall and bilingual memorization web app tailored for kids (school science, space, world geography) and adults (Business English, AI concepts, MBA strategy). Features 3D card-flip animations, native speech pronunciation via Web Speech API with regular and slow turtle modes, 3 study modes (Leitner 3D Flip, 4-Option Quiz Arcade, and Spelling Mode with progressive hint reveals), RFC-4180 CSV import/export, and batch AI magic generation with Google Gemini API."

objectives:
  - es: "Facilitar el estudio bilingüe multigeneracional (niños y adultos) eliminando la monotonía de los métodos tradicionales y la frialdad de pantallas vacías."
    en: "Empower multigenerational bilingual study (kids and adults) eliminating monotonous manual rote methods and cold empty screens."
  - es: "Proporcionar pronunciación fonética por voz nativa (Web Speech API) con selector de velocidad dual (1.0x y modo tortuga 0.75x)."
    en: "Deliver native phonetic speech pronunciation (Web Speech API) with dual speed modes (1.0x and 0.75x turtle slow mode)."
  - es: "Ofrecer 3 modos de estudio interactivos: Giro Clásico con Cajas Leitner, Quiz Arcade con distractores y Modo Ortográfico con pistas."
    en: "Offer 3 interactive study modes: Classic 3D Leitner Flip, Quiz Arcade with dynamic distractors, and Spelling Mode with progressive hints."
  - es: "Integrar generación estructurada en lote con la API de Google Gemini (gemini-2.5-flash / gemini-2.0-flash BYOK) en formato JSON."
    en: "Integrate batch structured card generation using Google Gemini API (gemini-2.5-flash / gemini-2.0-flash BYOK) in pure JSON."
  - es: "Garantizar privacidad 100% en cliente, persistencia de progreso y medallas en LocalStorage, y funcionamiento offline como PWA instalable."
    en: "Ensure 100% client-side privacy, progress and medals persistence in LocalStorage, and full offline PWA installability."

features:
  - icon: "🗣️"
    es: "Pronunciación Fonética Dual (1.0x y Tortuga 0.75x): síntesis de voz en el navegador con Web Speech API para escuchar la pronunciación exacta sílaba a sílaba."
    en: "Dual Phonetic Speech (1.0x & 0.75x Turtle): native in-browser voice synthesis via Web Speech API to master accurate pronunciation syllable by syllable."
  - icon: "🎒"
    es: "6 Mazos Curados en 1 Clic: barajas listas para niños (Ciencias Bilingües, Espacio, Capitales) y adultos (Business English, Conceptos IA, Estrategia MBA)."
    en: "6 Curated Decks in 1 Click: pre-loaded study decks for kids (Bilingual Science, Space, Capitals) and adults (Business English, AI Concepts, MBA Strategy)."
  - icon: "🎯"
    es: "3 Modos de Estudio Adaptativos: Giro Clásico 3D con Cajas Leitner, Quiz Arcade de 4 opciones y Reto de Escritura con revelación de pistas."
    en: "3 Adaptive Study Modes: Classic 3D Leitner Flip, 4-Option Quiz Arcade, and Spelling Mode with progressive letter hints."
  - icon: "⚡"
    es: "Generación en Lote con Gemini: autocompleta decenas de términos, definiciones, fonética y pistas mnemotécnicas en una sola llamada JSON."
    en: "Batch AI Generation with Gemini: autocompletes dozens of terms, definitions, phonetics, and mnemonic hints in a single JSON payload."
  - icon: "📂"
    es: "Importación y Exportación CSV RFC-4180: procesa y descarga listas tabulares compatibles con Excel, soportando comas y comillas."
    en: "RFC-4180 CSV Import & Export: process and backup tabular study decks compatible with Excel, safely handling commas and quotes."
  - icon: "📲"
    es: "PWA 100% Offline e Instalable: cero CDNs externos, diseño adaptativo Sunny Studio / Starlight Deck anti-FOUC y medallas de logros."
    en: "100% Offline Installable PWA: zero external CDNs, adaptive Sunny Studio / Starlight Deck design with anti-FOUC, and achievement medals."

design:
  architecture:
    es: "Arquitectura cliente estricta Single-Source-of-Truth: toda la lógica de estudio, parser CSV y síntesis de audio se ejecuta de forma determinista en el navegador. La clave API de Gemini del usuario reside exclusivamente en su LocalStorage y se comunica de forma directa y segura con los endpoints de Google AI Studio sin intermediarios."
    en: "Strict client-side Single-Source-of-Truth architecture: study logic, CSV parsing, and speech audio run deterministically inside the browser. The user's Gemini API key stays strictly in LocalStorage and communicates directly and securely with Google AI Studio endpoints with zero intermediate servers."
  principles:
    - es: "Privacidad y Soberanía Local: los mazos y claves API residen exclusivamente en el navegador del usuario sin analítica invasiva ni trackers de terceros."
      en: "Privacy & Local Sovereignty: study decks and user keys reside strictly in the local browser with zero invasive trackers or third-party ad networks."
    - es: "Inclusión y Motivación Lúdica: colores amigables, relieve 3D táctil, confeti nativo y refuerzo sonoro para entusiasmar a niños y adultos sin formalismos rígidos."
      en: "Inclusion & Playful Motivation: warm colors, 3D tactile buttons, native canvas confetti, and positive audio reinforcement for both kids and adults."
    - es: "Cero Dependencias de Red: eliminación total de librerías externas o CDNs, garantizando funcionamiento instantáneo y 100% offline."
      en: "Zero Network Dependencies: complete removal of third-party CDNs, ensuring instant loading and reliable offline execution."
  diagram: |
    flowchart TD
      USER["Estudiante (Niño / Adulto)"] --> UI["Interfaz Flashcards 3D (Sunny / Starlight)"]
      UI -->|"Modo Manual / CSV"| PARSER["Parser/Exportador CSV RFC-4180"]
      UI -->|"Modo IA (Gemini Batch)"| GEMINI["Google Gemini API (gemini-2.5-flash / 2.0-flash)"]
      PARSER --> DECK["Gestor de Mazos (6 Curados + Personalizados)"]
      GEMINI --> DECK
      DECK -->|"Persistencia Local"| LS[("Navegador LocalStorage")]
      DECK --> TTS["Web Speech API (Voz 1.0x & Tortuga 0.75x)"]
      DECK --> MODES{"3 Modos de Juego"}
      MODES -->|"1"| M1["Giro 3D & Cajas Leitner"]
      MODES -->|"2"| M2["Quiz Arcade (4 Opciones)"]
      MODES -->|"3"| M3["Escritura & Pistas"]
      M1 --> UI
      M2 --> UI
      M3 --> UI

tech:
  - layer: frontend
    items: ["Vanilla JS (ES Modules)", "HTML5 Semantic", "CSS 3D Transforms", "CSS Design Tokens"]
  - layer: pwa
    items: ["Web App Manifest (PWA)", "Service Worker (Cache-First / Stale-While-Revalidate)", "SVG Vector Icon"]
  - layer: apis
    items: ["Web Speech Synthesis API (TTS)", "Web Audio API (Sintetizador 8-bit)", "Web Storage API (LocalStorage)"]
  - layer: ai
    items: ["Google Gemini API (gemini-2.5-flash / gemini-2.0-flash via REST JSON)"]
  - layer: hosting
    items: ["Hugo Static Engine (/apps/flashcards/)", "Shims SEO Retrocompatibles (/es/, /en/)"]

