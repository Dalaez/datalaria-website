    changes:
      - es: "Integración del modo de autocompletado inteligente con Google Gemini API para generación de términos y definiciones."
        en: "Intelligent autocomplete mode integration with Google Gemini API for automated term and definition generation."
      - es: "Implementación de síntesis fonética por voz mediante la Web Speech Synthesis API nativa del navegador."
        en: "Phonetic voice synthesis implementation powered by the browser's native Web Speech Synthesis API."
      - es: "Soporte de importación y exportación de archivos CSV con PapaParse y plantillas de ejemplo descargables."
        en: "CSV import and export support with PapaParse including downloadable sample templates."
      - es: "Animación de tarjeta tridimensional (CSS 3D rotateY) y persistencia de progreso en LocalStorage."
