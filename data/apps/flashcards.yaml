    state: released
    type: release
    title:
      es: "Evolución a Mazo Mágico v2.0: Audio Fonético, 6 Mazos Curados, 3 Modos y Gemini Batch"
      en: "Evolution to Magic Deck v2.0: Phonetic Speech, 6 Curated Decks, 3 Modes and Gemini Batch"
    changes:
      - es: "Cierre de drift de contrato: integración de síntesis de voz Web Speech API con velocidad normal (1.0x) y modo tortuga (0.75x) para practicar pronunciación bilingüe."
        en: "Contract drift resolution: native Web Speech API voice synthesis with normal (1.0x) and turtle (0.75x) speeds for bilingual pronunciation."
      - es: "6 mazos pre-cargados para niños (Ciencias del Cuerpo Humano, Espacio, Capitales) y adultos (Business English, Conceptos IA, Estrategia MBA)."
        en: "6 pre-loaded curated study decks for kids (Human Body Science, Space, Capitals) and adults (Business English, AI Concepts, MBA Strategy)."
      - es: "3 modos de estudio interactivos: Giro 3D con Cajas Leitner, Quiz Arcade de 4 opciones y Reto de Escritura con pistas ortográficas progresivas."
        en: "3 interactive study modes: 3D Leitner Flip, 4-Option Quiz Arcade, and Spelling Mode with progressive letter-by-letter hints."
      - es: "Migración de la API de Gemini a llamadas en lote estructuradas en JSON (gemini-2.5-flash con fallback a gemini-2.0-flash), acelerando 10x la generación de cartas."
        en: "Gemini API upgrade to structured batch JSON calls (gemini-2.5-flash with gemini-2.0-flash fallback), accelerating generation 10x."
      - es: "Parser y exportador CSV estándar RFC-4180 con descarga de mazos y plantillas de ejemplo descargables."
        en: "Standard RFC-4180 CSV parser and exporter with full deck download and sample templates."
      - es: "PWA 100% Offline: manifest.json, sw.js, icono vectorial y erradicación total de CDNs externos (Tailwind y Giphy)."
        en: "100% Offline PWA: manifest.json, sw.js, vector icon, and complete elimination of external CDNs (Tailwind and Giphy)."
      - es: "Persistencia completa de mazos, récords y 6 medallas coleccionables en LocalStorage con lluvia de confeti en Canvas."
        en: "Full persistence of custom decks, records, and 6 achievement medals in LocalStorage with native Canvas confetti."
      - es: "Shims de redirección SEO en /es/ y /en/ con reparación de errata UTF-g."
        en: "SEO redirection shims in /es/ and /en/ fixing legacy UTF-g charset bug."

