title:
  es: "LifeOps"
  en: "LifeOps"

tagline:
  es: "Sistema operativo integral personal y profesional: deporte, lecturas, cine, tablero Kanban y proyectos."
  en: "All-in-one personal & professional OS: fitness tracking, book library, movies, Kanban tasks and projects."

summary:
  es: "Plataforma modular full-stack para unificar la gestión de actividades personales (fitness, biblioteca, cine) y proyectos profesionales mediante tableros Kanban interactivos, generación de informes ejecutivos en Word/Excel/CSV y arquitectura cloud serverless con Supabase a coste cero."
  en: "Full-stack modular platform unifying personal activity tracking (fitness, reading, cinema) and professional projects via interactive Kanban boards, automated executive reporting in Word/Excel/CSV, and cloud serverless Supabase architecture at zero cost."

objectives:
  - es: "Centralizar en una sola interfaz reactiva datos que habitualmente se dispersan en múltiples aplicaciones de suscripción."
    en: "Consolidate personal and professional records into a single responsive interface, eliminating multi-app subscription sprawl."
  - es: "Proveer un tablero Kanban profesional con comentarios cronológicos persistidos en estructuras JSONB."
    en: "Deliver an executive Kanban workflow with chronological activity trails persisted in PostgreSQL JSONB structures."
  - es: "Generar informes ejecutivos descargables en Word (.docx), hojas de cálculo Excel (.xlsx) y CSV con codificación UTF-8 BOM."
    en: "Generate downloadable executive reports in Word (.docx), Excel spreadsheets (.xlsx), and CSV with UTF-8 BOM encoding."
  - es: "Operar bajo un modelo de infraestructura cloud 100% gratuito (Netlify + Render Free + Supabase Cloud)."
    en: "Operate under a zero-cost cloud architecture using Netlify, Render free tier, and Supabase managed PostgreSQL."

features:
  - icon: "🏃"
    es: "Módulo Deportivo: registro de entrenamientos, ritmos, kilometraje, calorías y cálculo de promedios."
    en: "Fitness Module: log workouts, pace, distance, calories, and automated average calculation."
  - icon: "📚"
    es: "Biblioteca de Lecturas: estado de libros (leyendo, completado, pendiente), calificación y notas clave."
    en: "Book Library: reading statuses (reading, completed, queue), personal ratings, and key takeaways."
  - icon: "🎬"
    es: "Videoteca Cine & Series: catálogo de películas vistas, directores, plataforma y valoración personal."
    en: "Cinema & Series: watched catalog, directors, streaming providers, and personal reviews."
  - icon: "📋"
    es: "Gestión de Proyectos & Kanban: estados (Pendiente, En curso, En revisión, Hecho), prioridades y comentarios."
    en: "Project & Kanban Workspace: task statuses, priority flags, deadlines, and timestamped comment trails."
  - icon: "📊"
    es: "Motor de Informes Ejecutivos: exportación de resúmenes consolidados en Word y tablas de datos en Excel."
    en: "Executive Reporting Engine: consolidated summary document generation in Word and data export in Excel."
  - icon: "📈"
    es: "Dashboard Analítico 360°: filtrado temporal multidimensional (semanas, meses, año), comparativa inter-periodo (Δ%), drill-down por subcategorías, gráficos Recharts y mapa de consistencia de 16 semanas."
    en: "360° Analytics Dashboard: multi-dimensional timeframe filtering (weeks, months, year), period-over-period delta comparisons (Δ%), subcategory drill-down, Recharts visualizations and 16-week consistency heatmap."
  - icon: "🚀"
    es: "Modo Demo Sandbox: prueba interactiva instantánea con datos simulados sin requerir registro ni backend."
    en: "Instant Sandbox Demo: explore all modules with deterministic mock data without sign-up or backend requirements."

design:
  architecture:
    es: "Arquitectura desacoplada en 3 capas: Single Page Application (SPA) en React 19 servida desde CDN estática con HashRouter, API REST asíncrona en FastAPI desplegada en Render con autenticación JWT estricta y limitación de tasa SlowAPI, y base de datos relacional PostgreSQL en Supabase aislada en el esquema propio 'lifeops'."
    en: "Decoupled 3-tier architecture: React 19 Single Page Application (SPA) served via static CDN using HashRouter, asynchronous FastAPI REST backend on Render with cryptographic JWT verification and SlowAPI rate limiting, and managed PostgreSQL on Supabase isolated in its own 'lifeops' schema."
  principles:
    - es: "Aislamiento de esquemas: ningún dato de LifeOps comparte tablas con el núcleo del portal (esquema 'lifeops')."
      en: "Schema isolation: all tables reside exclusively within the dedicated 'lifeops' PostgreSQL schema."
    - es: "Verificación criptográfica estricta: firma JWT obligatoria en backend mediante clave HMAC secreta de Supabase."
      en: "Strict cryptographic validation: mandatory JWT signature verification via Supabase secret HMAC key."
    - es: "Dual-Mode determinista: el modo de prueba (?mock=true) ejecuta 100% en cliente sin peticiones de red."
      en: "Deterministic Dual-Mode: demo mode (?mock=true) runs 100% client-side without network requests."
  diagram: |
    flowchart LR
      U["Usuario"] --> FE["LifeOps Web (React 19 SPA)\ndatalaria.com/apps/lifeops/"]
      FE -->|"mock=true"| MOCK["Datos simulados en cliente\n(api.js)"]
      FE -->|"Auth JWT"| API["LifeOps API (FastAPI)\nRender Cloud"]
      API -->|"HMAC-SHA256"| JWT["PyJWT Validator"]
      API -->|"schema: lifeops"| DB[("Supabase PostgreSQL\nlifeops.*")]
      API --> DOCX["Word .docx & Excel .xlsx\n(Streaming)"]

tech:
  - layer: frontend
    items: ["React 19", "Vite 8", "React Router 7", "Recharts", "Lucide Icons"]
  - layer: backend
    items: ["Python 3.11", "FastAPI", "Pydantic v2", "PyJWT", "python-docx", "openpyxl", "SlowAPI"]
  - layer: data
    items: ["PostgreSQL 15 (Supabase)", "Row-Level Security (RLS)", "JSONB Storage"]
  - layer: infra
    items: ["Netlify Static Hosting", "Render Cloud API", "Supabase Auth"]

