title:
  es: "Ábaco Arcade (Matemáticas Lúdicas)"
  en: "Abacus Arcade (Playful Mental Math)"

tagline:
  es: "Entrenamiento de cálculo mental gamificado con 6 niveles adaptativos, audio nativo y pistas visuales para niños y adultos."
  en: "Gamified mental arithmetic arcade across 6 adaptive levels with native audio and visual hints for kids and adults."

summary:
  es: "Aplicación interactiva y lúdica diseñada para la enseñanza y práctica del cálculo mental en niños (5 a 11 años) y adultos. Nacida como testimonio pionero de pair-programming con IA (ChatGPT y metodología Prompt Engineering de Founderz), la versión 2.0 incorpora 6 niveles progresivos (desde sumas infantiles hasta retos de agilidad mental con combinadas y porcentajes), sintetizador nativo de audio 8-bit con Web Audio API, manipuladores visuales con agrupaciones de objetos, numpad táctil 3D para tablets, 3 modos de juego (Zen, Clásico y Contrarreloj 60s) y 6 medallas coleccionables, operando 100% offline y sin librerías externas."
  en: "Interactive mental math arcade game crafted for kids (ages 5 to 11) and adults. Originating as a pioneering AI pair-programming case study (ChatGPT & Founderz Prompt Engineering), v2.0 introduces 6 adaptive levels (from primary foundations to adult mental agility challenges with combined operations and percentages), native 8-bit procedural Web Audio synthesis, visual math manipulatives with grouped objects, 3D on-screen tactile numpad for tablets, 3 game modes (Zen, Classic, and 60s Time Attack), and 6 collectible badges, operating 100% offline with zero external dependencies."

objectives:
  - es: "Crear un entorno arcade lúdico, táctil y accesible para el entrenamiento del cálculo mental sin estrés ni formalismos rígidos."
    en: "Create an engaging, tactile, and accessible arcade environment for mental arithmetic practice free of rigid corporate friction."
  - es: "Proporcionar una experiencia adaptada y divertida tanto para niños en aprendizaje elemental como para adultos que buscan agilidad cognitiva."
    en: "Provide an adaptive and fun experience for both primary school children and adults seeking cognitive agility."
  - es: "Cerrar la brecha de contract drift con audio nativo 8-bit, pistas visuales con objetos tangibles y sistema de medallas coleccionables."
    en: "Eliminate historical contract drift with native 8-bit audio synthesis, visual object manipulatives, and collectible badges."
  - es: "Consolidar una arquitectura Single-Source-of-Truth sin dependencias CDN externas con shims de redirección SEO en /es/ y /en/."
    en: "Consolidate a Single-Source-of-Truth architecture without external CDN dependencies, preserving legacy SEO with redirection shims."

features:
  - icon: "🌱"
    es: "6 Niveles Adaptativos: desde conteo básico de 1 dígito hasta jerarquía de operaciones, incógnitas y porcentajes para adultos."
    en: "6 Adaptive Levels: ranging from 1-digit addition foundations to adult order of operations, missing unknowns, and percentages."
  - icon: "💡"
    es: "Manipulador Visual Interactivo: representaciones gráficas tangibles (manzanas, estrellas, cuadrículas y cajas de reparto con resto)."
    en: "Interactive Math Manipulative: tangible visual representations (apples, stars, grids, and division boxes with remainder)."
  - icon: "⌨️"
    es: "Numpad Arcade Táctil 3D: teclado numérico integrado en pantalla que evita que el teclado del sistema tape el juego en tablets y móviles."
    en: "Tactile 3D Arcade Numpad: on-screen keypad preventing system soft keyboards from covering the play area on tablets and mobile devices."
  - icon: "🔊"
    es: "Sintetizador Web Audio & Confeti: efectos sonoros alegres procedurales, combos de racha y lluvia de confeti física en Canvas."
    en: "Web Audio Synthesizer & Confetti: cheerful procedural 8-bit soundscapes, streak combo multipliers, and canvas confetti."
  - icon: "🎮"
    es: "3 Modos de Juego y Medallas: Modo Zen (sin reloj), Clásico (10 rondas con tiempo) y Contrarreloj 60s con 6 medallas de logros."
    en: "3 Game Modes & Badges: Zen Mode (relaxed), Classic (10 timed rounds), and 60s Time Attack with 6 unlockable badges."
  - icon: "📲"
    es: "PWA 100% Offline e Instalable: botón de instalación en pantalla de inicio (Android, iOS y escritorio), Service Worker y cero dependencias de red."
    en: "100% Offline Installable PWA: home screen install button (Android, iOS, desktop), Service Worker cache, and zero network dependencies."
  - icon: "📅"
    es: "Reto Diario Determinista & Repaso de Fallos: reto diario estilo Wordle reproducible por semilla, tarjeta visual para compartir en redes y módulo didáctico de repaso de errores."
    en: "Deterministic Daily Challenge & Mistake Review: Wordle-style seed-based daily challenge, visual share card with deep linking, and pedagogical mistake review module."
  - icon: "🎓"
    es: "Perfiles Familiares & Diploma Arcade PNG: selector de múltiples jugadores locales con estadísticas aisladas y generador de certificado de honor en PNG de alta resolución mediante Canvas 2D nativo."
    en: "Family Profiles & Arcade PNG Diploma: multi-player local switcher with isolated stats and high-resolution honors certificate PNG generator via native Canvas 2D."

design:
  architecture:
    es: "Arquitectura SPA estática y autónoma bajo Single-Source-of-Truth en /apps/maths/: el motor procedural genera retos aritméticos deterministas según el nivel y valida respuestas en memoria cliente. Se elimina la duplicación de código en carpetas de idiomas mediante un diccionario i18n unificado y shims retrocompatibles en /es/ y /en/."
    en: "Self-contained Single-Source-of-Truth client-side SPA in /apps/maths/: procedural math engine generates deterministic arithmetic challenges bounded by grade level, validating answers in browser memory. Eliminates legacy language folder duplication via unified i18n dictionaries and redirection shims in /es/ and /en/."
  principles:
    - es: "Pedagogía y Estética Lúdica (Consumer Playful): botones arcade 3D, pistas visuales amigables y diseño sin penalizaciones punitivas."
      en: "Playful Pedagogy & Aesthetics (Consumer Playful): 3D arcade buttons, friendly visual hints, and positive reinforcement."
    - es: "Cero Dependencias de Red Externas: 100% CSS nativo sin Tailwind CDN ni fuentes bloqueantes de Google Fonts."
      en: "Zero External Network Dependencies: 100% native CSS eliminating Tailwind CDN and blocking Google Fonts."
    - es: "Ergonomía Multidispositivo: Numpad táctil para pantallas táctiles y atajos de teclado completos (0-9, Enter, Tab) para PC."
      en: "Multi-Device Ergonomics: On-screen numpad for tablets and full keyboard shortcuts (0-9, Enter, Tab) for desktop."
  diagram: |
    flowchart TD
      START["Selección de Nivel (1-6) & Modo (Zen / Clásico / 60s)"] --> GAME["Tablero de Cálculo"]
      GAME --> HINT{"¿Necesita Pista?"}
      HINT -- "Sí" --> VISUAL["Manipulador Visual (Manzanas / Rejilla / Reparto)"]
      HINT -- "No" --> NUMPAD["Entrada por Numpad Táctil o Teclado"]
      NUMPAD --> EVAL{"Validación en Cliente"}
      EVAL -- "Correcto" --> COMBO["+Puntos & Combo Racha & Audio Alegre"]
      EVAL -- "Fallo / Tiempo" --> CORR["Corrección Constructiva"]
      COMBO --> NEXT["Siguiente Reto"]
      CORR --> NEXT
      NEXT --> STATS["Resumen de Sesión & Medallas Desbloqueadas"]

tech:
  - layer: frontend
    items: ["HTML5 Nativo", "CSS3 Design Tokens (Daylight Arcade & Cosmic Night)", "Vanilla JavaScript Moderno"]
  - layer: audio_canvas
    items: ["Web Audio API Procedural (8-bit)", "Canvas 2D Confetti Engine"]
  - layer: pedagogy
    items: ["Generación procedimental acotada a niveles (Infantil a Reto Adultos)", "Manipuladores visuales concretos"]
  - layer: methodology
    items: ["Prompt Engineering evolutivo", "Spec-Driven Development (SDD)", "Datalaria Helix"]
  - layer: hosting
    items: ["Hugo Static Engine (/apps/maths/)"]

