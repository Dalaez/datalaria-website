        en: "PWA Gold compliance: standalone and appinstalled detection to auto-hide install button, and contextual guidance for iOS Safari vs Android/Desktop in ES/EN."
      - es: "Actualizador in-app reactivo: badge interactivo v2.2.0 con comprobación en visibilitychange, protección contra dobles recargas en controllerchange y caché datalaria-snake-v2.2.0."
        en: "Reactive in-app updater: interactive v2.2.0 badge checking on visibilitychange, refresh guard in controllerchange and datalaria-snake-v2.2.0 cache."
      - es: "Clasificación offline optimista: inserción inmediata en la caché del ranking con badge de estado OFFLINE y auto-sincronización desatendida con Supabase al recuperar conexión (evento online)."
        en: "Optimistic offline leaderboard: immediate local cache insertion with OFFLINE status badge and automated background sync with Supabase on reconnect (online event)."

