releases:
  - version: v2.3.0
    date: "2026-11-07"
    state: released
    type: feature
    title:
      es: "Ergonomía Táctil Full-Swipe, Hit-Stop de Colisión, Inspección de Tablero y Cuenta Atrás 3-2-1"
      en: "Full-Swipe Touch Ergonomics, Collision Hit-Stop, Board Inspection & 3-2-1 Countdown"
    changes:
      - es: "Conmutador D-Pad / Modo Full-Swipe: permite alternar entre cruceta virtual o swipe puro en dispositivos táctiles, ganando hasta 160 px adicionales de altura útil de canvas."
        en: "D-Pad / Full-Swipe Mode toggle: switch between virtual d-pad or pure gestures on touch devices, expanding active canvas height by up to 160 px."
      - es: "Feedback háptico nativo (navigator.vibrate): pulsos táctiles diferenciados al capturar nodos (15 ms), subir de nivel (doble pulso) y colisionar (80 ms), sincronizados con el audio."
        en: "Native haptic feedback (navigator.vibrate): distinct tactile pulses upon eating nodes (15 ms), leveling up (double pulse), and crashing (80 ms), synchronized with sound."
      - es: "Pausa dramática (Hit-Stop) de 450 ms y botón de Inspección de Tablero: resalta la casilla exacta del impacto y permite transparentar el modal de Game Over para estudiar la jugada final."
        en: "450 ms dramatic Hit-Stop and Board Inspection button: highlights exact impact tile and lets player fade the Game Over modal to review the final position."
      - es: "Cuenta atrás animada 3-2-1-HACK! con audio 8-bit al reanudar partida desde Pausa para evitar colisiones involuntarias a alta velocidad."
        en: "Animated 3-2-1-HACK! countdown with synthesized 8-bit beeps when resuming from Pause, preventing accidental high-speed collisions."

