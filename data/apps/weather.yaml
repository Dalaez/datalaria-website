slug: weather
order: 30
tier: flagship
status: live
icon: "🌤️"
cover: cover.png
app_url: /apps/weather/
demo_url: /apps/weather/
source_spec: specs/apps/weather/spec.md
current_version: v1.0.0

title:
  es: "Dashboard Climático IA"
  en: "Weather Service AI"

tagline:
  es: "Servicio meteorológico global 100% serverless con recolección continua, mapa interactivo y predicción con Machine Learning."
  en: "100% serverless global weather intelligence with continuous ETL, interactive maps, and Machine Learning forecasts."

summary:
  es: "Servicio meteorológico completo de coste cero que ingesta telemetría de más de 160 ciudades globales mediante la API de OpenWeatherMap. Combina persistencia particionada en CSV, entrenamiento diario de modelos de Regresión Lineal con Scikit-Learn y visualización interactiva con series temporales (Chart.js) y mapas geoespaciales (Leaflet)."
  en: "Zero-cost full-stack weather service ingesting live telemetry across 160+ global cities via OpenWeatherMap API. Combines partitioned CSV historical storage, daily Scikit-Learn Linear Regression model retraining, and interactive frontend visualizations with time-series charts (Chart.js) and geospatial maps (Leaflet)."

objectives:
  - es: "Diseñar e implementar una arquitectura de recolección y predicción meteorológica global 100% serverless de coste cero."
    en: "Design and implement a zero-cost 100% serverless global weather data harvesting and prediction architecture."
  - es: "Construir un pipeline ETL batch diario con GitHub Actions sin necesidad de servidores ni bases de datos tradicionales."
    en: "Build a daily batch ETL pipeline using GitHub Actions eliminating the need for dedicated servers or traditional SQL databases."
  - es: "Implementar modelos predictivos deterministas de Machine Learning (Scikit-Learn) para contrastar su precisión frente al pronóstico oficial de 5 días de OpenWeatherMap."
    en: "Implement deterministic Machine Learning prediction models (Scikit-Learn) to benchmark accuracy against official OpenWeatherMap 5-day forecasts."
  - es: "Ofrecer una experiencia de usuario rica, fluida y multilingüe con mapas Leaflet, selector de ciudades y streaming de datos cliente con PapaParse."
    en: "Deliver a rich, fluid, and multilingual user experience with Leaflet maps, instant city filtering, and client-side CSV streaming via PapaParse."

features:
  - icon: "⚙️"
    es: "Pipeline ETL Automatizado: GitHub Actions ejecuta el recolector Python 3 veces al día (06:00, 14:00, 22:00 UTC) de forma desatendida."
    en: "Automated ETL Pipeline: GitHub Actions triggers the Python data harvester 3 times daily (06:00, 14:00, 22:00 UTC) unattended."
  - icon: "🤖"
    es: "Predicción por Machine Learning: 3 modelos de Regresión Lineal entrenados con variables desfasadas (lag-1) y estacionalidad anual para predecir max, min y media."
    en: "Machine Learning Forecasting: 3 Linear Regression models trained on lagged metrics (lag-1) and seasonal day-of-year features to predict tomorrow's temps."
  - icon: "🗺️"
    es: "Mapa Geoespacial Interactivo: visualización de estaciones y temperaturas globales en tiempo real con marcadores Leaflet.js."
    en: "Geospatial Interactive Map: real-time global weather stations and temperatures displayed via dynamic Leaflet.js markers."
  - icon: "📈"
    es: "Series Temporales Multivariables: gráficos interactivos de Chart.js con alternancia de temperatura, humedad, viento y nubosidad."
    en: "Multivariate Time-Series: interactive Chart.js visualizations toggling temperature, humidity, wind, and cloudiness trends."
  - icon: "⚡"
    es: "Streaming Cliente con PapaParse: análisis y carga instantánea de archivos CSV históricos particionados por ciudad directamente en el navegador."
    en: "Client-Side Streaming via PapaParse: instant client-side parsing of partitioned historical CSV files directly in browser memory."
  - icon: "🌐"
    es: "Arquitectura Bilingüe y Despliegue Netlify: interfaz con selector de idioma dinámico y proxy transparente de alta velocidad en producción."
    en: "Bilingual UI & Netlify Deployment: dynamic language switching and transparent high-speed Netlify rewrite proxy in production."

design:
  architecture:
    es: "Arquitectura desacoplada en 3 capas: automatización ETL en GitHub Actions ejecutando read_weather.py contra OpenWeatherMap v2.5, persistencia estática particionada en ficheros CSV y JSON exportados al repositorio Git, y frontend SPA monolítico servido en Netlify con enrutamiento proxy 200! transparente desde Datalaria."
    en: "Decoupled 3-tier architecture: ETL automation in GitHub Actions executing read_weather.py against OpenWeatherMap v2.5, partitioned static persistence in CSV and JSON files pushed to the repository, and monolithic SPA frontend hosted on Netlify with transparent 200! rewrite proxy routing from Datalaria."
  principles:
    - es: "Filosofía 100% Serverless: cero costes fijos de computación en reposo mediante tareas programadas gratuitas y hosting estático."
      en: "100% Serverless Philosophy: zero idle compute costs via free scheduled cron workflows and static CDN hosting."
    - es: "Persistencia ligera y portable: cada ciudad es un fichero CSV plano estructurado con 15 variables meteorológicas normalizadas."
      en: "Lightweight and portable persistence: each city is an isolated flat CSV file structured with 15 normalized meteorological variables."
    - es: "Cálculo cuantitativo determinista: el modelo de regresión lineal entrena sobre datos observados reales sin depender de llamadas a LLMs."
      en: "Deterministic quantitative modeling: linear regression trains strictly on observed empirical records without LLM API calls."
  diagram: |
    flowchart LR
      CRON["GitHub Actions Cron (3x/dia)"] --> PY["read_weather.py (ETL Python)"]
      PY -->|"API v2.5"| OWM["OpenWeatherMap"]
      PY -->|"Series Temporales"| CSV["datos/ciudades_csv"]
      CSV -->|"Entrenamiento"| ML["Scikit-Learn (LinearRegression)"]
      ML --> PRED["predicciones.json"]
      PY --> MAP["city_locations.json"]
      PRED --> UI["Dashboard Web (Chart.js + Leaflet)"]
      MAP --> UI
      CSV --> UI

tech:
  - layer: frontend
    items: ["Vanilla JS", "Tailwind CSS CDN", "Chart.js", "Leaflet.js", "PapaParse.js", "Choices.js", "Feather Icons"]
  - layer: backend
    items: ["Python 3.10", "Scikit-Learn", "Pandas", "Requests"]
  - layer: devops
    items: ["GitHub Actions Cron", "Netlify Hosting", "Netlify 200! Proxy Rewrite"]
  - layer: apis
    items: ["OpenWeatherMap Current Weather (2.5)", "OpenWeatherMap 5-Day Forecast (2.5)"]

