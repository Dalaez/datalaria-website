title:
  es: "Weather Intelligence v3.3"
  en: "Weather Intelligence v3.3"

tagline:
  es: "Centro de control meteorológico global y laboratorio cuantitativo: 168 estaciones, Fourier, Buscador de Destinos, Clima Gemelo y widgets embebibles."
  en: "Global climate control center and quantitative laboratory: 168 stations, Fourier ML, Destination Finder, Twin Climate, and embeddable widgets."

summary:
  es: "Servicio meteorológico integral de coste cero que ingesta telemetría 3 veces al día de 168 estaciones en 6 regiones mediante OpenWeatherMap v2.5. Implementa regresión con estacionalidad armónica de Fourier (sin y cos de 365.25 días), walk-forward backtesting IA vs. OWM con R² y MAE, índice de confort outdoor (0-100), Cockpit en 3 vistas (Observatorio, Laboratorio ML, Atlas 168) y mapa Leaflet multicapa con exportación CSV/JSON."
  en: "Zero-cost full-stack weather intelligence platform ingesting 3x/day telemetry across 168 global stations in 6 regions via OpenWeatherMap v2.5. Implements cyclic Fourier harmonic seasonality (365.25-day sin/cos), walk-forward AI vs. OWM backtesting with R² and MAE, outdoor comfort index (0-100), 3-view executive Cockpit (Observatory, ML Arena, Atlas 168), and multi-layer Leaflet map with CSV/JSON export."

objectives:
  - es: "Diseñar e implementar una arquitectura de recolección y predicción meteorológica global 100% serverless de coste cero."
    en: "Design and implement a zero-cost 100% serverless global weather data harvesting and prediction architecture."
  - es: "Construir un pipeline ETL batch diario con GitHub Actions sin necesidad de servidores ni bases de datos tradicionales."
    en: "Build a daily batch ETL pipeline using GitHub Actions eliminating the need for dedicated servers or traditional SQL databases."
  - es: "Implementar modelos predictivos deterministas de Machine Learning con armónicos de Fourier (sin/cos) y walk-forward backtesting frente a OpenWeatherMap."
    en: "Implement deterministic Machine Learning prediction models with Fourier harmonics (sin/cos) and walk-forward backtesting against OpenWeatherMap."
  - es: "Calcular el Índice de Confort Outdoor (0-100) y anomalías térmicas de 30 días para 168 ciudades en 6 regiones del planeta."
    en: "Compute Outdoor Comfort Index (0-100) and 30-day thermal anomalies across 168 global cities in 6 canonical regions."
  - es: "Ofrecer una experiencia ejecutiva data-dense con mapa Leaflet multicapa, selector de 7 métricas, barra de 5 presets en 1 clic y exportación CSV/JSON."
    en: "Deliver an executive data-dense experience with 5-layer Leaflet map, 7 metrics selector, 1-click 5-presets bar, and CSV/JSON export."

features:
  - icon: "⚙️"
    es: "Pipeline ETL Automatizado: GitHub Actions ejecuta el recolector Python 3 veces al día (06:00, 14:00, 22:00 UTC) de forma desatendida."
    en: "Automated ETL Pipeline: GitHub Actions triggers the Python data harvester 3 times daily (06:00, 14:00, 22:00 UTC) unattended."
  - icon: "🤖"
    es: "Laboratorio ML & Duelo Walk-Forward: modelos de regresión con armónicos estacionales de Fourier (sin y cos de 365.25d), lags térmicos y scorecard con R², MAE y bias vs. OWM."
    en: "ML Arena & Walk-Forward Duel: regression models with Fourier seasonal harmonics (365.25-day sin/cos), thermal lags, and scorecard reporting R², MAE, and bias vs. OWM."
  - icon: "🏃‍♂️"
    es: "Índice de Confort Outdoor (0-100): formulación bio-climática determinista que pondera sensación térmica óptima a 21°C, humedad, rachas de viento, nubosidad y lluvia."
    en: "Outdoor Comfort Index (0-100): deterministic bio-climatic scoring penalizing deviations from 21°C, extreme humidity, wind gusts, cloud cover, and precipitation."
  - icon: "🗺️"
    es: "Mapa Geoespacial Multicapa: selector de 5 capas en Leaflet (Temperatura, Confort, Anomalía 30d, Viento, Humedad) con encuadre automático por selección."
    en: "Multi-Layer Geospatial Map: 5-layer Leaflet switcher (Temperature, Comfort, 30d Anomaly, Wind, Humidity) with smooth selection auto-framing."
  - icon: "🏆"
    es: "Atlas Global 168 + Buscador de Destinos & Clima Gemelo: ranking actual por regiones, buscador bioclimático por mes/preferencias y emparejador z-score de climas gemelos."
    en: "Global Atlas 168 + Destination Finder & Twin Climate: live regional ranking, bioclimatic finder by month/preferences, and z-score twin climate matcher."
  - icon: "⚡"
    es: "Barra de 5 Presets en 1 Clic & Ticker Planetario: escenarios temáticos instantáneos (Capitales ES, Hubs Globales, Extremos Hoy, Duelo IA, Top Confort) y ticker en vivo."
    en: "1-Click 5-Presets Bar & Planetary Ticker: instant thematic scenarios (Spain Capitals, Global Hubs, Today's Extremes, AI Duel, Top Comfort) and live extremes ticker."
  - icon: "📅"
    es: "Matriz Estacional Mensual: perfil térmico mes a mes de los 12 meses del año calculado a partir de las series temporales de cada ciudad."
    en: "Monthly Seasonality Matrix: month-by-month thermal profile across all 12 calendar months computed from each city's time-series records."
  - icon: "🌐"
    es: "Deep-Linking URL, Tarjetas PNG 1200×630, Widgets Embebibles & Explorador SEO 168 Ciudades: exportación de imágenes sociales, <iframe> con atribución y resumen semanal para Scriba."
    en: "URL Deep-Linking, 1200×630 PNG Cards, Embeddable Widgets & 168-City SEO Explorer: client-side social cards, attribution <iframe> widgets, and weekly Scriba extremes JSON."

design:
  architecture:
    es: "Arquitectura desacoplada en 3 capas de coste cero: recolección ETL en GitHub Actions ejecutando read_weather.py contra OpenWeatherMap v2.5, persistencia particionada en CSVs planos y contratos JSON consolidados (global_summary.json, predicciones.json, city_locations.json), y frontend SPA monolítico servido en Netlify con enrutamiento proxy 200! transparente desde Datalaria."
    en: "Decoupled zero-cost 3-tier architecture: ETL automation in GitHub Actions executing read_weather.py against OpenWeatherMap v2.5, partitioned static persistence in flat CSVs and consolidated JSON schemas (global_summary.json, predicciones.json, city_locations.json), and monolithic SPA frontend hosted on Netlify with transparent 200! rewrite proxy routing from Datalaria."
  principles:
    - es: "Filosofía 100% Serverless: cero costes fijos de computación en reposo mediante tareas programadas gratuitas y hosting estático."
      en: "100% Serverless Philosophy: zero idle compute costs via free scheduled cron workflows and static CDN hosting."
    - es: "Persistencia ligera y portable: cada ciudad es un fichero CSV plano estructurado con 15 variables meteorológicas normalizadas."
      en: "Lightweight and portable persistence: each city is an isolated flat CSV file structured with 15 normalized meteorological variables."
    - es: "Cálculo cuantitativo determinista: regresión armónica de Fourier y confort outdoor calculados empíricamente sin llamadas a LLMs ni APIs de pago."
      en: "Deterministic quantitative modeling: Fourier harmonic regression and outdoor comfort computed empirically without paid APIs or LLMs."
    - es: "Resiliencia offline y fallback: el frontend soporta el resumen global consolidado con recálculo en navegador y proxy CDN ante caídas."
      en: "Offline resilience and fallback: frontend leverages consolidated global summary with in-browser recalculation and CDN proxy fallback."
  diagram: |
    flowchart LR
      CRON["GitHub Actions Cron (3x/dia)"] --> PY["read_weather.py v2.0"]
      PY -->|"API v2.5"| OWM["OpenWeatherMap API"]
      PY -->|"Series Temporales"| CSV["datos/ciudades_csv (168)"]
      CSV -->|"Entrenamiento"| ML["Scikit-Learn (Fourier sin/cos)"]
      ML --> PRED["predicciones.json (R2, MAE, Lags)"]
      PY --> MAP["city_locations.json (168 Coords)"]
      PY --> SUM["global_summary.json (Extremos y Confort)"]
      PRED --> UI["Executive Cockpit (3 Vistas)"]
      MAP --> UI
      SUM --> UI
      CSV --> UI

tech:
  - layer: frontend
    items: ["Vanilla JS", "CSS Custom Properties (#0b0f17)", "Chart.js", "Leaflet.js", "PapaParse.js", "Choices.js", "Feather Icons"]
  - layer: backend
    items: ["Python 3.10+", "Scikit-Learn (Fourier Regression)", "Pandas", "Requests", "Pytest Suite"]
  - layer: devops
    items: ["GitHub Actions Cron", "Netlify Hosting", "Netlify 200! Proxy Rewrite", "Offline-Rebuild CLI"]
  - layer: apis
    items: ["OpenWeatherMap Current Weather (2.5)", "OpenWeatherMap 5-Day Forecast (2.5)"]

