      - es: "Guardia espacial en Leaflet (isMapContainerReady, safeFlyTo, safeFlyToBounds, pendingMapViewport y map.stop) que difiere transiciones mientras el Observatorio está oculto, erradicando excepciones 'Invalid LatLng object: (NaN, NaN)'."
        en: "Spatial Leaflet transition guard (isMapContainerReady, safeFlyTo, safeFlyToBounds, pendingMapViewport, and map.stop) deferring bounds updates while Observatory is hidden and eliminating 'Invalid LatLng object: (NaN, NaN)' runtime errors."
      - es: "Homologación PWA Gold: registro inmediato de sw.js cuando document.readyState !== 'loading', caché offline del shell raíz con ignoreSearch preservando el veto CSV (INV-WEATHER-10), manifest.json relativo con iconos any/maskable + apple-touch-icon 180×180, regla global .hidden, guía bilingüe iOS/Desktop y redirección 301! en /apps/weather."
