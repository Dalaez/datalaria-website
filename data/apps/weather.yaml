releases:
  - version: v1.0.0
    date: "2025-12-06"
    state: released
    type: release
    title:
      es: "Lanzamiento final con mapa interactivo Leaflet, soporte bilingüe y optimizaciones UX"
      en: "Final release featuring Leaflet interactive map, multilingual support, and UX polish"
    changes:
      - es: "Integración de mapa geoespacial con Leaflet.js y marcadores interactivos con telemetría en vivo."
        en: "Geospatial map integration with Leaflet.js displaying interactive markers with live telemetry."
      - es: "Soporte bilingüe completo (ES/EN) con selector dinámico de idioma en la barra de control."
        en: "Full bilingual support (ES/EN) with dynamic language toggle in the control bar."
      - es: "Selector avanzado de ciudades con Choices.js y normalización de coordenadas para más de 160 estaciones."
        en: "Advanced city search with Choices.js and coordinate normalization for over 160 global stations."
      - es: "Optimización de la lectura cliente de CSVs con streaming asíncrono en PapaParse."
        en: "Client-side CSV parsing optimization using asynchronous streaming in PapaParse."

  - version: v0.3.0
    date: "2025-11-15"
    state: released
    type: feature
    title:
      es: "Módulo de Machine Learning con Scikit-Learn y comparativa vs OpenWeatherMap 5D"
      en: "Machine Learning module with Scikit-Learn and benchmarking vs OpenWeatherMap 5D"
    changes:
      - es: "Implementación de 3 modelos de Regresión Lineal para pronóstico a 24 horas (temperatura máxima, mínima y media)."
        en: "Implementation of 3 Linear Regression models for 24-hour temperature forecasting (max, min, and mean)."
      - es: "Generación de características desfasadas (lag-1) y estacionalidad anual sobre datos diarios agregados."
        en: "Feature engineering including lagged previous-day metrics (lag-1) and seasonal day-of-year indicators."
      - es: "Exportación de pronósticos consolidados en predicciones.json y visualización comparativa en Chart.js."
        en: "Consolidated forecast export in predicciones.json and side-by-side comparative visualization in Chart.js."

  - version: v0.2.0
    date: "2025-11-08"
    state: released
    type: feature
    title:
      es: "Dashboard interactivo frontend con Chart.js y PapaParse"
      en: "Interactive frontend dashboard with Chart.js and PapaParse"
    changes:
      - es: "Construcción de la interfaz SPA con gráficos dinámicos multivariables en Chart.js."
        en: "SPA frontend construction featuring multivariate dynamic charts in Chart.js."
      - es: "Conexión directa del cliente a los ficheros CSV históricos particionados por ciudad."
        en: "Direct client connection to partitioned historical CSV files per city."

  - version: v0.1.0
    date: "2025-10-31"
    state: released
    type: feature
    title:
      es: "Motor recolector backend en Python y pipeline automatizado con GitHub Actions"
      en: "Backend Python data harvester engine and automated pipeline with GitHub Actions"
    changes:
      - es: "Desarrollo del script read_weather.py con conexión a la API OpenWeatherMap v2.5."
        en: "Development of read_weather.py script connecting to OpenWeatherMap API v2.5."
      - es: "Estructuración del dataset histórico particionado en carpetas datos/ por ciudad."
        en: "Historical dataset structuring partitioned in datos/ folders per city."
      - es: "Configuración del workflow actualizar-clima.yml en GitHub Actions para ejecución 3 veces al día."
        en: "Configuration of actualizar-clima.yml GitHub Actions workflow for 3x daily execution."
