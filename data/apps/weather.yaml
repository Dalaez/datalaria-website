      en: "Weather Intelligence v3.3.2: Mobile Layout Containment, Leaflet NaN Guard & PWA Gold Compliance (W3.6-FIX)"
    changes:
      - es: "Contención responsive de cabecera (<header>), menú desplegable (⋯) y viewport móvil (<= 960px / <= 768px) ocultando badges secundarios a favor del título y acciones, eliminando desbordamiento horizontal y manteniendo visible #mobile-bottom-tabs sincronizado con la vista activa (INV-WEATHER-22)."
