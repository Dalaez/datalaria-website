    part: 1

releases:
  - version: v2.0.0
    date: "2026-11-04"
    state: released
    type: major
    title:
      es: "Engineering Workbench v2.0: arquitectura unificada, Scratchpad multilínea, RF avanzada y rigor CODATA"
      en: "Engineering Workbench v2.0: unified architecture, multiline Scratchpad, advanced RF, and CODATA rigor"
    changes:
      - es: "Refactorización a arquitectura Single-Source-of-Truth en `apps/conversor/` eliminando 14 archivos HTML duplicados."
        en: "Refactored to Single-Source-of-Truth architecture in `apps/conversor/` eliminating 14 duplicated HTML files."
      - es: "Despliegue de shims de redirección SEO para las 14 URLs históricas y reparación de archivo truncado `en/mecanica_en.html`."
        en: "Deployed SEO redirect shims across all 14 legacy URLs and fixed corrupted file `en/mecanica_en.html`."
      - es: "Incorporación completa de potencia logarítmica RF (dBm ⇔ W / mW / kW) y longitud de onda bidireccional (λ = c / f)."
        en: "Full addition of logarithmic RF power (dBm ⇔ W / mW / kW) and bidirectional wavelength math (λ = c / f)."
      - es: "Soporte de unidades de almacenamiento binario IEC (KiB..TiB) frente a decimales SI (kB..TB) y BTU en energía."
        en: "Support for IEC binary storage units (KiB..TiB) vs SI decimal (kB..TB) and BTU in energy."
      - es: "Nuevo módulo Batch Scratchpad para transformar y formatear columnas multilínea pegadas desde Excel o CSV."
        en: "New multiline Batch Scratchpad module to transform and format columns pasted from Excel or CSV."
      - es: "Corrección de truncamiento numérico a 3 decimales y nuevo selector de precisión (Auto, 2-8 dec, Sci)."
        en: "Fixed 3-decimal rounding truncation bug and added precision selector (Auto, 2-8 dec, Sci)."
      - es: "Barra de acceso rápido a 8 constantes físicas universales CODATA y visualización Omni-Matrix multi-escala."
        en: "Quick-access bar for 8 CODATA fundamental physical constants and multi-scale Omni-Matrix live view."
      - es: "Shell visual Datalaria con selector ES/EN dinámico, deep-linking URL, atajos de teclado y enlace a Kits B2B."
        en: "Datalaria visual shell with dynamic ES/EN toggle, deep-linking URLs, keyboard shortcuts, and B2B Kits CTA."

