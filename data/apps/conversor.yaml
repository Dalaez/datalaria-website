title:
  es: "Conversor de Unidades"
  en: "Unit Converter"

tagline:
  es: "Engineering Workbench v2.0: Navaja suiza científica para conversiones técnicas, metrología SI y procesamiento masivo."
  en: "Engineering Workbench v2.0: Scientific Swiss Army knife for technical conversions, SI metrology, and batch processing."

summary:
  es: "Suite de ingeniería de alta precisión para conversión de magnitudes físicas, metrología SI/CODATA 2022 y formateo numérico internacional. Integra 6 disciplinas científicas (Dimensión, Energía, Tiempo, Mecánica, Informática y Radiofrecuencia) con cálculo bidireccional de dBm ⇔ W, relación λ ⇔ f, y un Batch Scratchpad multilínea para limpiar y transformar columnas de Excel sin enviar datos a la red."
  en: "High-precision engineering workbench for physical unit conversion, SI/CODATA 2022 metrology, and international number formatting. Integrates 6 scientific domains (Dimension, Energy, Time, Mechanics, Computing, and Radiofrequency) with bidirectional dBm ⇔ W power, λ ⇔ f wavelength math, and a multiline Batch Scratchpad to sanitize and transform Excel columns entirely in the browser."

objectives:
  - es: "Proporcionar un Engineering Workbench digital para realizar conversiones de magnitudes científicas y de ingeniería con rigor SI/CODATA, carga instantánea y cero publicidad."
    en: "Provide a digital Engineering Workbench for scientific and engineering conversions with SI/CODATA rigor, instantaneous loading, and zero ads."
  - es: "Abarcar 6 disciplinas clave: Dimensión (longitud, área, volumen), Energía/Potencia/Temperatura, Tiempo, Mecánica (fuerza, presión), Informática (IEC binario vs SI decimal) y Radiofrecuencia (frecuencia, λ, dBm)."
    en: "Cover 6 core disciplines: Dimension (length, area, volume), Energy/Power/Temperature, Time, Mechanics (force, pressure), Computing (IEC binary vs SI decimal), and Radiofrequency (frequency, λ, dBm)."
  - es: "Garantizar reversibilidad matemática exacta (INV-CONV-1) y permitir el procesamiento multilínea por lotes desde hojas de cálculo."
    en: "Guarantee strict mathematical reversibility (INV-CONV-1) and enable multiline batch transformation from spreadsheets."
  - es: "Asegurar un funcionamiento 100% offline en el cliente, con paridad bilingüe completa (ES/EN), deep-linking y cero dependencias externas."
    en: "Ensure 100% offline client-side performance with full bilingual parity (ES/EN), deep-linking, and zero external runtime dependencies."

features:
  - icon: "📐"
    es: "6 Módulos Especializados: Dimensión (m, ft, in, NM), Energía (J, kWh, BTU, cal), Tiempo, Mecánica (N, Bar, PSI, atm), Informática (KiB/MiB vs kB/MB) y Radiofrecuencia (dBm ⇔ W, λ ⇔ f)."
    en: "6 Dedicated Modules: Dimension (m, ft, in, NM), Energy (J, kWh, BTU, cal), Time, Mechanics (N, Bar, PSI, atm), Computing (KiB/MiB vs kB/MB), and Radiofrequency (dBm ⇔ W, λ ⇔ f)."
  - icon: "📋"
    es: "Batch Scratchpad Multilínea: pega columnas enteras de Excel o CSV para convertir separadores (US ⇔ EU) y/o transformar magnitudes físicas fila por fila."
    en: "Multiline Batch Scratchpad: paste entire Excel or CSV columns to toggle number formats (US ⇔ EU) and/or convert physical units row by row."
  - icon: "📡"
    es: "Fórmulas Avanzadas de RF: cálculo bidireccional de potencia logarítmica (dBm ⇔ mW / W / kW) y relación exacta frecuencia-longitud de onda (λ = c / f)."
    en: "Advanced RF Math: bidirectional logarithmic power math (dBm ⇔ mW / W / kW) and exact frequency-to-wavelength calculations (λ = c / f)."
  - icon: "🔬"
    es: "Omni-Matrix Multi-Escala & Constantes CODATA: previsualiza al instante 4 equivalencias complementarias y accede en 1 clic a constantes universales (c, g₀, h, k_B, N_A, ε₀, R, e)."
    en: "Multi-Scale Omni-Matrix & CODATA Constants: instantly preview 4 simultaneous equivalents and inject fundamental constants in 1 click (c, g₀, h, k_B, N_A, ε₀, R, e)."
  - icon: "🔗"
    es: "Deep-Linking y Ergonomía: atajos de teclado (X invertir, C copiar), control de precisión/notación científica y URLs permanentes para compartir cálculos técnicos."
    en: "Deep-Linking & Ergonomics: keyboard shortcuts (X swap, C copy), precision/scientific notation control, and permanent shareable calculation URLs."
  - icon: "⚡"
    es: "Cero Dependencias: arquitectura Single-Source-of-Truth en Vanilla JS y CSS nativo con shims retrocompatibles para preservar el 100% de enlaces históricos y SEO."
    en: "Zero Dependencies: Single-Source-of-Truth architecture in Vanilla JS and native CSS with backward-compatible shims preserving 100% of legacy URLs and SEO."

design:
  architecture:
    es: "Arquitectura Single-Source-of-Truth desacoplada: el catálogo canónico y motor matemático residen centralizados en `apps/conversor/` y compilan a un único artefacto estático SPA ultraligero (`static/apps/conversor/index.html`). Los 14 accesos históricos en `/es/` y `/en/` cuentan con shims de redirección inmediata con meta refresh y JS para blindar el SEO y marcadores preexistentes."
    en: "Decoupled Single-Source-of-Truth architecture: canonical catalog and math engine reside in `apps/conversor/` and compile to a single lightweight static SPA (`static/apps/conversor/index.html`). The 14 legacy endpoints across `/es/` and `/en/` are preserved via instant meta refresh and JS shims protecting SEO and existing bookmarks."
  principles:
    - es: "Rigor Metrológico: estandarización sobre las definiciones del Sistema Internacional (SI) y constantes físicas CODATA 2022."
      en: "Metrological Rigor: standardized on official International System (SI) definitions and CODATA 2022 fundamental constants."
    - es: "Velocidad y Cero Bloqueo: todo cálculo se procesa en el hilo principal del navegador en microsegundos sin requerir peticiones de red."
      en: "Instantaneous Speed: all arithmetic runs on the browser's main thread in microseconds with zero network roundtrips."
    - es: "Didáctica y Contexto: cada magnitud detalla la fórmula analítica base SI utilizada para verificar el cálculo."
      en: "Educational Context: each magnitude displays the analytical canonical SI formula used to verify calculation steps."
  diagram: |
    flowchart LR
      CATALOG["Catálogo Canónico SI/CODATA"] --> ENGINE["Motor Matemático Determinista"]
      ENGINE --> SPA["SPA Workbench v2.0 (index.html)"]
      SPA --> OMNI["Omni-Matrix Multi-Escala"]
      SPA --> SCRATCH["Batch Scratchpad Multilínea"]
      SHIMS["14 Shims Retrocompatibles (/es/, /en/)"] -. "301 Redirect" .-> SPA

tech:
  - layer: frontend
    items: ["Vanilla JS (ES6+)", "HTML5 semántico", "CSS Design Tokens nativos", "Outfit & JetBrains Mono"]
  - layer: standards
    items: ["Sistema Internacional de Unidades (SI)", "Constantes Físicas CODATA 2022", "IEC 80000-13"]
  - layer: i18n
    items: ["Diccionario unificado ES/EN", "Detección dinámica URL (?lang=es|en)", "Shims localizados"]
  - layer: hosting
    items: ["Hugo Static Engine (/apps/conversor/)"]

