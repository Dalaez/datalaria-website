# Archivo: netlify.toml (en la raíz de Dalaez/datalaria-website)

# -------------------------------------------------
# INSTRUCCIONES DE BUILD PARA HUGO (¡ESTO ES LO NUEVO!)
# -------------------------------------------------
# Esto le dice a Netlify CÓMO construir tu blog
[build]
  command = "hugo"
  publish = "public"

[functions]
  directory = "netlify/functions"

# Bloqueo de seguridad: Las descargas de pago no se sirven desde la web
[[redirects]]
  from = "/downloads/*"
  to = "/recursos/"
  status = 404
  force = true
