baseURL: "https://datalaria.com/"
theme: PaperMod
canonifyURLs: true
defaultContentLanguage: es
defaultContentLanguageInSubdir: true
buildFuture: false
timeout: "300s"
ignoreFiles:
  - '(?i)desktop\.ini$'
  - '\.ini$'

# --- PAGINACIÓN ---
pagination:
  pagerSize: 10

# --- PARÁMETROS GLOBALES DEL TEMA ---
params:
  env: production
  author: "Datalaria"
  description: "Un cuaderno de bitácora digital sobre datos, IA, tecnología y la industria."
  keywords: [Blog, Data, AI, Technology, Datalaria]
  copyright: "© 2025 Datalaria. Todos los derechos reservados."

  # Renderizado Mermaid js:
  mermaid: true

  # Renderizado matemático KaTeX:
  math: true

  # Algolia Search & Agent Studio
  algoliaSearchKey: "0130e86396a12b79b35c8cf37b692258"  # Replace with your Search API Key

  # Define los favicons (buscará las imágenes en la carpeta /static)
  favicon: "/favicon.ico"
  favicon16x16: "/favicon_16x16.png"
  favicon32x32: "/favicon_32x32.png"
  apple_touch_icon: "/images/apple-touch-icon.png"

  # Logo de cabecera en barra superior
  label:
    text: "Datalaria"
    icon: "/images/datalaria_logo_transp.png"
    iconHeight: 30

  # Enlace de micro-mecenazgo (Buy Me a Coffee vía Lemon Squeezy Checkout Overlay)
  buyMeACoffeeUrl: "https://datalaria.lemonsqueezy.com/checkout/buy/20c2be9a-44ec-44ea-ada4-daa307909e26?embed=1"

  # Perfiles de redes sociales
  socialIcons:
    - name: github
      url: "https://github.com/Dalaez"
    - name: linkedin
      url: "https://www.linkedin.com/company/110125695/"
    - name: x
      title: "X (Twitter)"
      url: "https://x.com/datalaria"
  
  # Twitter Cards site handle
  social:
    twitter: "@datalaria"

# --- CONFIGURACIÓN MULTILENGUAJE ---
languages:
  es:
    languageName: "Español"
    languageCode: "es-ES"
    contentDir: "content/es"
    title: "Datalaria"
    weight: 1
    params:
      # Portada portal (Fase 3): lista de "Más leído" por orden de preferencia.
      # Se usa la primera ruta que exista y esté publicada (actualizar según Google Analytics).
      homePortal:
        mostRead:
          - "/posts/dafo-cuantitativo-matriz-came"
          - "/posts/5-fuerzas-porter-cuantitativas"
          - "/posts/john_von_neumann"
      label:
        text: "Datalaria"
        icon: "/images/datalaria_logo_transp.png"
        iconHeight: 30
      profileMode:
        enabled: true
        title: "Datalaria"
        subtitle: "Ingeniería de Operaciones, Arquitectura de Datos e IA Aplicada. Modelos cuantitativos, sistemas en producción y marcos de decisión para dirección ejecutiva (C-Level) e ingeniería."
        imageUrl: "/images/datalaria_logo_transp.png"
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: "Blog"
            url: "/es/posts/" # <-- CORREGIDO A RUTA ABSOLUTA
          - name: "Recursos"
            url: "/es/recursos/"
          - name: "Apps"
            url: "/es/apps/"
          - name: "Sobre mí"
            url: "/es/sobre-mi/" # <-- CORREGIDO A RUTA ABSOLUTA
    menu:
      main:
        - { identifier: blog, name: "Blog", url: "/posts/", weight: 10 }
        - { identifier: recursos, name: "Recursos", url: "/recursos/", weight: 20 }
        - { identifier: apps, name: "Apps", url: "/apps/", weight: 25 }
        - { identifier: about, name: "Sobre mí", url: "/sobre-mi/", weight: 30 }
        - { identifier: tags, name: "Etiquetas", url: "/tags/", weight: 40 }
        - { identifier: contact, name: "Contacto", url: "/contact/", weight: 50 }
  en:
    languageName: "English"
    languageCode: "en-US"
    contentDir: "content/en"
    title: "Datalaria"
    weight: 2
    params:
      # Portal home (Fase 3): "Most read" list in order of preference.
      # The first path that exists and is published is used (update from Google Analytics).
      homePortal:
        mostRead:
          - "/posts/abraham_wald"
          - "/posts/graphrag"
          - "/posts/kantorovich"
      label:
        text: "Datalaria"
        icon: "/images/datalaria_logo_transp.png"
        iconHeight: 30
      profileMode:
        enabled: true
        title: "Datalaria"
        subtitle: "Operations Engineering, Data Architecture & Applied AI. Quantitative models, production systems, and decision frameworks for C-Level executives and engineering teams."
        imageUrl: "/images/datalaria_logo_transp.png"
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: "Blog"
            url: "/en/posts/" # <-- CORREGIDO A RUTA ABSOLUTA
          - name: "Resources"
            url: "/en/resources/"
          - name: "Apps"
            url: "/en/apps/"
          - name: "About"
            url: "/en/about/" # <-- CORREGIDO A RUTA ABSOLUTA
    menu:
      main:
        - { identifier: blog, name: "Blog", url: "/posts/", weight: 10 }
        - { identifier: resources, name: "Resources", url: "/resources/", weight: 20 }
        - { identifier: apps, name: "Apps", url: "/apps/", weight: 25 }
        - { identifier: about, name: "About", url: "/about/", weight: 30 }
        - { identifier: tags, name: "Tags", url: "/tags/", weight: 40 }
        - { identifier: contact, name: "Contact", url: "/contact/", weight: 50 }

# --- GOOGLE ANALYTICS ---
# Pega aquí el ID que has copiado de la web de Google Analytics.
googleAnalytics: G-L09LGVL4YZ

# --- RENDERIZADO DE HTML Y CÓDIGO ---
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\\[', '\\]']
          inline:
            - ['$', '$']
            - ['\\(', '\\)']
pygmentsCodefences: true
pygmentsUseClasses: true
pygmentsStyle: "monokai"

# --- OUTPUTS (robots.txt) ---
outputs:
  home:
    - HTML
    - RSS
    - robots