name: Datalaria Autopilot 🤖

on:
  push:
    branches:
      - main
    paths:
      - 'content/**/posts/**/*.md'
      - 'content/**/posts/**/social_pack.yaml'
      - 'content/**/posts/**/social_pack.yml'
      - 'autopilot/**'
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Path del post a promocionar (ej: content/es/posts/mi-post/index.md)'
        required: true
        type: string
      twitter_override:
        description: '(Opcional) Texto editado para Twitter. Si se deja vacío, se usa IA o cache.'
        required: false
        type: string
      linkedin_override:
        description: '(Opcional) Texto editado para LinkedIn. Si se deja vacío, se usa IA o cache.'
        required: false
        type: string
      newsletter_override:
        description: '(Opcional) Texto editado para Newsletter. Si se deja vacío, se usa IA.'
        required: false
        type: string

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      file_path: ${{ steps.file_check.outputs.file_path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fix for "fatal: ambiguous argument 'HEAD^': unknown revision or path not in the working tree."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r autopilot/requirements.txt

      - name: Run Deterministic Autopilot Tests
        run: |
          python -m pytest autopilot/tests -v

      - name: Determine File to Publish
        id: file_check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual Trigger detected."
            echo "file_path=${{ inputs.file_path }}" >> $GITHUB_OUTPUT
          else
            echo "Push Trigger detected."
            # Detecta cambios en el post Markdown o en su social_pack.yaml adyacente
            CHANGED_MD=$(git diff --name-only --diff-filter=ACMRT HEAD^ HEAD | grep -E '^content/.*/posts/.*\.md$' | head -n 1 || true)
            if [ -n "$CHANGED_MD" ]; then
              CHANGED_FILE="$CHANGED_MD"
            else
              CHANGED_PACK=$(git diff --name-only --diff-filter=ACMRT HEAD^ HEAD | grep -E '^content/.*/posts/.*/social_pack\.ya?ml$' | head -n 1 || true)
              if [ -n "$CHANGED_PACK" ]; then
                CANDIDATE_INDEX="$(dirname "$CHANGED_PACK")/index.md"
                [ -f "$CANDIDATE_INDEX" ] && CHANGED_FILE="$CANDIDATE_INDEX"
              fi
            fi

            if [ -n "${CHANGED_FILE:-}" ]; then
              echo "Found changed file: $CHANGED_FILE"
              echo "file_path=$CHANGED_FILE" >> $GITHUB_OUTPUT
            else
              echo "No relevant markdown file changes detected."
            fi
          fi

      - name: Generate Preview (Dry Run)
        if: steps.file_check.outputs.file_path != ''
        env:
          DRY_RUN: "true"
          ENABLE_TWITTER_API: "false"
          # Mock Secrets or Real Secrets (Dry Run won't use them, but script might need env vars to init class)
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_COMPANY_ID: ${{ secrets.LINKEDIN_COMPANY_ID }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          # Dev.to & CoderLegion
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_ORG_ID: ${{ secrets.DEVTO_ORG_ID }}
          CODERLEGION_API_KEY: ${{ secrets.CODERLEGION_API_KEY }}
          CODERLEGION_CATEGORY_ID: ${{ vars.CODERLEGION_CATEGORY_ID }}
          CODERLEGION_LANGS: ${{ vars.CODERLEGION_LANGS || 'en' }}
          # Feature Flags (X/Twitter API desactivada por política coste 0 EUR)
          ENABLE_TWITTER: "false"
          ENABLE_LINKEDIN: ${{ vars.ENABLE_LINKEDIN }}
          ENABLE_DEVTO: ${{ vars.ENABLE_DEVTO }}
          ENABLE_CODERLEGION: ${{ vars.ENABLE_CODERLEGION }}
          ENABLE_NEWSLETTER: ${{ vars.ENABLE_NEWSLETTER }}
          # Brevo (Newsletter)
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID_ES: ${{ vars.BREVO_LIST_ID_ES }}
          BREVO_LIST_ID_EN: ${{ vars.BREVO_LIST_ID_EN }}
        run: |
          echo "👀 Generating Preview for: ${{ steps.file_check.outputs.file_path }}"
          python autopilot/src/orchestrator.py "${{ steps.file_check.outputs.file_path }}"

      - name: Upload Generated Content (for consistency)
        if: steps.file_check.outputs.file_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-content
          path: |
            generated_content.json
            autopilot/dist/
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: check_changes
    # Only run if a file was actually found/provided
    if: needs.check_changes.outputs.file_path != ''
    runs-on: ubuntu-latest
    environment: production  # <--- This requires manual approval in GitHub Settings
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Generated Content (from preview)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: autopilot-content
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r autopilot/requirements.txt

      - name: Run Autopilot Orchestrator
        env:
          # Twitter Credentials
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          
          # LinkedIn Credentials
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_COMPANY_ID: ${{ secrets.LINKEDIN_COMPANY_ID }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          
          # Dev.to & CoderLegion
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_ORG_ID: ${{ secrets.DEVTO_ORG_ID }}
          CODERLEGION_API_KEY: ${{ secrets.CODERLEGION_API_KEY }}
          CODERLEGION_CATEGORY_ID: ${{ vars.CODERLEGION_CATEGORY_ID }}
          CODERLEGION_LANGS: ${{ vars.CODERLEGION_LANGS || 'en' }}
          
          # Feature Flags (X/Twitter API desactivada por política coste 0 EUR)
          ENABLE_TWITTER: "false"
          ENABLE_TWITTER_API: "false"
          ENABLE_LINKEDIN: ${{ vars.ENABLE_LINKEDIN }}
          ENABLE_DEVTO: ${{ vars.ENABLE_DEVTO }}
          ENABLE_CODERLEGION: ${{ vars.ENABLE_CODERLEGION }}
          ENABLE_NEWSLETTER: ${{ vars.ENABLE_NEWSLETTER }}
          # Brevo (Newsletter)
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID_ES: ${{ vars.BREVO_LIST_ID_ES }}
          BREVO_LIST_ID_EN: ${{ vars.BREVO_LIST_ID_EN }}
          # Manual Content Overrides (from workflow_dispatch)
          TWITTER_OVERRIDE: ${{ inputs.twitter_override }}
          LINKEDIN_OVERRIDE: ${{ inputs.linkedin_override }}
          NEWSLETTER_OVERRIDE: ${{ inputs.newsletter_override }}
        run: |
          echo "🚀 Launching Autopilot for: ${{ needs.check_changes.outputs.file_path }}"
          python autopilot/src/orchestrator.py "${{ needs.check_changes.outputs.file_path }}"

      - name: Persist refreshed LinkedIn tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f ".linkedin_new_tokens.json" ]; then
            echo "🔄 LinkedIn tokens were refreshed. Updating GitHub Secrets..."
            
            NEW_ACCESS_TOKEN=$(jq -r '.access_token' .linkedin_new_tokens.json)
            NEW_REFRESH_TOKEN=$(jq -r '.refresh_token // empty' .linkedin_new_tokens.json)
            
            if [ -n "$NEW_ACCESS_TOKEN" ]; then
              echo "$NEW_ACCESS_TOKEN" | gh secret set LINKEDIN_ACCESS_TOKEN
              echo "   ✅ LINKEDIN_ACCESS_TOKEN actualizado en GitHub Secrets."
            fi
            
            if [ -n "$NEW_REFRESH_TOKEN" ]; then
              echo "$NEW_REFRESH_TOKEN" | gh secret set LINKEDIN_REFRESH_TOKEN
              echo "   ✅ LINKEDIN_REFRESH_TOKEN actualizado en GitHub Secrets."
            fi
            
            rm -f .linkedin_new_tokens.json
          else
            echo "ℹ️ No se renovaron tokens de LinkedIn (no era necesario)."
          fi
