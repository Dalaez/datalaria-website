<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibe Coding Area Gradient -->
    <linearGradient id="vibeAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22" />
      <stop offset="80%" stop-color="#f43f5e" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- SDD Area Gradient -->
    <linearGradient id="sddAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#10b981" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Line Gradients -->
    <linearGradient id="vibeLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="30%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="sddLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowVibe" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.45" />
    </filter>

    <filter id="glowSDD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.45" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Curva de Velocidad en el Ciclo de Vida del Software</text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Productividad de ingeniería en el tiempo: Vibe Coding vs. Spec-Driven Development (SDD)</text>
  </g>

  <!-- Legend Section (Top-right) -->
  <g transform="translate(50, 96)">
    <!-- Vibe Legend -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="0" x2="26" y2="0" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
      <circle cx="13" cy="0" r="4" fill="#f43f5e" />
      <text x="36" y="4" fill="#fca5a5" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Vibe Coding (Explosión inicial y colapso por deuda técnica)</text>
    </g>
    <!-- SDD Legend -->
    <g transform="translate(500, 0)">
      <line x1="0" y1="0" x2="26" y2="0" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <circle cx="13" cy="0" r="4" fill="#10b981" />
      <text x="36" y="4" fill="#6ee7b7" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Spec-Driven Development (Inversión inicial y velocidad sostenida)</text>
    </g>
  </g>

  <!-- Chart Grid Area: x from 90 to 930, y from 140 to 450 -->
  <g id="chart-grid">
    <!-- Horizontal Grid Lines -->
    <line x1="90" y1="140" x2="930" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="90" y1="217" x2="930" y2="217" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="90" y1="295" x2="930" y2="295" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="90" y1="372" x2="930" y2="372" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="90" y1="450" x2="930" y2="450" stroke="#334155" stroke-width="1.5" />

    <!-- Y Axis Labels -->
    <text x="80" y="144" fill="#64748b" font-size="11" font-family="monospace" text-anchor="end">100%</text>
    <text x="80" y="221" fill="#64748b" font-size="11" font-family="monospace" text-anchor="end">75%</text>
    <text x="80" y="299" fill="#64748b" font-size="11" font-family="monospace" text-anchor="end">50%</text>
    <text x="80" y="376" fill="#64748b" font-size="11" font-family="monospace" text-anchor="end">25%</text>
    <text x="80" y="454" fill="#64748b" font-size="11" font-family="monospace" text-anchor="end">0%</text>

    <!-- Y Axis Title -->
    <text transform="rotate(-90)" x="-295" y="30" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.08em" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">VELOCIDAD DE ENTREGA</text>

    <!-- X Axis Ticks and Labels -->
    <!-- Week 1: x = 160 -->
    <line x1="160" y1="450" x2="160" y2="456" stroke="#475569" stroke-width="1.5" />
    <text x="160" y="475" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Semana 1</text>

    <!-- Week 2: x = 290 -->
    <line x1="290" y1="450" x2="290" y2="456" stroke="#475569" stroke-width="1.5" />
    <text x="290" y="475" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Semana 2</text>

    <!-- Week 4: x = 440 -->
    <line x1="440" y1="450" x2="440" y2="456" stroke="#475569" stroke-width="1.5" />
    <text x="440" y="475" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Semana 4</text>

    <!-- Week 8: x = 600 -->
    <line x1="600" y1="450" x2="600" y2="456" stroke="#475569" stroke-width="1.5" />
    <text x="600" y="475" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Semana 8</text>

    <!-- Week 12: x = 750 -->
    <line x1="750" y1="450" x2="750" y2="456" stroke="#475569" stroke-width="1.5" />
    <text x="750" y="475" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Semana 12</text>

    <!-- Week 16+: x = 890 -->
    <line x1="890" y1="450" x2="890" y2="456" stroke="#475569" stroke-width="1.5" />
    <text x="890" y="475" fill="#94a3b8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Semana 16+</text>

    <!-- X Axis Title -->
    <text x="510" y="515" fill="#64748b" font-size="11" font-weight="700" letter-spacing="0.08em" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">TIEMPO TRANSCURRIDO (SEMANAS DEL PROYECTO)</text>
  </g>

  <!-- Curve 1: Vibe Coding Path & Area -->
  <path d="M 90 420 C 130 240, 160 150, 200 150 C 250 150, 270 200, 320 250 C 380 320, 420 375, 490 395 C 570 415, 720 422, 930 425 L 930 450 L 90 450 Z"
        fill="url(#vibeAreaGrad)" />
  <path d="M 90 420 C 130 240, 160 150, 200 150 C 250 150, 270 200, 320 250 C 380 320, 420 375, 490 395 C 570 415, 720 422, 930 425"
        fill="none" stroke="url(#vibeLineGrad)" stroke-width="3.5" filter="url(#glowVibe)" stroke-linecap="round" />

  <!-- Curve 2: SDD Path & Area -->
  <path d="M 90 420 C 140 405, 200 365, 290 335 C 370 305, 400 245, 480 205 C 560 170, 700 175, 930 168 L 930 450 L 90 450 Z"
        fill="url(#sddAreaGrad)" />
  <path d="M 90 420 C 140 405, 200 365, 290 335 C 370 305, 400 245, 480 205 C 560 170, 700 175, 930 168"
        fill="none" stroke="url(#sddLineGrad)" stroke-width="3.5" filter="url(#glowSDD)" stroke-linecap="round" />

  <!-- Key Highlights & Annotations -->
  
  <!-- Highlight 1: Vibe Coding Initial Spike (x=200, y=150) -->
  <circle cx="200" cy="150" r="5.5" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
  <line x1="200" y1="150" x2="225" y2="125" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="2 2" />
  <g transform="translate(225, 105)" filter="url(#badgeShadow)">
    <rect width="210" height="42" rx="8" fill="#1e1b4b" stroke="#f43f5e" stroke-width="1.2" />
    <text x="12" y="17" fill="#fecdd3" font-size="11.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif">⚡ Explosión Inicial</text>
    <text x="12" y="32" fill="#fda4af" font-size="10" font-family="system-ui, -apple-system, sans-serif">Prototipado rápido y demos sin contratos</text>
  </g>

  <!-- Highlight 2: Vibe Debt Collapse (x=490, y=395) -->
  <circle cx="490" cy="395" r="5.5" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
  <line x1="490" y1="395" x2="520" y2="350" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="2 2" />
  <g transform="translate(520, 330)" filter="url(#badgeShadow)">
    <rect width="215" height="42" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.2" />
    <text x="12" y="17" fill="#fecdd3" font-size="11.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif">💥 Colapso por Vibe Debt</text>
    <text x="12" y="32" fill="#fda4af" font-size="10" font-family="system-ui, -apple-system, sans-serif">Regresiones y pérdida de contexto</text>
  </g>

  <!-- Highlight 3: SDD Initial Investment (x=290, y=335) -->
  <circle cx="290" cy="335" r="5.5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  <line x1="290" y1="335" x2="260" y2="370" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="2 2" />
  <g transform="translate(140, 370)" filter="url(#badgeShadow)">
    <rect width="235" height="42" rx="8" fill="#042f2e" stroke="#06b6d4" stroke-width="1.2" />
    <text x="12" y="17" fill="#a5f3fc" font-size="11.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif">📐 Inversión en Specs</text>
    <text x="12" y="32" fill="#67e8f9" font-size="10" font-family="system-ui, -apple-system, sans-serif">Contratos tipados y tests antes de codificar</text>
  </g>

  <!-- Highlight 4: SDD Sustained Velocity (x=700, y=173) -->
  <circle cx="700" cy="173" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <line x1="700" y1="173" x2="685" y2="210" stroke="#10b981" stroke-width="1.2" stroke-dasharray="2 2" />
  <g transform="translate(685, 210)" filter="url(#badgeShadow)">
    <rect width="245" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <text x="12" y="17" fill="#a7f3d0" font-size="11.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif">🚀 Velocidad Sostenida</text>
    <text x="12" y="32" fill="#6ee7b7" font-size="10" font-family="system-ui, -apple-system, sans-serif">Compilación determinista sin alucinaciones</text>
  </g>

</svg>
