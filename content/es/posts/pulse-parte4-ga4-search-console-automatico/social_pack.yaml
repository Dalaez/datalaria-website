    insights_60s:
    - 'Ingesta desatendida vía Service Account: sincronización en build time de visitas,
      usuarios, engagement e impresiones por ruta canónica.'
    - 'Principio de Relativización Matemática: anonimización determinista de cifras
      absolutas en percentiles e índices Base 100 conformes con INV-PULSE-2.'
    - 'Matriz de Salud & ROI: detección automática de huérfanos de monetización, alertas
      de frescura (>180 días) y oportunidades orgánicas en SERP.'
