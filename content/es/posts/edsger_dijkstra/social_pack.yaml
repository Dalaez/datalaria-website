      - "VibeCoding"
      - "SDD"
      - "AGI"
  linkedin:
    text: |-
      ☕ En 1956, tomando un café matinal en una terraza de Ámsterdam con su prometida, un joven físico holandés diseñó en veinte minutos —y sin usar papel ni lápiz— el algoritmo que hoy enruta Internet, guía a los satélites GPS y optimiza los grafos de razonamiento en la IA de frontera.

      Pero la verdadera obsesión de Edsger W. Dijkstra no fue la velocidad: fue la corrección matemática absoluta.

      Tres lecciones intemporales de Dijkstra que todo equipo de ingeniería y datos debe recordar en plena fiebre de la IA: 👇

      🎯 La simplicidad no es un lujo: si necesitas papel para diseñar un algoritmo, es que aún es demasiado complejo. Diseñar mentalmente te obliga a podar el ruido.

      🚦 Concurrencia sin bloqueos: inventó los semáforos y la parábola de los Filósofos Comensales (1965) para evitar que procesos independientes mueran por inanición (deadlock).

      🛑 El veto al 'Vibe Coding': «Probar programas demuestra la presencia de errores, jamás su ausencia». Confiar en código generado por un LLM sin especificación formal previa es la reencarnación del código espagueti con GOTO.

      En Datalaria aplicamos su principio cada día: ningún agente de IA escribe una línea de código sin contratos tipados, invariantes formales y un verificador independiente con derecho a veto.

      📖 Lee el ensayo biográfico y técnico completo sobre Edsger Dijkstra: https://datalaria.com/es/posts/edsger_dijkstra/

      💬 ¿Hasta qué punto permites que tu equipo o tus agentes de IA generen código sin una especificación formal previa?
