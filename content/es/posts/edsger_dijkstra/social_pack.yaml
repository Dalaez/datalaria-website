es:
  x:
    hook: "En 1956 Edsger Dijkstra diseñó el algoritmo de caminos mínimos en 20 minutos en un café sin papel ni lápiz. Hoy explica por qué el Vibe Coding colapsa."
    thread:
      - "1/5 Diseñó el algoritmo de caminos mínimos en 20 minutos en una terraza de Ámsterdam sin usar papel ni lápiz. Edsger Dijkstra demostró que la elegancia mental previa ahorra millones de horas de cómputo inútil."
      - "2/5 Cuando fue a casarse en 1957, el registro civil denegó su oficio de 'Programador de ordenadores' porque no existía en las leyes holandesas. Tuvo que registrarse como 'Físico Teórico' para poder celebrar la boda."
      - "3/5 En 1968 sentenció: 'El testeo demuestra la presencia de bugs, jamás su ausencia'. Su cruzada contra el GOTO y su semántica formal sentaron las bases para deducir software en lugar de construirlo por ensayo y error."
      - "4/5 En 2026, pedir código a ciegas a un LLM (Vibe Coding) revive el caos del GOTO. La respuesta de Dijkstra hoy es el Spec-Driven Development (SDD): especificación previa e invariantes antes de generar código."
      - "5/5 Descubre la fascinante biografía, anécdotas y lecciones para la era de la AGI del gran maestro del rigor formal en Datalaria: https://datalaria.com/es/posts/edsger_dijkstra/"
