  newsletter:
    archetype: "real_case_number"
    subject: "20 minutos en una terraza de Ámsterdam (y por qué Dijkstra odiaría el Vibe Coding)"
    preheader: "La vida de Edsger Dijkstra: el algoritmo de caminos mínimos sin papel, los semáforos y la verificación formal frente al caos de la IA."
    hook_paragraphs:
      - "En la primavera de 1956, paseando por los canales de Ámsterdam con su prometida, Edsger Dijkstra se sentó a tomar un café y diseñó en veinte minutos de pura abstracción mental el algoritmo que hoy hace funcionar a Google Maps y al enrutamiento de Internet."
      - "En esta entrega de Pioneros y Referentes analizamos por qué este catedrático del MIT y Austin —que se negaba a tener un ordenador en su despacho y escribía a mano más de 1.300 cartas con pluma estilográfica— habría considerado al Vibe Coding la mayor amenaza para la fiabilidad de la AGI."
    insights_60s:
      - "Optimalidad voraz en 20 minutos: la relajación de aristas de Dijkstra demuestra que una buena estructura matemática elimina la necesidad de fuerza bruta combinatoria."
      - "Concurrencia y semáforos: resolver el problema de los Filósofos Comensales es el plano maestro para gobernar enjambres de subagentes autónomos sin condiciones de carrera."
      - "El fin de la adivinación: probar código demuestra fallos, no corrección. La única garantía frente a alucinaciones de IA es el Spec-Driven Development con verificación determinista."
    secondary_cta_label: "Explorar Modelos Cuantitativos y Recursos en Datalaria"
    secondary_cta_url: "https://datalaria.com/es/recursos/"
    ps_referral_text: "Si conoces a un ingeniero o directivo tentado por el Vibe Coding ciego, reenvíale esta historia sobre el poder de la especificación formal."
