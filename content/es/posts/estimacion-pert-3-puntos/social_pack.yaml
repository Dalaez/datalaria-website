  linkedin:
    text: 'Si un camino crítico encadena 15 tareas estimadas al 50 % de probabilidad,
      la probabilidad matemática de cumplir la fecha fija es del 0,003 %.


      ⚠️ Aun así, muchos comités de dirección siguen aprobando cronogramas deterministas
      de un solo punto como si la incertidumbre técnica no existiera.


      📘 Acabo de publicar la guía cuantitativa de Estimación PERT de 3 Puntos Estocástica
      (PMBOK 7th & Teorema del Límite Central) en Datalaria:


      🔹 Distribución Beta y agregación CLT: convertimos ternas (o, m, p) en duración
      esperada μ y desviación estándar √(Σσ²), sin inflar plazos linealmente.


      🔹 Auditoría Z-Score para fechas compromiso: en nuestro caso real (25 WBS, 15
      críticas), exigir 125 días frente a μ = 132,5 días (σ = 11,80) daba Z = -0,636
      y 65,8 % de fracaso.


      🔹 Project Buffer P90 y Crashing por ROI: aprobar 148 días (buffer de 15,1 días
      gobernado por PMO) y reserva de 12.200 € permitió entregar en el día 142 con
      6 días de margen.


      🔹 Executive Decision Pack (6 € oferta desde 19 €): motor Excel de 25 paquetes
      WBS, calculadora Z-Score, Matriz de Crashing, Guía PDF y Deck 16:9.


      📖 Lee la metodología completa, fórmulas y protocolo anti-sesgos aquí: https://datalaria.com/es/posts/estimacion-pert-3-puntos/


      💬 En tu organización, ¿seguís comprometiéndoos con fechas modales únicas o ya
      exigís el percentil P80/P90 antes de firmar ante el Consejo?'
    hashtags: *id001
  newsletter:
    archetype: counterintuitive_question
    subject: ¿Por qué un cronograma con 15 tareas al 50% solo tiene un 0,003% de éxito?
    preheader: Distribución Beta PERT de 3 puntos, agregación CLT, Z-Score y Project
      Buffers P90 para defender plazos.
    hook_paragraphs:
    - 'Cuando un equipo compromete una fecha fija de Go-Live sumando duraciones de
      un solo punto, el proyecto suele estar estadísticamente vencido antes de empezar:
      la asimetría del riesgo técnico, la Ley de Parkinson y el Síndrome del Estudiante
      devoran cualquier margen oculto.'
    - En nuestra nueva guía cuantitativa aplicamos la Estimación PERT de 3 Puntos
      (PMBOK 7th) y el Teorema del Límite Central (CLT) para calcular la probabilidad
      real de cumplimiento y dimensionar Project Buffers científicos ante el Consejo.
    insights_60s:
    - 'La suma modal miente: 15 tareas críticas al 50 % arrojan un (0,5)^15 = 0,003
      % de éxito conjunto; PERT Beta pondera μ = (o + 4m + p) / 6.'
    - 'Suma varianzas, nunca desviaciones: el CLT demuestra que σ_total = √(Σσ²),
      reduciendo hasta 3x la incertidumbre aparente frente al pánico lineal.'
    - 'Caso real (25 WBS): 125 días tenía solo un 34,2 % de éxito (Z = -0,636); fijar
      P90 en 148 días (buffer de 15,1 días) y 12.200 € de crashing entregó el día
      142.'
    secondary_cta_label: Ver Pack PERT 3 Puntos (6€)
    secondary_cta_url: https://datalaria.com/es/recursos/?utm_source=newsletter&utm_medium=email&utm_campaign=pert-launch#pack-pert
    ps_referral_text: P.D. Si conoces a algún PMO, CTO o director de operaciones defendiendo
      fechas imposibles ante Dirección, reenvíale este análisis.
