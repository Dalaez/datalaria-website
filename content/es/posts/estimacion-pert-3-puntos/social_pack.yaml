es:
  x:
    hook: Prometer una fecha fija con 15 tareas críticas al 50% equivale a un 0,003%
      de éxito conjunto. Así blindas cronogramas al P90 con PERT de 3 puntos, CLT
      y Project Buffers.
    thread:
    - '1/5 La falacia determinista: sumar estimaciones modales ignora la asimetría
      del riesgo técnico, la Ley de Parkinson y el Síndrome del Estudiante. El cronograma
      nace vencido antes del primer commit.'
    - '2/5 El modelo PERT Beta (PMBOK 7th) calibra tres escenarios sin sesgo: Optimista
      (o), Más Probable (m) y Pesimista (p). Calcula μ = (o + 4m + p) / 6 y varianza
      individual σ² = ((p - o) / 6)².'
    - 3/5 Por el Teorema del Límite Central (CLT), en el Camino Crítico se suman varianzas
      (σ_proj² = Σσ²), nunca desviaciones estándar. Evitas colchones inflados y ofertas
      fuera de mercado.
    - '4/5 Caso real cloud (25 WBS, 15 críticas): pedían 125 días vs media 132,5 días
      (σ=11,80). Z=-0,636 daba solo 34,2% de éxito. Con P90 (148 días, buffer 15,1
      días) y 12.200 € en crashing, entregó el día 142.'
    - '5/5 Guía completa con fórmulas CLT, tabla Z-Score, protocolo anti-sesgos y
      Executive Decision Pack en Excel + PPTX 16:9 + PDF (6 €): https://datalaria.com/es/posts/estimacion-pert-3-puntos/'
