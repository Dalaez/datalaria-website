  linkedin:
    text: |-
      Un condensador de 1,85 € puede bloquear una línea de ensamblaje entera con 145 € de margen por unidad y más de 174.000 € de EBITDA anual en riesgo.

      Cuando un fabricante de silicio emite una notificación PDN o End-of-Life (EOL), la sala de dirección queda dividida en dos bandos irreconciliables: Operaciones exigiendo una compra de emergencia para 3 años y Finanzas frenando un CAPEX no presupuestado que inmoviliza tesorería.

      La raíz del problema casi siempre es metodológica: usar modelos de reposición continua (ROP / EOQ) cuando el proveedor acaba de anunciar el cierre definitivo de la línea.

      Este miércoles 9 de diciembre lanzamos la Parte 8 de la serie técnica de Obsolescencia y el nuevo Executive Risk Cockpit v2.0 de Agentic Radar junto al Kit B2B IEC 62402 (pack-obs):

      1️⃣ Relevo en el ciclo de vida (sin solapamientos): pack-stock (7 € · APICS) gobierna la fase de Madurez con proveedor activo; en cuanto entra un aviso PCN/PDN/EOL se congela el ROP automático y toma el relevo pack-obs (19 € · IEC 62402).

      2️⃣ Explosión determinista del grafo BOM sin ciclos: recorrido ascendente MPN -> AML -> Subensamblaje -> SKU con deduplicación exacta de margen P&L y cero dependencias externas (< 34 KB gzipped).

      3️⃣ Modelo financiero LTB vs. Rediseño FFF: derivación del colchón puente único SS_LTB, impacto real del WACC y punto de equilibrio frente al NRE de ingeniería, con importador CSV 100 % local en tu navegador.

      Puedes probar hoy mismo el simulador interactivo en la Web App gratuita o revisar la guía completa y su Kit Excel de 5 hojas + Playbook PDF + Blueprint PostgreSQL RLS.

      En vuestra planta o ingeniería de componentes, ¿cómo decidís hoy entre ejecutar un Last Time Buy para varios años o financiar el rediseño de placa?

      🔗 Guía completa y simulador en vivo: https://www.datalaria.com/es/posts/obs_parte8_simulador_ltb_v2/
