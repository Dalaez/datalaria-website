  x:
    hook: "Gastar el 50 % del presupuesto a mitad de plazo no significa ir bien: puede ocultar un sobrecoste de 195.349 €. Así auditas proyectos con EVM, Curva S, 27 criterios EIA-748 y Agile-EVM."
    thread:
      - "1/5 La trampa de la contabilidad tradicional: gastar 600.000 € de 1.200.000 € en el Mes 6 parece 'ir en presupuesto'. Pero si tu Avance Técnico Real (EV) es del 43 % (516.000 €), ya pierdes 84.000 € netos."
      - "2/5 El Cuadro de Mando EVM unifica alcance físico (EV), cronograma (PV) y coste real (AC). Con CPI = EV/AC (0.86) y SPI = EV/PV (0.86) sabes al 15-20 % de avance si el proyecto destruye capital o pierde velocidad."
      - "3/5 Modelos predictivos al cierre: EAC1 Típico (BAC/CPI = 1.395.349 €), EAC2 Atípico (1.284.000 €) y EAC3 Compuesto (1.524.824 €). El TCPI = (BAC-EV)/(BAC-AC) da 1.14x: superar 1.10x es estadísticamente inalcanzable."
      - "4/5 Novedad normativa y metodológica: el estándar EIA-748-E condensa los antiguos 32 criterios en 27 directrices EVMS en 5 grupos de procesos (PMBOK), y Agile-EVM permite gobernar Sprints con Story Points y DoD 0/100."
      - "5/5 Guía completa con los 10 conceptos EVM, 27 criterios EIA-748, Agile-EVM Híbrido y Executive Decision Pack en Excel + PPTX 16:9 + PDF (8 €): https://datalaria.com/es/posts/cuadro-mando-evm-valor-ganado/"
