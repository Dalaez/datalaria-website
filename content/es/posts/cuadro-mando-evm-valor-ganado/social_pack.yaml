    secondary_cta_url: "https://datalaria.com/es/recursos/?utm_source=newsletter&utm_medium=email&utm_campaign=evm-launch#pack-evm"
    ps_referral_text: "P.D. Si conoces a algún CFO, COO o director de PMO defendiendo desviaciones presupuestarias en comité, reenvíale esta guía."
