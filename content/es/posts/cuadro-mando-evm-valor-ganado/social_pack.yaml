  linkedin:
    text: |-
      Si un proyecto de 1.200.000 € ha gastado exactamente 600.000 € al llegar al Mes 6, la contabilidad tradicional declara solemnemente que marcha "en presupuesto".

      ⚠️ Esa lectura es una peligrosa ficción estadística: si el Avance Técnico Real es apenas del 43 % (516.000 € de Valor Ganado), el proyecto arrastra ya 84.000 € de sobrecoste oculto y 3 semanas de retraso crítico.

      📘 Acabo de publicar la guía técnica completa del Cuadro de Mando EVM (Valor Ganado, Curva S y Proyecciones EAC) en Datalaria:

      🔹 Los 10 conceptos rectores sin ambigüedades: cómo conectar Avance Técnico Real, BAC, PV, EV, AC, CV/SV, CPI/SPI, modelos de cierre EAC1/EAC2/EAC3 y el test de viabilidad TCPI ante el Consejo.

      🔹 Estándar EIA-748-E (27 Directrices EVMS acorde al PMBOK): desglose completo de los 5 grupos de procesos que sustituyen a los 32 criterios históricos, citando el análisis de Roland Wanner.

      🔹 Aplicación del EVM en Entornos Híbridos (Agile-EVM): cómo combinar gobernanza CAPEX por Cuentas de Control con Sprints de 2 semanas mediante Story Points, regla 0/100 vía Definition of Done y Scope Swapping.

      🔹 Executive Decision Pack listo para Comité (8 € oferta desde 25 €): libro Excel ECMA-376 con Curva S M01-M12 y 25 paquetes WBS, Guía Metodológica PDF de 5 páginas y Deck C-Level 16:9.

      📖 Lee la guía metodológica completa, fórmulas y caso de rescate de 1,2M € aquí: https://datalaria.com/es/posts/cuadro-mando-evm-valor-ganado/

      💬 En tus comités de dirección, ¿seguís evaluando proyectos comparando solo gasto contra calendario o ya auditas CPI, SPI y TCPI antes de aprobar rescates?
