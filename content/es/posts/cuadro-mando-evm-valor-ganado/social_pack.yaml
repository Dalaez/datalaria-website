  newsletter:
    archetype: "counterintuitive_question"
    subject: "¿Por qué gastar el 50 % a mitad de proyecto oculta un sobrecoste de 195.349 €?"
    preheader: "Los 10 conceptos EVM, Curva S, las 27 directrices EIA-748, Agile-EVM híbrido y modelos EAC/TCPI ante el CFO."
    hook_paragraphs:
      - "Cuando un megaproyecto de 1.200.000 € ha consumido exactamente 600.000 € en el Mes 6, los informes financieros clásicos suelen felicitar al equipo por ir en presupuesto. Sin embargo, el gasto contable no mide cuánto alcance físico real se ha producido."
      - "En nuestra nueva guía ejecutiva de Datalaria desglosamos el estándar de Earned Value Management (EVM / EIA-748 de 27 directrices y enfoque Híbrido PMBOK) para anticipar sobrecostes desde el 15-20 % de ejecución y defender proyecciones EAC y TCPI ante el Consejo."
    insights_60s:
      - "El principio de oro del EV: el Valor Ganado (EV = BAC × % Avance Técnico) mide entregables validados, nunca horas ni facturas pagadas; con CPI = 0.86 cada euro solo produce 0,86 €."
      - "Test estadístico TCPI > 1.10x: prometer terminar en presupuesto original cuando TCPI = 1.14 exige un salto de productividad del 32,5 % inviable según el PMBOK; EAC1 proyecta 1.395.349 €."
      - "De Cascada a Híbrido: el EVM moderno combina las 27 directrices EIA-748 en Cuentas de Control macro con Sprints ágiles medidos por Story Points terminados bajo Definition of Done (regla 0/100)."
