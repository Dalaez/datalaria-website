    archetype: "invisible_error"
    subject: "El error de las '3 semanas de stock' que inmoviliza 4,5M € y provoca roturas"
    preheader: "Convolución estocástica SS3, ROP, Wilson EOQ, ciclo de vida IEC 62402 (PCN/PDN/LTB) y palancas de Working Capital."
    hook_paragraphs:
      - "Cuando dirección comercial exige más colchón de inventario tras un 7 % de roturas y finanzas ordena un recorte lineal del 20 % para rescatar el ROCE, el problema real rara vez es la falta de almacén: es usar reglas de cobertura planas."
      - "En nuestra nueva guía ejecutiva de Datalaria explicamos cómo sustituir la intuición por el modelo estocástico APICS / MIT CTL (SS, ROP, EOQ), acoplándolo al Radar de Obsolescencia IEC 62402 para bloquear el Dead Stock antes de un End of Life."
    insights_60s:
      - "Asimetría de σL frente a L: como la impuntualidad del proveedor se multiplica por d², reducir σL a la mitad libera más caja neta que lograr un 2 % de descuento unitario."
      - "Frontera asintótica de servicio: subir el CSL del 95 % al 99,9 % dispara el Stock de Seguridad un +87 %; segmentar por ABC (98 % en Clase A, 90 % en Clase C) protege el margen."
      - "Regla anti-Dead Stock (IEC 62402): ante un aviso PDN y ventana LTB, desactiva el disparo automático de ROP y dimensiona una única compra puente."
