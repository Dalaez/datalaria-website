  x:
    hook: "Tener '3 semanas de stock para todo' dispara un 7 % de roturas mientras inmoviliza 4,5M € en almacén. Así calculan SS, ROP y EOQ en APICS / MIT CTL con riesgo IEC 62402:"
    thread:
      - "1/5 La paradoja de tesorería más común en industria: el equipo comercial exige subir stock tras un 7 % de roturas en estrellas, mientras el CFO ve 4,5M € atrapados y -3 puntos de ROCE."
      - "2/5 La culpa es la heurística plana ('3 semanas de todo'). Tratar un chip de Taiwán (45 días, alta volatilidad) igual que cajas de embalaje (48h) sobre-almacena lo estable e infradota lo crítico."
      - "3/5 La convolución estocástica integral (SS3) modela demanda (d, σd) y retraso del proveedor (L, σL): SS = Z·√(L·σd² + d²·σL²). Recortar a la mitad σL ahorra el doble de caja que un 2 % en tarifa."
      - "4/5 Blindaje ante obsolescencia (IEC 62402 / JEDEC): al entrar un PCN o PDN hay que suspender el ROP recurrente y dimensionar el Last Time Buy (LTB) conectando con nuestro Radar de Obsolescencia."
      - "5/5 Guía completa con ciclo Diente de Sierra, Wilson EOQ y Executive Pack Excel + PPTX 16:9 + PDF (7€ oferta desde 22€): https://datalaria.com/es/posts/calculadora-stock-seguridad-rop/"
