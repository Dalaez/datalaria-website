  linkedin:
    text: |-
      "Tenemos 4,5 millones de euros inmovilizados en existencias y aun así sufrimos un 7 % de roturas en nuestros productos estrella".

      ⚠️ Esta contradicción ocurre cada semana en consejos de administración cuando el inventario se gobierna mediante reglas empíricas ("tener 3 semanas de todo") en lugar de probabilidad estocástica.

      📘 Este jueves publico la guía metodológica completa de la Calculadora de Stock de Seguridad & ROP en Datalaria:

      🔹 Motor estocástico integral (APICS / MIT CTL): cómo modelar la variabilidad conjunta de demanda (σd) y la impuntualidad del proveedor (σL) para calibrar el Punto de Pedido (ROP) y el Lote Óptimo (EOQ).

      🔹 Ingeniería de Ciclo de Vida (IEC 62402 & JEDEC): qué son PCN, PDN, LTB y EOL, y cómo conectar el cálculo de existencias con nuestro Radar de Obsolescencia para congelar el ROP antes de acumular Dead Stock.

      🔹 Palancas de tesorería para el CFO: por qué reducir a la mitad la desviación del proveedor (σL) libera más capital circulante que negociar un descuento del 2 % en tarifa unitaria.

      🔹 Executive Decision Pack listo para Comité (7 € oferta desde 22 €): Excel ECMA-376 de 35 SKUs con Gráfico Diente de Sierra, Guía PDF de 5 páginas y Deck C-Level 16:9.

      📖 Consulta las fórmulas, tablas ABC y arquitectura completa aquí: https://datalaria.com/es/posts/calculadora-stock-seguridad-rop/

      💬 En vuestra cadena de suministro, ¿seguís usando semanas fijas de cobertura o ya vinculáis SS, ROP y avisos PDN/LTB para liberar caja?
