    thread:
      - "1/5 The traditional accounting trap: burning $600k of $1.2M at Month 6 looks 'on budget'. Yet if Technical Progress (EV) is only 43% ($516k), you already carry an $84k overrun and a 3-week critical delay."
      - "2/5 Earned Value Management unifies physical scope (EV), schedule (PV), and actual cost (AC). CPI = EV/AC (0.86) and SPI = EV/PV (0.86) expose capital destruction by the 15-20% completion mark."
      - "3/5 Mathematical closeout models: Typical EAC1 (BAC/CPI = $1,395,349), Atypical EAC2 ($1,284,000), and Combined EAC3 ($1,524,824). TCPI = (BAC-EV)/(BAC-AC) hits 1.14x—anything above 1.10x is unachievable."
