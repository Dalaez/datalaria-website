    thread:
      - "1/5 In late 2023 Javi López (@javilopen) and Emilio Nicolás built Magnific AI in 3 months on <$5K. After selling Erasmusu, ~50% of their new codebase was co-written with Cursor and Claude."
      - "2/5 Their contrarian insight: while LLMs fought to suppress hallucinations, they built a Tiled Latent Diffusion pipeline with a 'Controlled Hallucination' dial (Creativity vs. Resemblance)."
      - "3/5 Zero ad spend, paid-only from day 1. Backed by 18 months of building in public on X: Beeple adopted it daily by Dec 19, and on Jan 8 2024 Elon Musk replied 'Computer, enhance!'."
      - "4/5 Five months and 725K users later, Freepik acquired Magnific for €20M+ cash & earn-outs. On April 28, 2026 the entire parent group rebranded to Magnific at $230M ARR."
