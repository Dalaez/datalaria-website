  x:
    hook: "In 1960, Norbert Wiener issued humanity's earliest warning on AI alignment: a fast machine will ruthlessly execute what you literally specified, not what you truly meant."
    thread:
      - "1/5 He dragged a finger along MIT brick walls so he wouldn't wander off while reading Greek poetry—yet Norbert Wiener founded Cybernetics and formalized the closed feedback loop behind modern agents."
      - "2/5 During WWII, building an anti-aircraft predictor led him to a universal mathematical insight: biological minds and engineered machines survive through error measurement and continuous feedback."
      - "3/5 Decades before RLHF or multi-agent systems, Wiener cited Goethe's Sorcerer's Apprentice: hand your goals to an uninterruptible system and any gap in your objective function becomes dangerous."
      - "4/5 Today, as reasoning models negotiate actions across open protocols in microseconds, every guardrail and operational feedback check still traces back to his kybernetes—the steersman."
      - "5/5 Dive into the life, MIT folklore, and prophetic AI control warnings of the Father of Cybernetics: https://datalaria.com/en/posts/norbert_wiener/"
