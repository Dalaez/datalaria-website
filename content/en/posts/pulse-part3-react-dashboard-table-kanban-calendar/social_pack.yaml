    subject: A zero-latency React 19 dashboard built over a static index
    preheader: How to engineer a high-performance React 19 SPA delivering analytics,
      Kanban boards, and calendars over static data.
    hook_paragraphs:
    - Having a clean structured dataset on disk is useless if your editorial team
      has to inspect it via terminal commands. An executive cockpit was essential.
    - In this third installment, we break down our React 19 + TypeScript Single Page
      Application that mounts directly over a precompiled static index.
    insights_60s:
    - 'Zero network latency: the SPA fetches public.json once and executes instant
      search, multi-column sorting, and filtering in client memory.'
    - 'Triple interactive projection: audit table for catalog hygiene, Kanban board
      for editorial velocity, and monthly release calendar.'
    - 'Optimistic idea capture: client-side drafting and workflow updates with deterministic
      export back to Markdown front matter.'
