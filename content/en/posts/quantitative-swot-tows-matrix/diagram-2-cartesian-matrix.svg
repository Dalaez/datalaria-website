<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 520px;" viewBox="0 0 520 520" role="graphics-document document" aria-roledescription="quadrantChart" xmlns:xlink="http://www.w3.org/1999/xlink"><style xmlns="http://www.w3.org/1999/xhtml">@import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css");</style><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="273" y="45" width="242" height="222" fill="#EFF6FF"/><text x="0" y="0" fill="#1E40AF" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(394, 50) rotate(0)">OFFENSIVE (SO)</text></g><g class="quadrant"><rect x="31" y="45" width="242" height="222" fill="#FFFBEB"/><text x="0" y="0" fill="#92400E" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(152, 50) rotate(0)">TURNAROUND (WO)</text></g><g class="quadrant"><rect x="31" y="267" width="242" height="222" fill="#FFF1F2"/><text x="0" y="0" fill="#9F1239" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(152, 272) rotate(0)">SURVIVAL (WT)</text></g><g class="quadrant"><rect x="273" y="267" width="242" height="222" fill="#F0FDFA"/><text x="0" y="0" fill="#0F766E" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(394, 272) rotate(0)">DEFENSIVE (ST)</text></g></g><g class="border"><line x1="30" y1="45" x2="516" y2="45" style="stroke: rgb(203, 213, 225); stroke-width: 2;"/><line x1="515" y1="46" x2="515" y2="488" style="stroke: rgb(203, 213, 225); stroke-width: 2;"/><line x1="30" y1="489" x2="516" y2="489" style="stroke: rgb(203, 213, 225); stroke-width: 2;"/><line x1="31" y1="46" x2="31" y2="488" style="stroke: rgb(203, 213, 225); stroke-width: 2;"/><line x1="273" y1="46" x2="273" y2="488" style="stroke: rgb(148, 163, 184); stroke-width: 1;"/><line x1="32" y1="267" x2="514" y2="267" style="stroke: rgb(148, 163, 184); stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="398.84" cy="164.88" r="5" fill="#2563EB" stroke="#2563EB" stroke-width="0px"/><text x="0" y="0" fill="#0F172A" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(398.84, 169.88) rotate(0)">Apex Eng. (+2.10, +1.85)</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#475569" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(152, 499) rotate(0)">Weaknesses (-X)</text></g><g class="label"><text x="0" y="0" fill="#475569" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(394, 499) rotate(0)">Strengths (+X)</text></g><g class="label"><text x="0" y="0" fill="#475569" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 378) rotate(-90)">Threats (-Y)</text></g><g class="label"><text x="0" y="0" fill="#475569" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 156) rotate(-90)">Opportunities (+Y)</text></g></g><g class="title"><text x="0" y="0" fill="#0F172A" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(260, 10) rotate(0)">Cartesian Strategic Positioning Matrix</text></g></g></svg>