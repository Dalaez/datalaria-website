    hook: 'Markdown is great for writing but terrible as an untyped database: a single
      typo in YAML front matter silently breaks your static site generator.'
    thread:
    - '1/5 Adopting Git as your Single Source of Truth introduces a major dilemma:
      Markdown YAML front matter lacks a type-checking compiler.'
    - 2/5 A misspelled dictionary key ('category' vs 'categories') or unformatted
      dates silently crash static generators like Hugo, Astro, or Next.js.
    - '3/5 In Datalaria Pulse, we resolve this with Pydantic v2: modeling ContentAsset
      with strict validators and bipartite graph resolution for ES/EN parity.'
    - '4/5 In GitHub Actions, we enforce a strict Fail-Closed policy: if a single
      asset violates validation schemas, the production build aborts immediately.'
    - '5/5 Discover our data contracts, custom validators, and full CI/CD workflow
      in Part 2: https://datalaria.com/en/posts/pulse-part2-pydantic-indexer-bilingual-parity-ci/'
