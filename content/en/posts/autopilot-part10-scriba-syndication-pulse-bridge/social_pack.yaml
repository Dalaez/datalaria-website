    hook_paragraphs:
      - "For months it felt natural to run live agent crews inside GitHub Actions after every git push. Production reality proved the opposite: CI pipelines thrive on deterministic contracts, speed, and zero surprises."
      - "In Chapter 10 closing our Autopilot series, we walk through how we moved creative drafting to Datalaria Scriba at design time while letting Pydantic v2 govern email, social, and syndication—clearing the runway for Datalaria Pulse on November 18."
    insights_60s:
      - "Anti-churn email contracts: quality_validator.py bans robotic subject prefixes and guarantees a >80% visible text ratio with a single clickable Hero image."
      - "Zero-cost X and Broetry LinkedIn gates: exact t.co weighted URL length auditing, 4-6 tweet threads, and mandatory closing debate questions before any push."
      - "Universal Markdown compiler: transforms Hugo shortcodes safely for Dev.to and CoderLegion while honoring unreleased app embargoes and canonical attribution."
