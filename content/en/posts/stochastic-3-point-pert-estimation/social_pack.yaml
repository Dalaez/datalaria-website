  x:
    hook: Promising a fixed date across 15 critical tasks at 50% odds yields a 0.003%
      joint success rate. Here is how 3-Point PERT, CLT, and Project Buffers hit P90.
    thread:
    - '1/5 The deterministic fallacy: adding modal task durations ignores right-tail
      engineering risk, Parkinson''s Law, and Student Syndrome. Your schedule is statistically
      doomed before the first commit.'
    - '2/5 Beta PERT (PMBOK 7th) captures three bias-free scenarios: Optimistic (o),
      Most Likely (m), and Pessimistic (p). It computes μ = (o + 4m + p) / 6 and variance
      σ² = ((p - o) / 6)².'
    - 3/5 Via the Central Limit Theorem (CLT), Critical Path variances add quadratically
      (σ_proj² = Σσ²), never standard deviations linearly. You eliminate bloated padding
      and uncompetitive bids.
    - '4/5 Cloud case study (25 WBS, 15 critical): target 125 days vs μ=132.5 (σ=11.80)
      gave Z=-0.636 (34.2% odds). Locking P90 at 148 days (15.1-day buffer) + $12,200
      crashing shipped on Day 142.'
    - '5/5 Full guide with CLT math, Z-Score matrix, pre-mortem protocol, and Excel
      + 16:9 PPTX + PDF Executive Pack (6€): https://datalaria.com/en/posts/stochastic-3-point-pert-estimation/'
