    hook: "80% of corporate 5x5 risk matrices cluster threats into 'amber noise' without pricing expected loss or detection blindness. Here is how ISO 31000 + AIAG-VDA FMEA (RPN & CER) fixes it."
    thread:
      - "1/5 The qualitative last-mile fallacy: a €40k workflow bug and a €4M GDPR breach end up sharing the exact same 'Red Risk' label. Your CFO has zero objective basis to rank mitigation CAPEX."
      - "2/5 The Detection blindspot: classic Probability x Impact grids assume you catch failures instantly. Operational FMEA adds inverse Detection (D=1-10): zero real-time telemetry means critical risk."
      - "3/5 Why AIAG-VDA killed flat RPN cutoffs: Severity 10 x Occurrence 2 x Detection 3 = 60 (catastrophic) used to lose against a cosmetic bug at RPN 90. Action Priority enforces immediate vetoes when S>=9 or RPN>=120."
      - "4/5 Payment gateway case study: bank timeout at RPN 336 (€190k at risk). Multi-acquirer smart routing + circuit breakers (€28k CAPEX) slashed RPN to 32 (-90.5%), ringfencing €165k net (CER 5.89x)."
      - "5/5 Full quantitative guide with E(L) math, 1-10 calibration tables, 4-sheet Excel engine & 16:9 Board Deck (7€): https://datalaria.com/en/posts/quantitative-risk-matrix-fmea/"
