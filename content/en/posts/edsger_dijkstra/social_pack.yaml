    hook: "In 1956, Edsger Dijkstra designed the shortest-path algorithm in 20 minutes at a café with no pen or paper. Today, he explains why Vibe Coding collapses."
    thread:
      - "1/5 Conceived the shortest-path algorithm in 20 minutes on an Amsterdam sunlit terrace without pen or paper. Edsger Dijkstra proved that upfront mental elegance saves millions of hours of wasted compute."
      - "2/5 When marrying in 1957, the civil registry rejected his stated profession of 'Computer Programmer' because it didn't exist in Dutch law. He had to register as a 'Theoretical Physicist' to tie the knot."
      - "3/5 In 1968, he declared: 'Program testing can be used to show the presence of bugs, but never to show their absence!' His crusade against GOTO laid the foundation for deducing software rather than guessing."
      - "4/5 In 2026, prompting LLMs blindly (Vibe Coding) revives the chaos of spaghetti GOTO. Dijkstra's answer today is Spec-Driven Development (SDD): formal specifications and verified invariants before code."
      - "5/5 Dive into the life, eccentric folklore, and timeless lessons for the AGI era of the master of formal verification at Datalaria: https://datalaria.com/en/posts/edsger_dijkstra/"
